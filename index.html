<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>29CM 프로젝트슬립 광고 리포트</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#fbfcfe; --text:#0f172a; --muted:#64748b;
    --border:#e2e8f0; --grid:#eef2f6;
    --gross:#94a3b8; --net:#2563eb; --cost:#ef4444;
    --roas-nom:#8b5cf6; --roas-adj:#10b981; --roas-ad:#f59e0b;
    --good:#059669; --bad:#dc2626; --warnbg:#fff7ed; --warnbd:#fed7aa; --warntx:#9a3412;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --panel:#111a2b; --panel2:#0f1728; --text:#e5edf7; --muted:#93a4bd;
      --border:#22304a; --grid:#1a2740;
      --gross:#64748b; --net:#3b82f6; --cost:#f87171;
      --roas-nom:#a78bfa; --roas-adj:#34d399; --roas-ad:#fbbf24;
      --good:#34d399; --bad:#f87171; --warnbg:#2a1c0e; --warnbd:#7c4a1e; --warntx:#fdba74;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between;margin-bottom:20px}
  h1{font-size:22px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel);
    color:var(--text);padding:8px 14px;border-radius:9px;transition:.15s}
  button:hover{border-color:var(--net)}
  button.primary{background:var(--net);border-color:var(--net);color:#fff}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px}
  .seg button{border:none;background:transparent;padding:7px 16px;border-radius:8px;color:var(--muted)}
  .seg button.on{background:var(--net);color:#fff}
  .banner{border:1px solid var(--warnbd);background:var(--warnbg);color:var(--warntx);
    border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:13.5px}
  .banner b{color:inherit}
  .banner ol{margin:8px 0 0;padding-left:20px}
  .banner code{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:5px;font-size:12px}
  @media(prefers-color-scheme:dark){.banner code{background:rgba(255,255,255,.1)}}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
  .card .lab{font-size:12px;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .card .val{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .card .val small{font-size:13px;font-weight:600;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px 18px 8px;box-shadow:var(--shadow);margin-bottom:20px}
  .panel h2{font-size:15px;margin:0 0 4px}
  .panel .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){.charts{grid-template-columns:1fr}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 10px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .chartbox{width:100%;overflow-x:auto}
  svg text{fill:var(--muted)}
  .tblwrap{overflow-x:auto;margin-top:4px}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
  th,td{padding:9px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel);text-align:right}
  th:first-child,td:first-child{text-align:left}
  tbody tr:hover{background:var(--panel2)}
  td.num{font-variant-numeric:tabular-nums}
  .pos{color:var(--good);font-weight:600}
  .neg{color:var(--bad);font-weight:600}
  .muted{color:var(--muted)}
  .partial{cursor:help;border-bottom:1px dotted var(--muted)}
  .bdg{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;vertical-align:middle;cursor:help;white-space:nowrap}
  .bdg.prov{background:#fff1e6;color:#b45309;border:1px solid #fed7aa}
  .bdg.conf{background:#e8f7ef;color:#047857;border:1px solid #a7f3d0}
  .bdg.hi{background:#fdecec;color:#b91c1c;border:1px solid #fecaca}
  .bdg.mid{background:#fff1e6;color:#b45309;border:1px solid #fed7aa}
  .bdg.lo{background:#fefce8;color:#a16207;border:1px solid #fde68a}
  .bdg.good{background:#e8f7ef;color:#047857;border:1px solid #a7f3d0}
  @media(prefers-color-scheme:dark){
    .bdg.prov{background:#3a2a12;color:#fbbf24;border-color:#7c5a1e}
    .bdg.conf{background:#0f2f22;color:#34d399;border-color:#1e6b4a}
    .bdg.hi{background:#3b1717;color:#fca5a5;border-color:#7f1d1d}
    .bdg.mid{background:#3a2a12;color:#fbbf24;border-color:#7c5a1e}
    .bdg.lo{background:#332b12;color:#fcd34d;border-color:#6b5a1e}
    .bdg.good{background:#0f2f22;color:#34d399;border-color:#1e6b4a}
  }
  tfoot td{font-weight:700;border-top:2px solid var(--border);border-bottom:none;background:var(--panel2)}
  .err{border:1px solid var(--warnbd);background:var(--warnbg);color:var(--warntx);border-radius:12px;padding:16px}
  .foot{color:var(--muted);font-size:12px;margin-top:26px;line-height:1.7}
  /* 기간(달력) 바 */
  .rangebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 18px;font-size:13px;color:var(--muted)}
  .rangebar:empty{display:none}
  .rangebar .rb-label{font-weight:700;color:var(--text)}
  .rangebar input[type=date]{font:inherit;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
  .rangebar button{padding:6px 11px;font-size:12.5px}
  .rangebar button.rb-on{background:var(--net);border-color:var(--net);color:#fff}
  .rangebar .rb-info{margin-left:auto;font-size:12px;color:var(--muted)}
  @media(max-width:640px){.rangebar .rb-info{margin-left:0;width:100%}}
  /* 상품별 뷰 */
  .prodbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
  .prodbar select{font:inherit;padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
  .prodbar button{padding:6px 12px;font-size:12.5px}
  .prodbar .pinfo{margin-left:auto;color:var(--muted);font-size:12px}
  .prodbar label.only{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  table.prod td.chk,table.prod th.chk{width:36px;text-align:center;padding-left:4px;padding-right:4px}
  table.prod td.pname,table.prod th.pname{text-align:left;white-space:normal;word-break:break-word;min-width:150px}
  table.prod tbody tr.off{opacity:.38}
  table.prod input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--net)}
  table.prod th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  table.prod th.sortable:hover{color:var(--net)}
  table.prod thead th{position:sticky;top:0;z-index:1}
  .prodbar input[type=text]{font:inherit;padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);min-width:150px}
  /* 월간보고 뷰 */
  .repbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .repbar select{font:inherit;padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
  .repdoc{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
  .rep-brand{padding:18px 0;border-bottom:1px solid var(--border)}
  .rep-brand:last-child{border-bottom:none}
  .rep-h{font-size:15.5px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
  .rep-h .sup{font-weight:600;color:var(--muted);font-size:13px}
  .rep-adj{display:inline-block;background:#fdecec;color:#c0392b;border-radius:6px;padding:2px 9px;font-size:12.5px;font-weight:600;margin:2px 0 10px}
  @media(prefers-color-scheme:dark){.rep-adj{background:#3a1d1d;color:#f2a6a6}}
  .rep-sec{margin:12px 0 4px;font-weight:700;font-size:13.5px}
  .rep-txt{white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:var(--text);margin:2px 0}
  .rep-kv{font-size:13.5px;line-height:1.9}
  .rep-kv b{color:var(--net)}
  .rep-memoT{color:var(--net);font-weight:700;font-size:13.5px;margin:12px 0 4px}
  .rep-memo{white-space:pre-wrap;font-size:13px;line-height:1.7;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text)}
  .rep-missing{color:var(--muted);font-size:13px;padding:6px 0}
  .loading{padding:60px 0;text-align:center;color:var(--muted)}
  .spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--net);border-radius:50%;
    display:inline-block;animation:sp 1s linear infinite;vertical-align:middle;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="h1">29CM 광고 리포트</h1>
      <div class="sub" id="subtitle">구글 시트 · 판매액/실판매액 기준 ROAS 보정</div>
    </div>
    <div class="toolbar">
      <div class="seg" id="brandSeg"></div>
      <div class="seg" id="periodSeg">
        <button data-p="week" class="on">주간</button>
        <button data-p="month">월별</button>
        <button data-p="report">월간보고</button>
      </div>
      <button class="primary" id="refreshBtn">↻ 새로고침</button>
    </div>
  </header>

  <div class="rangebar" id="rangeBar"></div>

  <div id="content">
    <div class="loading"><span class="spin"></span>데이터를 불러오는 중…</div>
  </div>

  <div class="foot" id="footnote"></div>
</div>

<script>
/* ============================================================
   ⚙️  설정 — 여기 두 줄만 관리하시면 됩니다
   ============================================================ */
// 게시된 스프레드시트 기본 주소 (탭은 gid 로 구분)
const PUB = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS-ywBj4zc7jHC-mtxFQw1BL6sXBb28ao1lAXeym_weEJsavusCp27MFKMnkpGq22JbiI4rqz38eBqE/pub?single=true&output=csv&gid=";

const CONFIG = {
  // 브랜드별 탭. ad=광고 데이터 gid, sales=실판매액 gid(없으면 "").
  // 실판매액 탭을 새로 만들면 해당 브랜드 sales 에 gid 만 넣으면 보정 ROAS가 나옵니다.
  // alias = '월간보고' 탭 브랜드 칸에 어떤 이름으로 적어도 인식되도록 하는 별칭.
  BRANDS: [
    { id:"ps",  name:"프로젝트슬립", ad: PUB+"26296784",  sales: PUB+"1703421879", alias:["프로젝트슬립","PS","프슬"] },
    { id:"pss", name:"평소생활",     ad: PUB+"654701962", sales: PUB+"315301298",  alias:["평소생활","PSL","평생","PSS"] },
    { id:"lp",  name:"라포즈",       ad: PUB+"141289368", sales: PUB+"1619021893", alias:["라포즈","LP","라포스"] },
  ],

  // '월간보고' 탭 — 어드민 확정 월별 집계(브랜드 3블록 가로, 각 행 '브랜드' 칸으로 구분).
  // 판매액/실판매액/광고전환매출/집행광고비/지원금/노출·클릭·판매수 확정치 소스. 월별 뷰·월간보고 공용.
  MONTHLY_CSV: PUB+"1731443920",

  // '캠페인매핑' 탭 CSV — 상품(자사 제품명)↔캠페인 매핑. 헤더: 브랜드(선택) · 자사 제품명 · 캠페인.
  // 탭을 만든 뒤 gid를 PUB+"gid" 형태로 넣으세요. (비우면 캠페인별 패널이 표시되지 않습니다)
  CAMPAIGN_CSV: "",

  // 전환 추적(어트리뷰션) 기간(일). 최근 이 기간은 '잠정'으로 표시합니다.
  ATTRIB_DAYS: 14,

  // '월간보고' 입력 탭 CSV — 시트에 탭을 만든 뒤 그 gid를 PUB+"gid" 형태로 넣으세요. (비우면 안내가 표시됩니다)
  REPORT_CSV: "",

  CHART_MAX: 8,       // 추이 차트 기본 표시 기간 수 (최근 N주/개월)
  DETAIL_MAX: 8,      // 주간/월별 상세 표 기본 표시 행 수 ('전체 보기'로 확장)
  DEFAULT_RANGE_DAYS: 30,  // 최초 진입 시 상단 기간 기본값 (최근 N일)

  // 상품 점검 리포트 기준값 (필요에 맞게 조정하세요)
  ALERT: {
    windowDays: 30,      // 비교 창 길이(최근 N일 vs 직전 N일)
    minCost: 30000,      // 이 금액 미만 소액 집행 상품은 제외(노이즈 컷)
    targetRoas: 200,     // 목표 ROAS(%) 미달 시 경고
    roasDropRatio: 0.5,  // 직전 대비 ROAS가 이 비율 미만이면 '급감'
    cpcRiseRatio: 1.5,   // 직전 대비 CPC가 이 배수 이상이면 '급등'
    ctrDropRatio: 0.6    // 직전 대비 CTR이 이 비율 이하면 '급락'
  }
};

/* ============================================================ */
const $ = s => document.querySelector(s);
const won = n => n==null ? "—" : "₩" + Math.round(n).toLocaleString("ko-KR");
const wonShort = n => {
  if(n==null) return "—";
  const a=Math.abs(n);
  if(a>=1e8) return (n/1e8).toFixed(1).replace(/\.0$/,"")+"억";
  if(a>=1e4) return Math.round(n/1e4).toLocaleString("ko-KR")+"만";
  return Math.round(n).toLocaleString("ko-KR");
};
const pct = (n,d=0) => n==null ? "—" : n.toFixed(d)+"%";
const num = s => { const v=parseFloat(String(s??"").replace(/[,₩%\s"']/g,"")); return isNaN(v)?0:v; };
const pad = n => String(n).padStart(2,"0");

/* ---- CSV 파서 (따옴표·쉼표 처리) ---- */
function parseCSV(t){
  const rows=[]; let f="",row=[],q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else{
      if(c==='"') q=true;
      else if(c===",") { row.push(f); f=""; }
      else if(c==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
      else if(c==="\r"){}
      else f+=c;
    }
  }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  return rows;
}

/* ---- 광고 CSV → 일별 집계 ---- */
function parseAd(text){
  const rows=parseCSV(text);
  let h=rows.findIndex(r=>r.some(c=>c.includes("집행 광고비")));
  if(h<0) throw new Error("광고 시트에서 '집행 광고비' 헤더를 찾지 못했습니다.");
  const hdr=rows[h].map(c=>c.trim());
  const find=(names)=>{ for(const n of names){ const i=hdr.findIndex(c=>c===n); if(i>=0) return i;}
                        for(const n of names){ const i=hdr.findIndex(c=>c.includes(n)); if(i>=0) return i;} return -1; };
  const ci={ y:find(["년"]), m:find(["월"]), d:find(["일"]), name:find(["자사 제품명","제품명"]),
             cost:find(["집행 광고비","광고비"]),
             rev:find(["전환 매출"]), cnt:find(["판매 수"]),
             imp:find(["노출 수"]), clk:find(["클릭 수"]),
             camp:find(["캠페인"]) };
  const daily={}; const prodDaily=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]; if(!r || r.length<=ci.cost) continue;
    const y=parseInt(r[ci.y]),m=parseInt(r[ci.m]),d=parseInt(r[ci.d]);
    if(!y||!m||!d) continue;
    const k=`${y}-${pad(m)}-${pad(d)}`;
    const cost=num(r[ci.cost]), adRev=num(r[ci.rev]);
    const cnt=ci.cnt>=0?num(r[ci.cnt]):0, imp=ci.imp>=0?num(r[ci.imp]):0, clk=ci.clk>=0?num(r[ci.clk]):0;
    (daily[k] ||= {cost:0,adRev:0,cnt:0,imp:0,clk:0});
    daily[k].cost+=cost; daily[k].adRev+=adRev; daily[k].cnt+=cnt; daily[k].imp+=imp; daily[k].clk+=clk;
    const name=ci.name>=0?String(r[ci.name]||"").trim():"";
    const camp=ci.camp>=0?String(r[ci.camp]||"").trim():"";   // 광고 데이터 탭에 '캠페인' 열이 있으면 사용
    if(name) prodDaily.push({key:k,name,cost,adRev,cnt,imp,clk,camp});
  }
  return {daily, prodDaily};
}

/* ---- 실판매액 CSV → 일별 ---- */
function parseSales(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>String(c).trim()!==""));
  if(!rows.length) return {};
  // 헤더 행 탐색
  let h=rows.findIndex(r=>r.some(c=>c.includes("판매액")) || r.some(c=>c.includes("날짜")));
  if(h<0) h=0;
  const hdr=rows[h].map(c=>c.trim());
  const idxDate = hdr.findIndex(c=>c.includes("날짜"));
  const idxY = hdr.findIndex(c=>c==="년"), idxM=hdr.findIndex(c=>c==="월"), idxD=hdr.findIndex(c=>c==="일");
  const idxNet = hdr.findIndex(c=>c.includes("실판매") || (c.includes("실") && c.includes("판매")));
  const idxGross = hdr.findIndex((c,j)=> j!==idxNet && c.includes("판매액"));
  const daily={};
  const toKey=(r)=>{
    if(idxDate>=0){
      const s=String(r[idxDate]).trim().replace(/[./]/g,"-");
      const mParts=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if(mParts) return `${mParts[1]}-${pad(+mParts[2])}-${pad(+mParts[3])}`;
      return null;
    }
    if(idxY>=0&&idxM>=0&&idxD>=0){
      const y=parseInt(r[idxY]),m=parseInt(r[idxM]),d=parseInt(r[idxD]);
      if(!y||!m||!d) return null; return `${y}-${pad(m)}-${pad(d)}`;
    }
    return null;
  };
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]; const k=toKey(r); if(!k) continue;
    const g = idxGross>=0 ? r[idxGross] : "";
    const nt= idxNet>=0 ? r[idxNet] : "";
    const gross = String(g).trim()==="" ? null : num(g);
    const net   = String(nt).trim()==="" ? null : num(nt);
    if(gross==null && net==null) continue;
    daily[k]={gross, net};
  }
  return daily;
}

/* ---- '월별 정리' 시트 → 브랜드별 월 확정 집계 ----
   구조: 한 행에 브랜드 블록이 가로로 나열(년/월, 노출/클릭/판매수, 집행 광고비, 전환 매출 ...) */
let MONTHLY=null;
function parseMonthly(text){
  const rows=parseCSV(text);
  const h=rows.findIndex(r=>r.some(c=>String(c).trim()==="년/월"));
  if(h<0) return {byKey:{},months:[]};
  const hdr=rows[h].map(c=>String(c).trim());
  const starts=[]; hdr.forEach((c,i)=>{ if(c==="년/월") starts.push(i); });
  const blocks=starts.map(s=>{
    const end = starts.find(x=>x>s) ?? hdr.length;
    const col=(...names)=>{
      for(const n of names){ for(let j=s;j<end;j++) if(hdr[j]===n) return j; }
      for(const n of names){ for(let j=s;j<end;j++) if(hdr[j].includes(n)) return j; }
      return -1; };
    return { ym:s, brand:col("브랜드"),
      gross:col("어드민 판매액","판매액"), net:col("어드민 실판매액","실판매액","실 판매액"),
      rev:col("어드민 광고 전환 매출","전환 매출의 SUM","광고 전환 매출"),
      cost:col("어드민 집행 광고비","집행 광고비의 SUM","집행 광고비"),
      support:col("광고비 지원금","지원금"),
      imp:col("노출수","노출 수의 SUM","노출 수"), clk:col("클릭수","클릭 수의 SUM","클릭 수"),
      cnt:col("판매수","판매 수의 SUM","판매 수"),
      camp:col("캠페인상세","캠페인"), memo:col("메모","비고") };
  });
  const brandOf=(s)=>{ s=String(s||"").trim().toLowerCase();
    const b=CONFIG.BRANDS.find(x=>x.alias.some(a=>a.toLowerCase()===s)||x.name.toLowerCase()===s); return b?b.id:null; };
  const byKey={}, months=new Set();
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    for(const b of blocks){
      const m=String(r[b.ym]||"").trim().match(/^(\d{4})[-.\/]?(\d{1,2})$/);
      if(!m) continue;
      const bid = b.brand>=0 ? brandOf(r[b.brand]) : null;
      if(!bid) continue;
      const ym=`${m[1]}-${pad(+m[2])}`;
      const cost=numOrNull(r[b.cost]), rev=numOrNull(r[b.rev]);
      const gross=b.gross>=0?numOrNull(r[b.gross]):null, net=b.net>=0?numOrNull(r[b.net]):null;
      if(cost==null && rev==null && gross==null && net==null) continue;   // 아직 안 채워진 행
      byKey[`${ym}|${bid}`]={ ym, bid, cost:cost||0, adRev:rev||0, gross, net,
        support:b.support>=0?numOrNull(r[b.support]):null,
        imp:(b.imp>=0?numOrNull(r[b.imp]):0)||0,
        clk:(b.clk>=0?numOrNull(r[b.clk]):0)||0,
        cnt:(b.cnt>=0?numOrNull(r[b.cnt]):0)||0,
        camp:b.camp>=0?String(r[b.camp]||"").trim():"",
        memo:b.memo>=0?String(r[b.memo]||"").trim():"" };
      months.add(ym);
    }
  }
  return { byKey, months:[...months].sort() };
}
function confirmedMonth(bid, ym){ return MONTHLY ? (MONTHLY.byKey[`${ym}|${bid}`]||null) : null; }

/* ---- 일별 병합 ---- */
function mergeDaily(ad, sales){
  const keys=new Set([...Object.keys(ad),...Object.keys(sales)]);
  const out=[];
  for(const k of keys){
    const a=ad[k]||{}, s=sales[k]||{};
    out.push({
      date:new Date(k+"T00:00:00"), key:k,
      cost:a.cost||0, adRev:a.adRev||0, cnt:a.cnt||0, imp:a.imp||0, clk:a.clk||0,
      gross: s.gross==null?null:s.gross, net: s.net==null?null:s.net,
      hasAd: !!ad[k], hasSales: !!sales[k]
    });
  }
  out.sort((x,y)=>x.date-y.date);
  return out;
}

/* ---- 주/월 그룹 키 ---- */
function weekStart(d){ const t=new Date(d); const wd=(t.getDay()+6)%7; t.setDate(t.getDate()-wd); t.setHours(0,0,0,0); return t; }
function groupBy(daily, mode){
  const groups={};
  for(const r of daily){
    let key,label,sortkey;
    if(mode==="month"){
      key=`${r.date.getFullYear()}-${pad(r.date.getMonth()+1)}`;
      label=`${r.date.getFullYear()}년 ${r.date.getMonth()+1}월`;
      sortkey=key;
    }else{
      const ws=weekStart(r.date); const we=new Date(ws); we.setDate(we.getDate()+6);
      key=`${ws.getFullYear()}-${pad(ws.getMonth()+1)}-${pad(ws.getDate())}`;
      label=`${pad(ws.getMonth()+1)}/${pad(ws.getDate())}~${pad(we.getMonth()+1)}/${pad(we.getDate())}`;
      sortkey=key;
    }
    (groups[key] ||= {key,label,sortkey,cost:0,adRev:0,cnt:0,imp:0,clk:0,gross:0,net:0,
                      daysAd:0,daysSales:0,anyGross:false,anyNet:false});
    const g=groups[key];
    g.cost+=r.cost; g.adRev+=r.adRev; g.cnt+=r.cnt; g.imp+=r.imp||0; g.clk+=r.clk||0;
    if(!g.lastKey || r.key>g.lastKey) g.lastKey=r.key;
    if(r.hasAd && r.cost>0) g.daysAd++;
    if(r.gross!=null){ g.gross+=r.gross; g.anyGross=true; }
    if(r.net!=null){ g.net+=r.net; g.anyNet=true; }
    if(r.gross!=null||r.net!=null) g.daysSales++;
  }
  const arr=Object.values(groups).sort((a,b)=>a.sortkey<b.sortkey?-1:1);
  for(const g of arr){
    g.grossV = g.anyGross? g.gross : null;
    g.netV   = g.anyNet? g.net : null;
    // 명목 ROAS = 광고전환매출 ÷ 광고비  (판매액이 아니라 광고전환매출 기반!)
    g.roasNom = g.cost>0 ? g.adRev/g.cost*100 : null;
    // 반영율 = 실판매액 ÷ 판매액  (광고전환매출이 판매가 기준으로 높게 잡혀서 이 비율로 보정)
    g.keepRate = (g.grossV && g.netV!=null) ? g.netV/g.grossV*100 : null;
    // 보정 광고전환매출 = 광고전환매출 × 반영율,  보정 ROAS = 명목 ROAS × 반영율
    g.adjRev  = (g.grossV && g.netV!=null) ? g.adRev*(g.netV/g.grossV) : null;
    g.roasAdj = (g.cost>0 && g.adjRev!=null) ? g.adjRev/g.cost*100 : null;
    g.ctr = g.imp>0 ? g.clk/g.imp*100 : null;   // 클릭률 = 클릭수/노출수
    g.cpc = g.clk>0 ? g.cost/g.clk : null;       // 클릭당 광고비 = 광고비/클릭수
    g.partial = (g.daysSales>0 && g.daysAd>0 && g.daysSales<g.daysAd);
  }
  return arr;
}

function niceTop(max){ if(max<=0)return 1; const p=Math.pow(10,Math.floor(Math.log10(max))); const f=max/p;
  const s=f<=1?1:f<=1.5?1.5:f<=2?2:f<=3?3:f<=5?5:f<=7?7:10; return s*p; }
const valLabel=(v,unit)=> unit==="%" ? Math.round(v)+"%" : wonShort(v);

/* ---- SVG 그룹 막대 차트 (막대 위 값 표시) ---- */
function barChart(el, labels, series, {fmt=wonShort, unit="", values=true}={}){
  if(!labels.length){ el.innerHTML='<div class="muted" style="padding:30px 0;text-align:center">표시할 데이터가 없습니다</div>'; return; }
  const W=Math.max(labels.length*Math.max(46, series.length*22+26)+70, 320), H=248;
  const P={t:22,r:12,b:46,l:56};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  let max=0; series.forEach(s=>s.values.forEach(v=>{ if(v!=null&&v>max)max=v; }));
  const top=niceTop(max); const ticks=4;
  const x=i=> P.l + i*(iw/labels.length);
  const bw=iw/labels.length;
  const gap=6, groupW=bw-gap*2, each=groupW/series.length;
  const labFont = each>=20?8 : each>=13?7 : 0;   // 너무 좁으면 라벨 생략(hover로 대체)
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMinYMin meet" role="img">`;
  for(let t=0;t<=ticks;t++){
    const val=top*t/ticks, yy=P.t+ih-(val/top)*ih;
    svg+=`<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="var(--grid)"/>`;
    svg+=`<text x="${P.l-8}" y="${yy+3.5}" font-size="10" text-anchor="end">${fmt(val)}</text>`;
  }
  labels.forEach((lab,i)=>{
    series.forEach((s,si)=>{
      const v=s.values[i]; if(v==null) return;
      const bh=(v/top)*ih; const bx=x(i)+gap+si*each; const by=P.t+ih-bh;
      const cx=bx+Math.max(each-2,1)/2;
      svg+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${Math.max(each-2,1).toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" rx="2" fill="${s.color}">`
         +`<title>${lab} · ${s.name}: ${unit==="%"?(v.toFixed(0)+"%"):won(v)}</title></rect>`;
      if(values && labFont && v>0){
        svg+=`<text x="${cx.toFixed(1)}" y="${(by-3).toFixed(1)}" font-size="${labFont}" fill="${s.color}" text-anchor="start" transform="rotate(-55 ${cx.toFixed(1)} ${(by-3).toFixed(1)})">${valLabel(v,unit)}</text>`;
      }
    });
    const cx=x(i)+bw/2;
    svg+=`<text x="${cx}" y="${H-P.b+16}" font-size="10" text-anchor="middle" transform="rotate(18 ${cx} ${H-P.b+16})">${lab}</text>`;
  });
  svg+=`</svg>`;
  el.innerHTML=svg;
}

/* ---- SVG 다중 선 차트 (점 위 값 표시, null은 끊김) ---- */
const LINE_COLORS=["#2563eb","#ef4444","#10b981","#f59e0b","#8b5cf6","#ec4899","#14b8a6","#f97316","#64748b","#0ea5e9"];
function lineChart(el, labels, series, {fmt=wonShort, unit="", values=true, labelMax=3, labelAll=false}={}){
  if(!labels.length || !series.length){ el.innerHTML='<div class="muted" style="padding:30px 0;text-align:center">표시할 데이터가 없습니다</div>'; return; }
  const n0=labels.length;
  const perPt = n0>36?20 : n0>18?32 : n0>10?48 : 60;
  const W=Math.max(n0*perPt+80, 340), H=248;
  const P={t:22,r:14,b:46,l:56};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  let max=0,min=Infinity; series.forEach(s=>s.values.forEach(v=>{ if(v!=null){ if(v>max)max=v; if(v<min)min=v; } }));
  if(!isFinite(min)) min=0;
  const top=niceTop(max), ticks=4;
  const n=labels.length;
  const x=i=> P.l + (n===1? iw/2 : i*(iw/(n-1)));
  const y=v=> P.t+ih-(v/top)*ih;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMinYMin meet" role="img">`;
  for(let t=0;t<=ticks;t++){
    const val=top*t/ticks, yy=P.t+ih-(val/top)*ih;
    svg+=`<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="var(--grid)"/>`;
    svg+=`<text x="${P.l-8}" y="${yy+3.5}" font-size="10" text-anchor="end">${fmt(val)}</text>`;
  }
  const step=Math.ceil(n/12);   // x축 라벨이 많으면 솎아내기
  labels.forEach((lab,i)=>{
    if(step>1 && i%step!==0 && i!==n-1) return;
    const cx=x(i);
    svg+=`<text x="${cx}" y="${H-P.b+16}" font-size="10" text-anchor="middle" transform="rotate(18 ${cx} ${H-P.b+16})">${lab}</text>`;
  });
  // 값 라벨은 선별로 위/아래로 분리해 겹침 방지 (짝수=위, 홀수=아래)
  const dyOf=si=> si%2===0 ? -7 : 15;
  series.forEach((s,si)=>{
    const col=s.color; let dpath="", started=false;
    s.values.forEach((v,i)=>{
      if(v==null){ started=false; return; }
      const px=x(i), py=y(v);
      dpath += (started?" L":" M")+px.toFixed(1)+" "+py.toFixed(1); started=true;
    });
    if(dpath) svg+=`<path d="${dpath}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{
      if(v==null) return; const px=x(i), py=y(v);
      svg+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.6" fill="${col}"><title>${labels[i]} · ${s.name}: ${unit==="%"?(v.toFixed(0)+"%"):won(v)}</title></circle>`;
      if(values && series.length<=labelMax && v>0 && (labelAll || step<=1 || i%step===0 || i===n-1))
        svg+=`<text x="${px.toFixed(1)}" y="${(py+dyOf(si)).toFixed(1)}" font-size="8.5" fill="${col}" text-anchor="middle" paint-order="stroke" stroke="var(--panel)" stroke-width="2.6">${valLabel(v,unit)}</text>`;
    });
  });
  svg+=`</svg>`;
  el.innerHTML=svg;
}

/* ---- 렌더 ---- */
let STATE={daily:[],prodDaily:[],hasSalesUrl:false,mode:"week",loadedAt:null,brandId:CONFIG.BRANDS[0].id,cache:{},startDate:null,endDate:null,
           prodSort:"cost",prodDir:-1,prodSel:null,prodOnlySel:false,prodSearch:"",detailAll:false,rangeInit:false,
           campSort:"cost",campDir:-1,
           alertBasis:"range",   // 점검 리포트 비교 기준 기본값: range(선택기간) | confirmed(확정구간)
           rangeNote:""};
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
// 최초 진입/브랜드 전환 시 기간 기본값 = 최근 DEFAULT_RANGE_DAYS일
function applyDefaultRange(){
  if(STATE.rangeInit || !STATE.daily.length) return;
  const max=STATE.daily[STATE.daily.length-1].key, min=STATE.daily[0].key;
  let st=dateShift(max,-(CONFIG.DEFAULT_RANGE_DAYS-1)); if(st<min) st=min;
  STATE.startDate=st; STATE.endDate=max; STATE.rangeInit=true;
}
function currentBrand(){ return CONFIG.BRANDS.find(b=>b.id===STATE.brandId)||CONFIG.BRANDS[0]; }

/* ---- 기간(달력) 필터 ---- */
function filteredDaily(){
  if(!STATE.startDate && !STATE.endDate) return STATE.daily;
  return STATE.daily.filter(r=> (!STATE.startDate||r.key>=STATE.startDate) && (!STATE.endDate||r.key<=STATE.endDate));
}
function dateShift(key,days){ const d=new Date(key+"T00:00:00"); d.setDate(d.getDate()+days);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function rangeActive(){ return !!(STATE.startDate||STATE.endDate); }
// 해당 월(YYYY-MM)이 선택 기간에 통째로 포함되는가 (부분 달엔 월 확정치를 쓰면 안 됨)
function rangeCoversMonth(ym){
  const [y,m]=ym.split("-").map(Number);
  const first=`${ym}-01`, last=`${ym}-${pad(new Date(y,m,0).getDate())}`;
  return (!STATE.startDate||STATE.startDate<=first) && (!STATE.endDate||STATE.endDate>=last);
}
function setRangeBar(){
  const bar=$("#rangeBar"); if(!bar) return;
  if(!STATE.daily.length){ bar.innerHTML=""; return; }
  const min=STATE.daily[0].key, max=STATE.daily[STATE.daily.length-1].key;
  const s=STATE.startDate||min, e=STATE.endDate||max;
  const n=filteredDaily().length;
  bar.innerHTML=
    `<span class="rb-label">📅 기간</span>
     <input type="date" id="rbStart" min="${min}" max="${max}" value="${s}">
     <span>~</span>
     <input type="date" id="rbEnd" min="${min}" max="${max}" value="${e}">
     <button data-preset="all"${!rangeActive()?' class="rb-on"':''}>전체</button>
     <button data-preset="today">오늘</button>
     <button data-preset="7">최근 7일</button>
     <button data-preset="30">최근 30일</button>
     <button data-preset="90">최근 90일</button>
     <button data-preset="month">이번 달</button>
     <span class="rb-info">${rangeActive()?`선택 ${s} ~ ${e} · ${n}일`:`전체 ${min} ~ ${max} · ${n}일`}${STATE.rangeNote?` <span class="bdg lo">${STATE.rangeNote}</span>`:""}</span>`;
  $("#rbStart").addEventListener("change",ev=>{ STATE.rangeNote=""; STATE.startDate=ev.target.value||null; setRangeBar(); dispatchView(); });
  $("#rbEnd").addEventListener("change",ev=>{ STATE.rangeNote=""; STATE.endDate=ev.target.value||null; setRangeBar(); dispatchView(); });
  bar.querySelectorAll("button[data-preset]").forEach(btn=>btn.addEventListener("click",()=>{
    const p=btn.dataset.preset;
    STATE.rangeNote="";
    if(p==="all"){ STATE.startDate=null; STATE.endDate=null; }
    else if(p==="today"){
      const t=todayKey();
      let d=t;
      if(t>max){ d=max; STATE.rangeNote=`오늘(${t}) 데이터 없음 → 최신일`; }
      else if(t<min){ d=min; STATE.rangeNote="데이터 시작일"; }
      STATE.startDate=d; STATE.endDate=d;
    }
    else if(p==="month"){ STATE.startDate=max.slice(0,7)+"-01"; STATE.endDate=max; }
    else { const days=parseInt(p); let st=dateShift(max,-(days-1)); if(st<min)st=min; STATE.startDate=st; STATE.endDate=max; }
    setRangeBar(); dispatchView();
  }));
}

function render(){
  const c=$("#content");
  const daily=filteredDaily();
  const groups=groupBy(daily, STATE.mode);

  // 전환 추적(잠정) 구간 = 데이터 마지막 날 기준 최근 ATTRIB_DAYS일
  const maxKey = STATE.daily.length ? STATE.daily[STATE.daily.length-1].key : null;
  const provStart = maxKey ? dateShift(maxKey, -(CONFIG.ATTRIB_DAYS-1)) : null;

  // '월별 정리' 확정치 적용 (월별 뷰 + 기간필터 없음 = 온전한 달일 때만)
  const useConfirmed = (STATE.mode==="month" && MONTHLY);
  if(useConfirmed){
    for(const g of groups){
      if(!rangeCoversMonth(g.key)) continue;   // 부분 달은 일별 집계 유지
      const cf=confirmedMonth(STATE.brandId, g.key); if(!cf) continue;
      g.cost=cf.cost; g.adRev=cf.adRev; g.imp=cf.imp; g.clk=cf.clk; g.cnt=cf.cnt;
      if(cf.gross!=null){ g.gross=cf.gross; g.grossV=cf.gross; g.anyGross=true; }  // 어드민 확정 판매액
      if(cf.net!=null){ g.net=cf.net; g.netV=cf.net; g.anyNet=true; }              // 어드민 확정 실판매액
      g.roasNom = g.cost>0 ? g.adRev/g.cost*100 : null;
      g.keepRate = (g.grossV && g.netV!=null) ? g.netV/g.grossV*100 : null;
      g.adjRev  = (g.grossV && g.netV!=null) ? g.adRev*(g.netV/g.grossV) : null;
      g.roasAdj = (g.cost>0 && g.adjRev!=null) ? g.adjRev/g.cost*100 : null;
      g.ctr = g.imp>0 ? g.clk/g.imp*100 : null;
      g.cpc = g.clk>0 ? g.cost/g.clk : null;
      g.confirmed = true;
    }
  }
  for(const g of groups){
    g.provisional = !g.confirmed && provStart && g.lastKey && g.lastKey>=provStart;
    g.partialMonth = (STATE.mode==="month" && !g.confirmed && !rangeCoversMonth(g.key));
  }

  const recent=groups.slice(-CONFIG.CHART_MAX);
  const view=[...groups].reverse(); // 표: 최신 위로

  // KPI (그룹 기준 → '월별 정리' 확정치가 반영됨)
  let totalCostAll=0, totalAdRevAll=0, kGross=0,kNet=0,anyG=false,anyN=false, kCostSales=0;
  for(const g of groups){

/* ---- 상품별 상세 ---- */
function aggregateProducts(){ return aggregateProductsIn(STATE.startDate, STATE.endDate); }
function aggregateProductsIn(s, e){
  const map={};
  for(const r of STATE.prodDaily){
    if(s && r.key<s) continue;
    if(e && r.key>e) continue;
    (map[r.name] ||= {name:r.name,cost:0,adRev:0,cnt:0,imp:0,clk:0});
    const m=map[r.name]; m.cost+=r.cost; m.adRev+=r.adRev; m.cnt+=r.cnt; m.imp+=r.imp; m.clk+=r.clk;
  }
  const arr=Object.values(map);
  for(const m of arr){
    m.roas=m.cost>0?m.adRev/m.cost*100:null;
    m.ctr=m.imp>0?m.clk/m.imp*100:null;
    m.cpc=m.clk>0?m.cost/m.clk:null;
  }
  return arr;
}

/* ---- 캠페인 판정 (일자 단위) ----
   우선순위: ①광고 데이터 탭의 '캠페인' 열(행 그대로) → ②매핑 탭(기간형: 시작일~종료일로 그날 판정) */
let CAMPMAP=null;   // {byBrand:{bid:[{name,camp,start,end}]}}
function parseCampaignMap(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>String(c).trim()!==""));
  if(!rows.length) return {byBrand:{}};
  let h=rows.findIndex(r=>r.some(c=>c.includes("캠페인")) && r.some(c=>c.includes("제품")||c.includes("상품")));
  if(h<0) h=0;
  const hdr=rows[h].map(c=>String(c).trim());
  const idxBrand=hdr.findIndex(c=>c.includes("브랜드"));
  const idxName=hdr.findIndex(c=>c==="자사 제품명")>=0?hdr.findIndex(c=>c==="자사 제품명")
             : hdr.findIndex(c=>c.includes("제품명")||c.includes("상품명")||c==="상품"||c.includes("제품")||c.includes("상품"));
  const idxCamp=hdr.findIndex(c=>c.includes("캠페인"));
  const idxStart=hdr.findIndex(c=>c.includes("시작"));
  const idxEnd=hdr.findIndex(c=>c.includes("종료")||c.includes("끝"));
  if(idxName<0||idxCamp<0) return {byBrand:{}};
  const brandOf=(s)=>{ s=String(s||"").trim().toLowerCase();
    const b=CONFIG.BRANDS.find(x=>x.alias.some(a=>a.toLowerCase()===s)||x.name.toLowerCase()===s); return b?b.id:null; };
  const normDate=(s)=>{ const m=String(s||"").trim().match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/); return m?`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`:null; };
  const byBrand={};
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]; const name=String(r[idxName]||"").trim(), camp=String(r[idxCamp]||"").trim();
    if(!name||!camp) continue;
    const bid = idxBrand>=0 ? (brandOf(r[idxBrand])||"*") : "*";
    (byBrand[bid] ||= []).push({name, camp,
      start: idxStart>=0?normDate(r[idxStart]):null,
      end: idxEnd>=0?normDate(r[idxEnd]):null });
  }
  return {byBrand};
}
function mapHasCampaigns(bid){ return !!(CAMPMAP && ((CAMPMAP.byBrand[bid]&&CAMPMAP.byBrand[bid].length) || (CAMPMAP.byBrand["*"]&&CAMPMAP.byBrand["*"].length))); }
// '-' · 빈값 · 미지정 표기는 실제 캠페인으로 세지 않음(기존/미분류)
function realCamp(v){ v=(v||"").trim(); return (v && v!=="-" && v!=="(미지정)" && v!=="미지정") ? v : ""; }
function hasCampColumn(){ return STATE.prodDaily && STATE.prodDaily.some(r=>(r.camp||"")!==""); }  // 광고 데이터 탭에 '캠페인' 열이 존재(값이 '-'라도)
function hasRealCampaign(){ return STATE.prodDaily && STATE.prodDaily.some(r=>realCamp(r.camp)); }  // 실제 캠페인명이 하나라도 있는지
function brandHasCampaigns(bid){ return mapHasCampaigns(bid) || hasCampColumn(); }  // 매핑 탭 또는 광고 캠페인 열이 있으면 패널 표시
// 매핑 탭에서 (상품, 날짜)에 해당하는 캠페인 — 시작일~종료일이 그날을 덮는 항목
function resolveCamp(bid, name, dateKey){
  if(!CAMPMAP) return null;
  for(const list of [CAMPMAP.byBrand[bid], CAMPMAP.byBrand["*"]]){
    if(!list) continue;
    for(const e of list){
      if(e.name!==name) continue;
      if((!e.start||dateKey>=e.start) && (!e.end||dateKey<=e.end)) return e.camp;
    }
  }
  return null;
}
// 한 광고 데이터 행의 캠페인: 광고열(실제 캠페인명) 우선 → 매핑탭(기간형) → (미지정)
function campForRow(r){ return realCamp(r.camp) || resolveCamp(STATE.brandId, r.name, r.key) || "(미지정)"; }
function aggregateCampaigns(){
  if(!brandHasCampaigns(STATE.brandId)) return null;
  const s=STATE.startDate, e=STATE.endDate, map={};
  for(const r of STATE.prodDaily){                 // 일자 단위 → 한 상품이 기간 내 여러 캠페인에 걸치면 날짜별로 분리
    if(s&&r.key<s)continue; if(e&&r.key>e)continue;
    const camp=campForRow(r);
    (map[camp] ||= {name:camp,cost:0,adRev:0,cnt:0,imp:0,clk:0,pset:new Set()});
    const m=map[camp]; m.cost+=r.cost;m.adRev+=r.adRev;m.cnt+=r.cnt;m.imp+=r.imp;m.clk+=r.clk; m.pset.add(r.name);
  }
  const arr=Object.values(map);
  for(const m of arr){ m.prods=m.pset.size; delete m.pset;
    m.roas=m.cost>0?m.adRev/m.cost*100:null; m.ctr=m.imp>0?m.clk/m.imp*100:null; m.cpc=m.clk>0?m.cost/m.clk:null; }
  const key=STATE.campSort, dir=STATE.campDir;
  arr.sort((a,b)=>{
    if(key==="name") return dir*a.name.localeCompare(b.name);
    const va=a[key]==null?-Infinity:a[key], vb=b[key]==null?-Infinity:b[key];
    return dir*(va-vb) || b.cost-a.cost;
  });
  return arr;
}
const CAMP_COLS=[{k:"name",label:"캠페인",cls:"pname"},{k:"prods",label:"상품수"},{k:"cost",label:"광고비"},
  {k:"adRev",label:"광고전환매출"},{k:"roas",label:"명목 ROAS"},{k:"imp",label:"노출수"},{k:"clk",label:"클릭수"},
  {k:"ctr",label:"CTR",title:"클릭수 ÷ 노출수"},{k:"cpc",label:"CPC",title:"광고비 ÷ 클릭수"},{k:"cnt",label:"판매수"}];
function renderCampaignPanel(){
  const el=$("#campPanel"); if(!el) return;
  const camps=aggregateCampaigns();
  if(!camps || !camps.length){ el.innerHTML=""; return; }
  const periodLbl = rangeActive()?`${STATE.startDate||"~"} ~ ${STATE.endDate||"~"}`:"전체 기간";
  // 캠페인 추이(전환매출) 선그래프
  const trProds=[]; // 캠페인별 합계를 일자 시계열로
  const s=STATE.startDate, e=STATE.endDate, periods=new Set(), cmap={};
  for(const r of STATE.prodDaily){
    if(s&&r.key<s)continue; if(e&&r.key>e)continue;
    const camp=campForRow(r);
    periods.add(r.key); (cmap[camp] ||= {})[r.key]=((cmap[camp]||{})[r.key]||0)+r.adRev;

  const tot=camps.reduce((a,c)=>{a.cost+=c.cost;a.adRev+=c.adRev;a.cnt+=c.cnt;a.imp+=c.imp;a.clk+=c.clk;return a;},{cost:0,adRev:0,cnt:0,imp:0,clk:0});
  const totRoas=tot.cost>0?tot.adRev/tot.cost*100:null, totCtr=tot.imp>0?tot.clk/tot.imp*100:null, totCpc=tot.clk>0?tot.cost/tot.clk:null;
  const noReal = !hasRealCampaign() && !mapHasCampaigns(STATE.brandId);   // 아직 실제 캠페인명이 없음
  const arrw=(k)=> k===STATE.campSort ? (STATE.campDir===1?" ▲":" ▼") : "";
  const th=CAMP_COLS.map(c=>`<th class="sortable ${c.cls||""}" data-k="${c.k}"${c.title?` title="${c.title}"`:""}>${c.label}${arrw(c.k)}</th>`).join("");
  const cell=(c)=>`<tr>
    <td class="pname">${escapeHtml(c.name)}</td>
    <td class="num muted">${c.prods}</td>
    <td class="num">${won(c.cost)}</td>
    <td class="num">${won(c.adRev)}</td>
    <td class="num">${c.roas==null?'<span class="muted">—</span>':pct(c.roas)}</td>
    <td class="num muted">${Math.round(c.imp).toLocaleString("ko-KR")}</td>
    <td class="num muted">${Math.round(c.clk).toLocaleString("ko-KR")}</td>
    <td class="num muted">${c.ctr==null?'—':pct(c.ctr,2)}</td>
    <td class="num muted">${c.cpc==null?'—':won(c.cpc)}</td>
    <td class="num muted">${Math.round(c.cnt).toLocaleString("ko-KR")}</td></tr>`;
  el.innerHTML=`<div class="panel">
    <h2>🎯 캠페인별 광고 상세 <span class="muted" style="font-size:12px">· ${periodLbl} · ${camps.length}개 캠페인</span></h2>
    <p class="hint">열 머리글 클릭으로 정렬 · 광고 데이터 탭 '캠페인' 열(또는 캠페인매핑 탭) 기준으로 상품을 묶어 <b>일자 단위</b>로 집계(상품이 시기별로 다른 캠페인이면 날짜별로 분리). 미지정(‘-’)은 (미지정). 최근 ${CONFIG.ATTRIB_DAYS}일은 잠정.

/* ---- 상품 점검 리포트 (효율 급감·위험 감지) ----
   전환 추적 지연을 피하려고 '확정 구간'(데이터 마지막날 - 추적일)까지만 비교합니다. */
function productAlerts(){
  const A=CONFIG.ALERT;
  if(!STATE.daily.length || !STATE.prodDaily.length) return null;
  const maxKey=STATE.daily[STATE.daily.length-1].key, minKey=STATE.daily[0].key;
  const confirmEnd=dateShift(maxKey, -CONFIG.ATTRIB_DAYS);
  let curStart,curEnd,W;
  if(STATE.alertBasis==="range"){
    // 상단에서 고른 기간 그대로, 직전 동일 길이와 비교
    curEnd = STATE.endDate || maxKey;
    curStart = STATE.startDate || minKey;
    W = Math.max(1, daysBetween(curStart,curEnd)+1);
  }else{
    // 전환 추적 기간을 제외한 확정 구간 기준
    W = A.windowDays;
    curEnd = confirmEnd; curStart = dateShift(curEnd,-(W-1));
  }
  const prevEnd=dateShift(curStart,-1), prevStart=dateShift(prevEnd,-(W-1));
  if(curEnd<minKey) return {tooEarly:true};
  // 창 길이에 비례해 소액 컷 조정(7일 창에 30일 기준을 쓰면 거의 다 걸러짐)
  const minCost=Math.max(5000, Math.round(A.minCost * W / A.windowDays));
  const unsettled = curEnd > confirmEnd;   // 선택 구간이 추적 중 기간에 걸침
  const toMap=a=>{const m={};for(const p of a)m[p.name]=p;return m;};
  const cur=toMap(aggregateProductsIn(curStart,curEnd));
  const prev=toMap(aggregateProductsIn(prevStart,prevEnd));
  const hasPrev = prevEnd>=minKey;
  const items=[];
  for(const n of Object.keys(cur)){
    const c=cur[n]; if(c.cost < minCost) continue;
    const p=prev[n]||null;
    const flags=[]; let sev=0;
    if(c.adRev===0){ flags.push({t:"전환 0",lv:"hi"}); sev=Math.max(sev,3); }
    else if(p && p.roas!=null && p.roas>=100 && c.roas!=null && c.roas < p.roas*A.roasDropRatio){
      flags.push({t:"ROAS 급감",lv:"hi"}); sev=Math.max(sev,3); }
    if(c.adRev>0 && c.roas!=null && c.roas < A.targetRoas){ flags.push({t:"목표 미달",lv:"mid"}); sev=Math.max(sev,2); }
    if(p && p.cpc && c.cpc && c.clk>=20 && c.cpc >= p.cpc*A.cpcRiseRatio){ flags.push({t:"CPC 급등",lv:"mid"}); sev=Math.max(sev,2); }
    if(p && p.ctr && c.ctr && c.imp>=1000 && c.ctr <= p.ctr*A.ctrDropRatio){ flags.push({t:"CTR 급락",lv:"lo"}); sev=Math.max(sev,1); }
    if(!flags.length && c.roas!=null && c.roas >= A.targetRoas*1.5 && (!p || p.roas==null || c.roas>=p.roas)){
      flags.push({t:"증액 검토",lv:"good"}); sev=-1; }
    if(flags.length) items.push({name:n,c,p,flags,sev});
  }
  items.sort((a,b)=> b.sev-a.sev || b.c.cost-a.c.cost);
  return {curStart,curEnd,prevStart,prevEnd,hasPrev,items,W,minCost,unsettled};
}
const ACTION={ "전환 0":"일시중지 또는 키워드·소재 점검", "ROAS 급감":"입찰가 하향 / 캠페인 점검",
  "목표 미달":"입찰가 하향 · 예산 축소", "CPC 급등":"입찰가 조정", "CTR 급락":"소재·썸네일 교체 검토",
  "증액 검토":"예산 증액 검토" };
function renderAlertPanel(){
  const el=$("#alertPanel"); if(!el) return;
  const a=productAlerts();
  if(!a){ el.innerHTML=""; return; }
  if(a.tooEarly){ el.innerHTML=`<div class="panel"><h2>⚠ 상품 점검 리포트</h2>
    <p class="hint">비교할 확정 데이터가 아직 부족합니다(전환 추적 ${CONFIG.ATTRIB_DAYS}일 제외 기준).</p></div>`; return; }
  const dl=(now,before,fmt,better)=>{
    if(now==null||before==null||!before) return `<span class="muted">${now==null?"—":fmt(now)}</span>`;
    const r=(now-before)/before*100; const up=r>=0; const good=better==="up"?up:!up;
    return `${fmt(now)} <span class="${good?'pos':'neg'}" style="font-size:11px">${up?"▲":"▼"}${Math.abs(r).toFixed(0)}%</span>`;
  };
  const rows=a.items.map(it=>{
    const c=it.c,p=it.p||{};
    const badges=it.flags.map(f=>`<span class="bdg ${f.lv}">${f.t}</span>`).join(" ");
    const action=ACTION[it.flags[0].t]||"";
    return `<tr>
      <td class="pname">${escapeHtml(it.name)}</td>
      <td>${badges}</td>
      <td class="num">${won(c.cost)}</td>
      <td class="num">${won(c.adRev)}</td>
      <td class="num">${dl(c.roas,p.roas,v=>pct(v),"up")}</td>
      <td class="num">${dl(c.cpc,p.cpc,v=>won(v),"down")}</td>
      <td class="num">${dl(c.ctr,p.ctr,v=>pct(v,2),"up")}</td>
      <td style="text-align:left">${action}</td>
    </tr>`;}).join("");
  const risky=a.items.filter(i=>i.sev>=2).length, good=a.items.filter(i=>i.sev<0).length;
  const isRange=STATE.alertBasis==="range";
  el.innerHTML=`<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">
      <h2 style="margin:0">⚠ 상품 점검 리포트 <span class="muted" style="font-size:12px">· ${a.W}일 비교 (${a.curStart}~${a.curEnd}) vs 직전 ${a.W}일 (${a.prevStart}~${a.prevEnd})${a.hasPrev?"":" · 직전 데이터 부족"}</span></h2>
      <div class="seg" id="alertBasisSeg" style="font-size:12.5px">
        <button data-b="range"${isRange?' class="on"':''}>선택 기간 기준</button>
        <button data-b="confirmed"${!isRange?' class="on"':''}>확정 구간 기준</button>
      </div>
    </div>
    <p class="hint">${isRange
        ? `상단 달력에서 고른 기간을 <b>직전 동일 기간</b>과 비교합니다.`
        : `전환 추적 ${CONFIG.ATTRIB_DAYS}일을 제외한 <b>확정 구간</b>으로 비교해 추적 지연에 의한 착시가 없습니다.`}
      광고비 ${won(a.minCost)} 미만 소액 상품은 제외 · 목표 ROAS ${CONFIG.ALERT.targetRoas}% 기준
      ${a.items.length?`· <b class="neg">조치 필요 ${risky}건</b>${good?` · <b class="pos">증액 후보 ${good}건</b>`:""}`:""}
      ${a.unsettled?`<br><span class="bdg prov">⚠ 주의</span> 비교 구간이 <b>전환 추적 중(~${a.curEnd})</b>에 걸쳐 있어 ROAS·전환매출이 실제보다 낮게 잡힙니다. 급감 판정이 과장될 수 있으니 <b>확정 구간 기준</b>과 함께 보세요.`:""}</p>
    ${a.items.length?`<div class="tblwrap"><table class="prod">
      <thead><tr><th class="pname">상품명</th><th style="text-align:left">진단</th><th>광고비</th><th>전환매출</th>
        <th>ROAS</th><th>CPC</th><th>CTR</th><th style="text-align:left">권장 조치</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`
      : `<div class="muted" style="padding:16px 0">점검이 필요한 상품이 없습니다 👍</div>`}
  </div>`;
  $("#alertBasisSeg")?.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    STATE.alertBasis=b.dataset.b; renderAlertPanel();
  });
}

// 상품별 매출 추이: 선택 상품(매출 상위 N) 의 광고전환매출을 기간별로
function bucketKey(dk, mode){
  const d=new Date(dk+"T00:00:00");
  if(mode==="month") return {k:`${d.getFullYear()}-${pad(d.getMonth()+1)}`, lab:`${String(d.getFullYear()).slice(2)}.${pad(d.getMonth()+1)}`};
  const ws=weekStart(d);
  return {k:`${ws.getFullYear()}-${pad(ws.getMonth()+1)}-${pad(ws.getDate())}`, lab:`${pad(ws.getMonth()+1)}/${pad(ws.getDate())}`};
}
function productTrend(nameSet, topProds){
  // 일자별 집계 (선택 기간의 모든 날짜를 축으로)
  const s=STATE.startDate, e=STATE.endDate;
  const map={}, dayset=new Set();
  for(const r of STATE.prodDaily){
    if(s && r.key<s) continue;
    if(e && r.key>e) continue;
    if(!nameSet.has(r.name)) continue;
    dayset.add(r.key);
    (map[r.name] ||= {}); map[r.name][r.key]=(map[r.name][r.key]||0)+r.adRev;
  }
  let keys=[...dayset].sort();
  if(keys.length>62) keys=keys.slice(-62);   // 너무 길면 최근 62일
  const labels=keys.map(k=>k.slice(5).replace("-","/"));  // MM/DD
  const names=topProds.filter(p=>nameSet.has(p.name)).slice(0,8).map(p=>p.name);
  const series=names.map((nm,i)=>({ name:nm, color:LINE_COLORS[i%LINE_COLORS.length],
    values:keys.map(k=> (map[nm] && map[nm][k]!=null)? map[nm][k] : 0) }));
  return {labels, series, count:names.length};
}

const PROD_COLS=[
  {k:"name",label:"상품명",cls:"pname"},{k:"cost",label:"광고비"},{k:"adRev",label:"광고전환매출"},
  {k:"roas",label:"명목 ROAS"},{k:"imp",label:"노출수"},{k:"clk",label:"클릭수"},
  {k:"ctr",label:"CTR",title:"클릭수 ÷ 노출수"},{k:"cpc",label:"CPC",title:"광고비 ÷ 클릭수"},{k:"cnt",label:"판매수"}];
function renderProductPanel(){
  const c=$("#prodPanel"); if(!c) return;
  if(!STATE.prodDaily||!STATE.prodDaily.length){ c.innerHTML=""; return; }
  const prods=aggregateProducts();
  const allNames=prods.map(p=>p.name);
  const sel = STATE.prodSel===null ? new Set(allNames) : STATE.prodSel;
  const key=STATE.prodSort, dir=STATE.prodDir;
  prods.sort((a,b)=>{
    if(key==="name") return dir*a.name.localeCompare(b.name);
    const va=a[key]==null?-Infinity:a[key], vb=b[key]==null?-Infinity:b[key];
    return dir*(va-vb) || a.name.localeCompare(b.name);
  });
  const q=STATE.prodSearch.trim().toLowerCase();
  let shown = STATE.prodOnlySel ? prods.filter(p=>sel.has(p.name)) : prods.slice();
  if(q) shown = shown.filter(p=>p.name.toLowerCase().includes(q));
  // 선택 합계(검색과 무관하게 체크된 전체 기준)
  const selProds = prods.filter(p=>sel.has(p.name));
  const selCount = selProds.length;
  const t=selProds.reduce((a,p)=>{a.cost+=p.cost;a.adRev+=p.adRev;a.cnt+=p.cnt;a.imp+=p.imp;a.clk+=p.clk;return a;},{cost:0,adRev:0,cnt:0,imp:0,clk:0});
  const tRoas=t.cost>0?t.adRev/t.cost*100:null, tCtr=t.imp>0?t.clk/t.imp*100:null, tCpc=t.clk>0?t.cost/t.clk:null;
  const periodLbl = rangeActive()?`선택 기간(${STATE.startDate||"~"} ~ ${STATE.endDate||"~"})`:"전체 기간";
  const arr=(k)=> k===key ? (dir===1?" ▲":" ▼") : "";
  const th=PROD_COLS.map(col=>`<th class="sortable ${col.cls||""}" data-k="${col.k}"${col.title?` title="${col.title}"`:""}>${col.label}${arr(col.k)}</th>`).join("");

  // 매출 추이(선택 상품, 매출 상위 8개)
  const tr = productTrend(sel, [...selProds].sort((a,b)=>b.adRev-a.adRev));
  const trendHtml = (tr.labels.length>=2 && tr.series.length) ? `
    <div style="margin:8px 0 16px">
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">📈 선택 상품 매출(광고전환매출) 추이
        <span class="muted" style="font-weight:400;font-size:12px">· 일자별${tr.count<selCount?` · 매출 상위 ${tr.count}개만 표시`:""} · 점에 마우스를 올리면 값 표시</span></div>
      <div class="legend">${tr.series.map(s=>`<span><span class="dot" style="background:${s.color}"></span>${escapeHtml(s.name)}</span>`).join("")}</div>
      <div class="chartbox" id="prodTrend"></div>
    </div>` : "";

  let html=`<div class="panel">
    <h2>상품별 광고 상세 <span class="muted" style="font-size:12px">· ${periodLbl}</span></h2>
    <p class="hint">열 머리글을 클릭하면 정렬(오름/내림 전환) · 상품명 검색 · 체크한 상품만 <b>선택 합계</b>·<b>추이 그래프</b>에 반영. ROAS·CTR·CPC는 광고전환매출 기준(실판매액 보정은 상품별로 불가).</p>
    <div class="prodbar">
      <input type="text" id="prodSearch" placeholder="🔎 상품명 검색" value="${escapeHtml(STATE.prodSearch)}">
      <button id="prodAll">전체 선택</button>
      <button id="prodNone">전체 해제</button>
      <label class="only"><input type="checkbox" id="prodOnly"${STATE.prodOnlySel?" checked":""}> 선택만 보기</label>
      <span class="pinfo">${allNames.length}개 상품 · ${selCount}개 선택${q?` · 검색 결과 ${shown.length}개`:""}</span>
    </div>
    ${trendHtml}
    <div class="tblwrap"><table class="prod">
      <thead><tr>
        <th class="chk"><input type="checkbox" id="prodHead" ${selCount===allNames.length&&allNames.length>0?"checked":""}></th>
        ${th}
      </tr></thead><tbody>`;
  for(const p of shown){
    const on=sel.has(p.name);
    html+=`<tr class="${on?"":"off"}">
      <td class="chk"><input type="checkbox" class="pchk" data-name="${escapeHtml(p.name)}"${on?" checked":""}></td>
      <td class="pname">${escapeHtml(p.name)}</td>
      <td class="num">${won(p.cost)}</td>
      <td class="num">${won(p.adRev)}</td>
      <td class="num">${p.roas==null?'<span class="muted">—</span>':pct(p.roas)}</td>
      <td class="num muted">${Math.round(p.imp).toLocaleString("ko-KR")}</td>
      <td class="num muted">${Math.round(p.clk).toLocaleString("ko-KR")}</td>
      <td class="num muted">${p.ctr==null?'—':pct(p.ctr,2)}</td>
      <td class="num muted">${p.cpc==null?'—':won(p.cpc)}</td>
      <td class="num muted">${Math.round(p.cnt).toLocaleString("ko-KR")}</td>

const escapeHtml = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const numOrNull = s => { s=String(s??"").trim(); return s===""?null:num(s); };
const wonR   = n => n==null ? "—" : Math.round(n).toLocaleString("ko-KR")+"원";
const roasFmt= n => n==null ? "—" : Math.round(n).toLocaleString("ko-KR")+"%";
let REPORT=null; // {byKey, months}

function parseReport(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>String(c).trim()!==""));
  if(!rows.length) return {byKey:{},months:[]};
  let h=rows.findIndex(r=>r.some(c=>c.includes("브랜드"))||r.some(c=>c.includes("년월")));
  if(h<0) h=0;
  const hdr=rows[h].map(c=>c.trim());
  const col=(...names)=>{ for(const n of names){const i=hdr.findIndex(c=>c===n); if(i>=0)return i;}
                          for(const n of names){const i=hdr.findIndex(c=>c.includes(n)); if(i>=0)return i;} return -1; };
  const ci={ ym:col("년월","월"), brand:col("브랜드"), gross:col("어드민판매액","판매액"),
             net:col("실판매액","실 판매액"), support:col("지원금"),
             cost:col("광고비","집행광고비","집행 광고비"),
             adRev:col("광고전환매출","광고 전환 매출","전환매출"),
             camp:col("캠페인상세","캠페인"), memo:col("메모","비고") };
  const brandOf=(s)=>{ s=String(s||"").trim().toLowerCase();
    const b=CONFIG.BRANDS.find(b=>b.alias.some(a=>a.toLowerCase()===s)||b.name.toLowerCase()===s); return b?b.id:null; };
  const ymNorm=(s)=>{ const m=String(s||"").match(/(\d{2,4})\s*[-.\/년]?\s*(\d{1,2})/); if(!m)return null;
    let y=+m[1]; if(y<100)y+=2000; return `${y}-${pad(+m[2])}`; };
  const byKey={}, monthsSet=new Set();
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i];
    const ym=ci.ym>=0?ymNorm(r[ci.ym]):null;
    const bid=ci.brand>=0?brandOf(r[ci.brand]):null;
    if(!ym||!bid) continue;
    byKey[`${ym}|${bid}`]={ ym,bid,
      gross:ci.gross>=0?numOrNull(r[ci.gross]):null,
      net:ci.net>=0?numOrNull(r[ci.net]):null,
      support:ci.support>=0?numOrNull(r[ci.support]):null,
      cost:ci.cost>=0?numOrNull(r[ci.cost]):null,
      adRev:ci.adRev>=0?numOrNull(r[ci.adRev]):null,
      camp:ci.camp>=0?String(r[ci.camp]||"").trim():"",
      memo:ci.memo>=0?String(r[ci.memo]||"").trim():"" };
    monthsSet.add(ym);
  }
  return { byKey, months:[...monthsSet].sort().reverse() };
}

function computeAdMonth(brandId, ym){
  const c=STATE.cache[brandId]; if(!c||!c.daily) return {cost:0,adRev:0,has:false};
  let cost=0,adRev=0,has=false;
  for(const r of c.daily){ if(r.key.slice(0,7)===ym){ cost+=r.cost; adRev+=r.adRev; has=true; } }
  return {cost,adRev,has};
}

async function ensureAllBrandAd(){
  for(const b of CONFIG.BRANDS){
    if(STATE.cache[b.id]) continue;
    try{
      const p=parseAd(await fetchCSV(b.ad));
      let sales={}; if(b.sales&&b.sales.trim()){ try{ sales=parseSales(await fetchCSV(b.sales)); }catch(e){} }
      STATE.cache[b.id]={daily:mergeDaily(p.daily,sales),prodDaily:p.prodDaily,hasSalesUrl:!!(b.sales&&b.sales.trim()),loadedAt:new Date(),salesFailed:false};
    }catch(e){ STATE.cache[b.id]={daily:[],prodDaily:[],hasSalesUrl:false,loadedAt:new Date(),error:true}; }
  }
}

// 한 브랜드 계산 결과
function brandReport(bid, ym){
  const cf=confirmedMonth(bid, ym);   // '월간보고' 탭 어드민 확정치
  const adm=computeAdMonth(bid, ym);
  const has=!!cf;
  const cost=(cf&&cf.cost!=null)?cf.cost:adm.cost;
  const adRev=(cf&&cf.adRev!=null)?cf.adRev:(adm.has?adm.adRev:null);
  const gross=cf?cf.gross:null, net=cf?cf.net:null, support=cf?cf.support:null;
  const camp=cf&&cf.camp?cf.camp:"", memo=cf&&cf.memo?cf.memo:"";
  const srcCost=(cf&&cf.cost!=null)?"월간보고":"일별 집계";
  const srcRev =(cf&&cf.adRev!=null)?"월간보고":"일별 집계";
  const R=(net!=null&&gross)?net/gross:null;            // 실결제 반영율
  const nom=(adRev!=null&&cost>0)?adRev/cost*100:null;   // 명목 ROAS
  const adjRev=(adRev!=null&&R!=null)?adRev*R:null;      // 보정 광고전환매출
  const adj=(adjRev!=null&&cost>0)?adjRev/cost*100:null; // 보정 ROAS
  return {has,cost,gross,net,support,adRev,camp,memo,R,nom,adjRev,adj,srcCost,srcRev,
    shareNet:(net&&cost)?cost/net*100:null,
    shareAdj:(adjRev&&cost)?cost/adjRev*100:null,
    adjOverNet:(adjRev!=null&&net)?adjRev/net*100:null };
}

      ${d.adj!=null?`<br><span class="rep-adj" style="margin:6px 0 0">보정) ROAS ${roasFmt(d.adj)} · 광고 전환 매출액 ${wonR(d.adjRev)}</span>`:""}</div>

    ${d.memo?`<div class="rep-memoT">● ${brand.name} 광고 데이터</div><div class="rep-memo">${escapeHtml(d.memo)}</div>`:""}

function reportText(ym){
  const lines=[`[29CM 광고 데이터 ${ym} 보고]`,""];
  CONFIG.BRANDS.forEach((brand,i)=>{
    const d=brandReport(brand.id, ym); const idx=i+1;
    if(!d.has){ lines.push(`${idx}] ${brand.name} — 입력 없음 (집행 광고비 ${wonR(d.cost)})`,""); return; }
    lines.push(`${idx}] ${brand.name} (어드민 기준 판매액 ${wonR(d.gross)} | 실 판매액 ${wonR(d.net)} | 광고비 ${wonR(d.cost)}${d.support!=null?` / 지원금 ${wonR(d.support)} 포함`:""})`);
    if(d.R!=null) lines.push(`*보정값) 광고 전환 매출액 보정 실결제 반영율 ${(d.R*100).toFixed(1)}% 적용*`);
    if(d.camp) lines.push(d.camp);
    lines.push(`집행 광고비 ${wonR(d.cost)} · 광고 전환 매출액 ${wonR(d.adRev)} · 명목 ROAS ${roasFmt(d.nom)}`);
    if(d.adj!=null) lines.push(`보정) ROAS ${roasFmt(d.adj)} · 광고 전환 매출액 ${wonR(d.adjRev)}`);
    lines.push(`광고 비중`,
      `전체 실판매액 대비 ${d.shareNet==null?"—":d.shareNet.toFixed(2)+"%"}`,
      `보정 광고 전환 매출 대비 ${d.shareAdj==null?"—":d.shareAdj.toFixed(2)+"%"}`,
      `보정 광고 전환 매출 = 실 판매액의 약 ${d.adjOverNet==null?"—":d.adjOverNet.toFixed(2)+"%"}`);
    if(d.memo) lines.push(`● ${brand.name} 광고 데이터`, d.memo);
    lines.push("");
  });
  return lines.join("\n");
}

/* ---- 로드 ---- */
async function fetchCSV(url){
  let res;
  try{ res=await fetch(url,{cache:"no-store"}); }
  catch(e){
    // 네트워크 실패 또는 로그인 페이지로의 교차출처 리다이렉트(=미게시)
    const err=new Error("접근 실패 (미게시 또는 네트워크)"); err.kind="blocked"; throw err;
  }
  if(!res.ok){ const err=new Error("HTTP "+res.status); err.kind=(res.status===401||res.status===403)?"blocked":"http"; throw err; }
  return await res.text();
}
function publishHelp(who){

        <br><span class="muted">(특정 시트만 게시하면 나머지 탭은 로그인 요구 → 이 오류가 납니다. 광고 탭·실판매액 탭이 모두 열려야 합니다.)</span></li>

function setFoot(){

async function load(force){
  const brand=currentBrand();
  updateTitle();
  // 캐시 사용(브랜드 전환 시 재요청 없이 즉시 표시). 새로고침은 강제 재요청.
  if(!force && STATE.cache[brand.id]){
    const c=STATE.cache[brand.id];
    STATE.daily=c.daily; STATE.prodDaily=c.prodDaily||[]; STATE.hasSalesUrl=c.hasSalesUrl; STATE.loadedAt=c.loadedAt;
    applyDefaultRange();
    dispatchView(); if(c.salesFailed) salesFailBanner(); setFoot(); setRangeBar(); return;
  }
  $("#content").innerHTML=`<div class="loading"><span class="spin"></span>${brand.name} 데이터를 불러오는 중…</div>`;
  // 광고 데이터
  let ad;
  try{ const p=parseAd(await fetchCSV(brand.ad)); ad=p.daily; STATE.prodDaily=p.prodDaily; }
  catch(e){
    $("#content").innerHTML = e.kind==="blocked"
      ? publishHelp(brand.name+" 광고")
      : `<div class="err"><b>${brand.name} 광고 데이터를 불러오지 못했습니다.</b><br>${e.message}
         <br><br>· 인터넷 연결 확인<br>· 크롬/엣지에서 열었는지 확인</div>`;
    $("#footnote").innerHTML="";
    return;
  }
  // 월간보고 확정 집계 (브랜드 공통, 1회만)
  if(!MONTHLY && CONFIG.MONTHLY_CSV){
    try{ MONTHLY=parseMonthly(await fetchCSV(CONFIG.MONTHLY_CSV)); }
    catch(e){ console.warn("monthly load fail",e); MONTHLY={byKey:{},months:[]}; }
  }
  // 캠페인 매핑 (브랜드 공통, 1회만)
  if(!CAMPMAP && CONFIG.CAMPAIGN_CSV){
    try{ CAMPMAP=parseCampaignMap(await fetchCSV(CONFIG.CAMPAIGN_CSV)); }
    catch(e){ console.warn("campaign map fail",e); CAMPMAP={}; }
  }
  // 실판매액 데이터(선택)
  let sales={}, salesFailed=false;
  STATE.hasSalesUrl=!!(brand.sales && brand.sales.trim());
  if(STATE.hasSalesUrl){
    try{ sales=parseSales(await fetchCSV(brand.sales)); }
    catch(e){ salesFailed=true; console.warn("sales load fail",e); }
  }
  STATE.daily=mergeDaily(ad,sales);
  STATE.loadedAt=new Date();
  STATE.cache[brand.id]={daily:STATE.daily,prodDaily:STATE.prodDaily,hasSalesUrl:STATE.hasSalesUrl,loadedAt:STATE.loadedAt,salesFailed};
  applyDefaultRange();
  dispatchView();
  if(salesFailed) salesFailBanner();
  setFoot();
  setRangeBar();
}
// 주간/월별 대시보드 렌더 (상품별 상세는 render 하단 패널에 포함)
function dispatchView(){ render(); }
function salesFailBanner(){
  $("#content").insertAdjacentHTML("afterbegin",
    `<div class="banner"><b>⚠️ 실판매액 탭을 불러오지 못했습니다.</b> 광고 데이터만 표시 중입니다. `+
    `해당 브랜드 '실판매액' 탭의 게시 상태 또는 gid를 확인하세요.</div>`);
}

// 브랜드 선택 버튼 생성
$("#brandSeg").innerHTML = CONFIG.BRANDS.map((b,i)=>
  `<button data-b="${b.id}"${i===0?' class="on"':''}>${b.name}</button>`).join("");
$("#brandSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  STATE.brandId=b.dataset.b;
  STATE.startDate=null; STATE.endDate=null; STATE.rangeInit=false;  // 브랜드 전환 시 기간 기본값 재적용
  STATE.prodSel=null; STATE.prodOnlySel=false; STATE.prodSearch=""; // 상품 선택·검색 초기화
  [...$("#brandSeg").children].forEach(x=>x.classList.toggle("on",x===b));
  load(false);
});

$("#refreshBtn").addEventListener("click",()=>{
  MONTHLY=null; CAMPMAP=null;
  if(STATE.mode==="report"){ STATE.cache={}; REPORT=null; showReport(true); }
  else load(true);
});
$("#periodSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  STATE.mode=b.dataset.p;
  [...$("#periodSeg").children].forEach(x=>x.classList.toggle("on",x===b));
  if(STATE.mode==="report"){ showReport(false); }
  else {
    $("#brandSeg").style.display="";
    $("#rangeBar").style.display="";
    updateTitle();
    if(STATE.daily.length){ dispatchView(); setRangeBar(); } else load(false);
  }
});
load(false);
</script>
</body>
</html>
