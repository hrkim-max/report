<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트컴퍼니 매출 대시보드</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --text:#e6e9ef; --sub:#9aa3b2; --accent:#5b9dff; --accent2:#7ee0c0;
  --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --c1:#5b9dff; --c2:#7ee0c0; --c3:#f0a868; --c4:#c88bff; --c5:#f87171;
  --c6:#5fd0d8; --c7:#ffd166; --c8:#a3e635; --c9:#fb7185; --c10:#93c5fd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Roboto,sans-serif;
  font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:20px;margin:0;font-weight:700}
.badge{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.badge.time{color:var(--accent2);border-color:#2c4a44}
.muted{color:var(--sub)}
.small{font-size:12px}
a{color:var(--accent)}

.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:transparent;border:0;color:var(--sub);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:#08101f}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}

.rangebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin:8px 0}
.rangebar input[type=date]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 8px;font-size:13px}
input,select{font-family:inherit}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .lab{font-size:12px;color:var(--sub)}
.kpi .val{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.kpi .delta{font-size:12px;margin-top:3px}
.kpi .sub2{font-size:11px;color:var(--sub);margin-top:1px}
.up{color:var(--good)} .down{color:var(--bad)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .h-sub{font-size:12px;color:var(--sub);font-weight:500}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th.act{color:var(--text)}
tbody tr:hover{background:var(--panel2)}
.tbl-wrap{overflow-x:auto;max-height:560px;overflow-y:auto}
.mini{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;display:inline-block;width:70px;vertical-align:middle}
.mini>i{display:block;height:100%;background:var(--accent)}
.pos{color:var(--good)} .neg{color:var(--bad)}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.notice{background:#20242e;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--sub);font-size:13px}
.err{border-color:var(--bad);color:#f7b4b4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.tinput{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 9px;font-size:13px}
.chks{display:flex;gap:8px 14px;flex-wrap:wrap;margin:2px 0 4px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.chk.on{color:var(--text);border-color:var(--accent)}
.chk input{accent-color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#08101f;border-color:var(--accent);font-weight:700}
.tnum{width:150px;text-align:right;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 7px;font-size:13px}
.xbtn{background:transparent;border:0;color:var(--sub);cursor:pointer;font-size:14px}
.xbtn:hover{color:var(--bad)}
#chartTip{position:fixed;pointer-events:none;background:#0b0e13;border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;font-size:12px;color:var(--text);z-index:6000;display:none;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center">
  <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 26px;width:320px;max-width:90vw;text-align:center">
    <div style="font-size:30px">🔒</div>
    <div style="font-size:16px;font-weight:700;margin:8px 0 2px">프로젝트컴퍼니 매출 대시보드</div>
    <div class="muted small" style="margin-bottom:16px">비밀번호를 입력하세요</div>
    <input id="gatePw" type="password" class="tinput" style="width:100%;text-align:center;font-size:15px;padding:9px" placeholder="비밀번호" autocomplete="current-password">
    <div id="gateErr" class="small" style="color:var(--bad);height:18px;margin:6px 0"></div>
    <button id="gateBtn" class="btn pri" style="width:100%;padding:9px">열기</button>
  </div>
</div>
<div class="wrap">
  <header class="top">
    <h1>📊 프로젝트컴퍼니 매출 대시보드</h1>
    <span class="badge" id="srcBadge">데이터 불러오는 중…</span>
    <span class="badge time" id="metaBadge" style="display:none"></span>
    <span class="badge" id="rangeBadge"></span>
    <button id="refreshBtn" class="btn" style="margin-left:auto" title="매출마스터를 다시 읽어 집계를 갱신합니다 (약 10~15분)">🔄 데이터 갱신</button>
  </header>
  <div class="muted small" id="subtitle">매출마스터 기준 · 개인정보 제외 집계</div>

  <div class="bar">
    <div class="seg" id="viewSeg">
      <button data-v="overview" class="on">개요·추이</button>
      <button data-v="channel">채널별</button>
      <button data-v="category">카테고리별</button>
      <button data-v="product">제품별</button>
      <button data-v="surge">급상승</button>
      <button data-v="target">목표 대비</button>
    </div>
    <div class="seg" id="metricSeg" title="집계 기준 금액">
      <button data-m="sales" class="on">매출</button>
      <button data-m="pay">실결제가</button>
    </div>
  </div>

  <div class="rangebar" id="rangeBar">
    <span class="small muted">기간</span>
    <span class="seg" id="presetSeg">
      <button data-preset="today">오늘</button>
      <button data-preset="7d" class="on">최근 7일</button>
      <button data-preset="thismonth">이번달</button>
      <button data-preset="30">최근 30일</button>
      <button data-preset="60">최근 60일</button>
      <button data-preset="90">최근 90일</button>
      <button data-preset="ytd">올해</button>
    </span>
    <input type="date" id="dStart"><span class="muted">~</span><input type="date" id="dEnd">
    <span class="seg" style="margin-left:auto">
      <button data-g="day" id="gDay">일별</button>
      <button data-g="month" id="gMonth" class="on">월별</button>
    </span>
  </div>

  <div class="rangebar" id="cmpBar">
    <span class="small muted">비교</span>
    <span class="seg" id="cmpSeg">
      <button data-cmp="none">없음</button>
      <button data-cmp="prev" class="on">직전 기간</button>
      <button data-cmp="yoy">전년 동기</button>
      <button data-cmp="custom">사용자지정</button>
    </span>
    <span id="cmpCustom" style="display:none">
      <input type="date" id="cStart"><span class="muted">~</span><input type="date" id="cEnd">
    </span>
    <span class="small muted" id="cmpInfo" style="margin-left:auto"></span>
  </div>

  <div id="app"></div>

  <div class="notice small" id="setupNote" style="margin-top:16px;display:none"></div>
</div>

  view:'overview', metric:'sales', gran:'month',

  .map(function(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();});

/* ============================ 유틸 ============================ */
function won(n){ n=Math.round(n||0);
  if(Math.abs(n)>=100000000) return (n/100000000).toFixed(n%100000000?1:0).replace(/\.0$/,'')+'억';
  if(Math.abs(n)>=10000)     return Math.round(n/10000).toLocaleString()+'만';
  return n.toLocaleString(); }
function wonFull(n){ return Math.round(n||0).toLocaleString()+'원'; }
function pct(n){ return (n>=0?'+':'')+n.toFixed(1)+'%'; }
function el(tag,attrs,html){ var e=document.createElement(tag);
  if(attrs)for(var k in attrs)e.setAttribute(k,attrs[k]); if(html!=null)e.innerHTML=html; return e; }
// 타이핑 검색 가능한 셀렉트(input+datalist). options=문자열 배열, onPick(선택값) 콜백.
var _slid=0;
function searchSelect(options, value, onPick, placeholder){
  var id='dl'+(_slid++);
  var inp=el('input',{class:'tinput',list:id,placeholder:placeholder||'검색/선택',style:'min-width:170px'}); inp.value=value||'';
  var dl=el('datalist',{id:id});
  options.forEach(function(o){ dl.appendChild(el('option',{value:o})); });
  inp.onchange=function(){ if(options.indexOf(inp.value)>=0) onPick(inp.value); else inp.value=value||''; };
  var span=el('span',{style:'display:inline-flex;align-items:center'}); span.appendChild(inp); span.appendChild(dl); return span;
}
// 검색 입력 디바운스: 타이핑 중엔 재렌더 안 함(한글 IME 조합 깨짐 방지), 멈추면 갱신
var _fltTimer;
function dbFilter(setter, focusKey){
  return function(e){ setter(e.target.value); clearTimeout(_fltTimer); _fltTimer=setTimeout(function(){ STATE.filterFocus=focusKey; render(); },230); };
}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shiftYear(d,n){ var p=d.split('-'); return (parseInt(p[0],10)+n)+'-'+p[1]+'-'+p[2]; }
function daysBetween(s,e){ return Math.round((new Date(e)-new Date(s))/864e5)+1; }
function monthRange(s,e){ var out=[],y=+s.slice(0,4),m=+s.slice(5,7),ey=+e.slice(0,4),em=+e.slice(5,7);
  while(y<ey||(y===ey&&m<=em)){ out.push(y+'-'+pz(m)); m++; if(m>12){m=1;y++;} } return out; }

function parseCSV(text){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){ if(ch=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false;} else cur+=ch; }
    else{ if(ch=='"')q=true; else if(ch==','){row.push(cur);cur='';}
      else if(ch=='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch=='\r'){} else cur+=ch; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function csvToObjects(text){
  var rows=parseCSV(text).filter(function(r){return r.length>1||(r[0]&&r[0].trim());});
  if(!rows.length) return [];
  var head=rows[0].map(function(h){return h.trim();});
  return rows.slice(1).map(function(r){var o={};head.forEach(function(h,i){o[h]=(r[i]||'').trim();});return o;});
}
function toNum(v){ if(v==null)return 0; var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function pz(s){ s=String(s).trim(); return s.length<2?'0'+s:s; }
function normYm(s){ if(!s)return s; var p=String(s).trim().split('-'); return p.length<2?s:(p[0]+'-'+pz(p[1])); }
function normDate(s){ if(!s)return s; var p=String(s).trim().split('-'); return p.length<3?s:(p[0]+'-'+pz(p[1])+'-'+pz(p[2])); }

function fetchCSV(gid){
  if(!gid) return Promise.reject('no-config');
  // localhost(로컬 서버) = 프록시 경유 / 그 외 실제 https 출처(GitHub Pages 등) = 게시 CSV 직접
  var url, host=location.hostname;
  if(host==='localhost'||host==='127.0.0.1') url='csv/'+gid;
  else { if(!CONFIG.PUB) return Promise.reject('no-config'); url=CONFIG.PUB+gid; }
  return fetch(url).then(function(r){ if(!r.ok)throw r.status; return r.text(); });
}
function fetchOpt(gid){ return gid? fetchCSV(gid).catch(function(){return '';}) : Promise.resolve(''); }
function load(){
  try{ STATE.tOv=JSON.parse(localStorage.getItem('salesTargetOverrides')||'{}'); }catch(e){ STATE.tOv={}; }
  Promise.all([

    STATE.prod = csvToObjects(res[2]).map(function(o){return {

      sales:toNum(o['매출']), pay:toNum(o['결제가']) };}).filter(function(r){return r.ym;});
    STATE.opt = res[3]? csvToObjects(res[3]).map(function(o){return {

    STATE.chprod = res[5]? csvToObjects(res[5]).map(function(o){return {
      ym:normYm(o['년월']), ch:o['채널'], cat:o['카테고리']||'', prod:o['제품']||'', qty:toNum(o['수량']), cnt:toNum(o['건수']),

    STATE.loaded=true; STATE.usingMock=false;
    afterLoad();
  }).catch(function(e){
    buildMock(); STATE.loaded=true; STATE.usingMock=true; afterLoad(e);

/* ============================ 샘플 데이터 ============================ */
function buildMock(){
  var chs=['PS스토어팜','P자사몰','선물하기','메이커스','29CM','쿠팡(로)','컬리','오늘의집'];
  var cats=['매트리스','토퍼','베개','이불','패드류','라포즈','소품','추가커버'];
  var prods=['퍼펙션매트리스','푹신토퍼','충분베개','촉감이불','냉감패드','쿨쿨곰','아워글래스','방수패드','플립토퍼','솔솔베개'];
  var daily={},cat={},prod={};
  var d=new Date(2024,0,1), end=new Date(2026,7,12);
  var seed=42; function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
  while(d<=end){
    var ds=fmt(d), ym=ds.slice(0,7);
    var growth=1+ (d-new Date(2024,0,1))/(1000*3600*24*365)*0.35;
    var season=1+0.25*Math.sin((d.getMonth()/12)*6.28);
    chs.forEach(function(ch,ci){ if(rnd()<0.15)return;
      var base=(ci<3?2500000:600000)*growth*season*(0.6+rnd()*0.8);
      addM(daily,ds+'|'+ch,Math.round(base/70000),base); });
    cats.forEach(function(c,ci){ if(rnd()<0.1)return;
      var base=(1200000-ci*80000)*growth*season*(0.6+rnd()*0.8);
      addM(cat,ym+'|'+c,Math.round(base/70000),base); });
    if(d.getDate()===1){ prods.forEach(function(p,pi){
      var base=(30000000-pi*2200000)*growth*season*(0.7+rnd()*0.6);
      addM(prod,ym+'|'+p+'|'+cats[pi%cats.length],Math.round(base/70000),base); }); }
    d.setDate(d.getDate()+1);
  }
  STATE.daily=toArr(daily,['date','ch']); STATE.cat=toArr(cat,['ym','cat']); STATE.prod=toArr(prod,['ym','prod','cat']); STATE.opt=[];
  function addM(o,k,q,s){var x=o[k]||(o[k]={q:0,c:0,s:0});x.q+=q;x.c+=1;x.s+=s;}
  function toArr(o,keys){return Object.keys(o).map(function(k){var p=k.split('|'),x=o[k],r={};
    keys.forEach(function(kk,i){r[kk]=p[i];}); r.qty=x.q;r.cnt=x.c;r.sales=Math.round(x.s);r.pay=Math.round(x.s*0.93);return r;});}
}

function curStart(){ return STATE.start||STATE.minDate; }
function curEnd(){ return STATE.end||STATE.maxDate; }
function inRange(dateOrYm){
  var d=dateOrYm.length>7?dateOrYm:dateOrYm+'-01';
  var s=curStart(), e=curEnd();
  if(d<s)return false; if(d>e)return false; return true;
}
function metric(){ return STATE.metric; }
function chDisp(ch){ return CONFIG.CH_MERGE[ch]||ch; }
function notExcl(r){ return CONFIG.CH_EXCLUDE.indexOf(r.ch)<0; }

// 월 단위 데이터: 기간이 '걸친' 월을 포함 (2026-08-06~12 → 2026-08 포함)

function fDaily(){ return STATE.daily.filter(function(r){ return notExcl(r)&&inRange(r.date); }); }

// 비교 기간 계산
function cmpRange(){
  if(STATE.cmp==='none') return null;
  var s=curStart(), e=curEnd();
  if(STATE.cmp==='yoy') return {start:shiftYear(s,-1),end:shiftYear(e,-1),label:'전년 동기'};
  if(STATE.cmp==='custom'){ if(!STATE.cmpStart||!STATE.cmpEnd)return null; return {start:STATE.cmpStart,end:STATE.cmpEnd,label:'사용자지정'}; }
  var days=daysBetween(s,e);
  var pe=new Date(s); pe.setDate(pe.getDate()-1);
  var ps=new Date(pe); ps.setDate(ps.getDate()-(days-1));
  return {start:fmt(ps),end:fmt(pe),label:'직전 기간'};
}
function rangeTotals(s,e,chFilter){
  var t=0,c=0,q=0,m=STATE.metric;
  STATE.daily.forEach(function(r){ if(!notExcl(r))return; if(chFilter&&!chFilter(r))return;
    if(r.date>=s&&r.date<=e){ t+=r[m]; c+=r.cnt; q+=r.qty; } });
  return {t:t,c:c,q:q};
}

function sumBy(rows,keyFn){ var m={}; rows.forEach(function(r){
  var k=keyFn(r); var o=m[k]||(m[k]={sales:0,pay:0,qty:0,cnt:0,key:k});
  o.sales+=r.sales;o.pay+=r.pay;o.qty+=r.qty;o.cnt+=r.cnt; }); return m; }
function bucketOf(date){ return STATE.gran==='day'?date:date.slice(0,7); }

  }
  var fin=el('input',{class:'tinput',placeholder:'채널 검색…'}); fin.value=STATE.tFilter||''; fin.setAttribute('data-fkey','tgtFilter');
  fin.oninput=dbFilter(function(v){STATE.tFilter=v;},'tgtFilter');
  bar.appendChild(fin);
  var bSave=el('button',{class:'btn pri'},'💾 목표 저장'); bSave.onclick=function(){ var n=new Date(); localStorage.setItem('salesTargetSavedAt', n.getFullYear()+'.'+pz(n.getMonth()+1)+'.'+pz(n.getDate())+' '+pz(n.getHours())+':'+pz(n.getMinutes())); saveOverrides(); render(); };
  bar.appendChild(bSave);
  var bReset=el('button',{class:'btn'},'기본값 복원'); bReset.onclick=function(){ if(confirm('직접 입력한 목표를 모두 지우고 기본값으로 되돌릴까요?')){ STATE.tOv={}; saveOverrides(); render(); } };
  bar.appendChild(bReset);
  var sv=localStorage.getItem('salesTargetSavedAt'); if(sv) bar.appendChild(el('span',{class:'small muted',style:'margin-left:auto'},'🕒 마지막 저장: '+sv));
  app.appendChild(bar);

  var flt=(STATE.tFilter||'').toLowerCase();
  var shown=groups.filter(function(g){ return !flt || g.toLowerCase().indexOf(flt)>=0; });

  var data=shown.map(function(grp){
    var tgt=isYear?effAnnual(grp,pickY):effTarget(grp,pick);
    var act;
    if(isYear){ act=0; for(var m=1;m<=12;m++){ var kk=grp+'|'+(pickY+'-'+pz(m)); if(actual[kk])act+=actual[kk].s; } }
    else act=(actual[grp+'|'+pick]?actual[grp+'|'+pick].s:0);
    return {grp:grp,tgt:tgt,act:act};
  }).filter(function(x){ return x.tgt!=null || x.act>0; });
  data.sort(function(a,b){return (b.tgt||0)-(a.tgt||0);});
  var sumT=data.reduce(function(s,x){return s+(x.tgt||0);},0);
  var sumA=data.reduce(function(s,x){return s+x.act;},0);
  var lab=isYear?(pickY+'년'):pick;

  var box=el('div',{class:'kpis'});
  box.appendChild(kpi(lab+' 목표 합계',wonFull(sumT),null,'',null));
  box.appendChild(kpi(lab+' 실적 합계',wonFull(sumA),null,'',null));
  var dk=el('div',{class:'kpi'}); dk.appendChild(el('div',{class:'lab'},'전체 달성률'));
  dk.appendChild(el('div',{class:'val '+(sumA>=sumT&&sumT>0?'up':'')},sumT?((sumA/sumT*100).toFixed(1)+'%'):'-'));
  box.appendChild(dk); app.appendChild(box);

  var c=el('div',{class:'card'});
  c.appendChild(el('h3',null,lab+' 채널별 목표 대비 <span class="h-sub">'+(isYear?'연간(전체) 목표':'월별 목표')+' 직접 수정 → 💾 저장 · 빈칸=목표 없음</span>'));
  var t=el('table');
  t.innerHTML='<thead><tr><th>채널</th><th>'+(isYear?'연간 목표(수정)':'목표(수정)')+'</th><th>실적</th><th>달성률</th><th></th></tr></thead>';

    tdTgt.appendChild(inp);
    var rate=x.tgt?x.act/x.tgt*100:null;

    var tdBar=el('td'); tdBar.innerHTML= rate==null?'':'<span class="mini"><i style="width:'+Math.min(100,rate)+'%;background:'+(rate>=100?'var(--good)':rate>=70?'var(--warn)':'var(--bad)')+'"></i></span>';
    tr.appendChild(tdCh);tr.appendChild(tdTgt);tr.appendChild(tdAct);tr.appendChild(tdRate);tr.appendChild(tdBar);
    tb.appendChild(tr);

  trS.innerHTML='<td>합계</td><td>'+wonFull(sumT)+'</td><td>'+wonFull(sumA)+'</td><td>'+(sumT?(sumA/sumT*100).toFixed(0)+'%':'-')+'</td><td></td>';

  if(STATE.usingMock) c.appendChild(el('div',{class:'small muted',style:'margin-top:8px'},'※ 샘플 데이터 기준 예시입니다.'));
  app.appendChild(c);

}

/* ============================ 표 (필터+정렬 asc/desc) ============================ */
// interactive=true: 이름 필터 + 헤더 클릭 정렬(뷰당 1개 권장). false: 고정 매출 내림차순(보조 표).
// key: 표 고유 키(있으면 독립 정렬+필터). defSortHdr: 기본 정렬열. noFilter: 필터 상자 숨김(정렬만).
function tableOf(headers,rows,types,key,defSortHdr,noFilter){
  var wrap=el('div');
  var defIdx=defSortHdr?headers.indexOf(defSortHdr):-1; if(defIdx<0)defIdx=headers.indexOf('매출'); if(defIdx<0)defIdx=1;
  var interactive=!!key;
  var st = interactive ? (STATE.sorts[key]||(STATE.sorts[key]={idx:null,dir:-1})) : {idx:null,dir:-1};
  if(interactive && !noFilter){
    var filt=STATE.filters[key]||'';
    var fb=el('div',{class:'bar',style:'margin:0 0 8px'});
    var inp=el('input',{class:'tinput',placeholder:'이름으로 필터…'}); inp.value=filt; inp.setAttribute('data-fkey',key);
    inp.oninput=dbFilter(function(v){ STATE.filters[key]=v; }, key);
    fb.appendChild(inp);
    if(filt){ var cl=el('button',{class:'btn'},'지우기'); cl.onclick=function(){STATE.filters[key]='';STATE.filterFocus=null;render();}; fb.appendChild(cl); }
    fb.appendChild(el('span',{class:'small muted'},'헤더 클릭 = 정렬(오름/내림)'));
    wrap.appendChild(fb);
    var f=filt.toLowerCase(); if(f) rows=rows.filter(function(r){return String(r[0]).toLowerCase().indexOf(f)>=0;});
  }
  var sc=(interactive&&st.idx!=null&&st.idx<headers.length)?st.idx:defIdx;
  var dir=interactive?(st.dir||-1):-1;
  rows=rows.slice().sort(function(a,b){var av=a[sc],bv=b[sc];
    if(typeof av==='number'&&typeof bv==='number')return dir*(av-bv);
    return dir*String(av).localeCompare(String(bv),'ko'); });
  var t=el('table'); var thead=el('thead'); var htr=el('tr');
  headers.forEach(function(h,i){
    var arrow=(interactive&&i===sc)?(dir<0?' ▼':' ▲'):'';
    var th=el('th',{class:(interactive&&i===sc)?'act':''},h+arrow);
    if(interactive) th.onclick=function(){ if(i===sc){st.idx=i;st.dir=-dir;} else {st.idx=i;st.dir=-1;} render(); };
    else th.style.cursor='default';
    htr.appendChild(th);
  });
  thead.appendChild(htr); t.appendChild(thead);
  var tb=el('tbody');
  rows.forEach(function(r){ var tr=el('tr');
    r.forEach(function(v,i){ var td=el('td');
      if(types[i]==='won') td.textContent=wonFull(v);
      else if(types[i]==='num') td.textContent=Math.round(v).toLocaleString();
      else if(types[i]==='share') td.innerHTML=(v*100).toFixed(1)+'% <span class="mini"><i style="width:'+(v*100).toFixed(0)+'%"></i></span>';
      else if(types[i]==='pct'){ if(!isFinite(v)){td.innerHTML='<b>신규</b>';td.className='pos';} else {td.innerHTML='<b>'+(v>=0?'+':'')+Math.round(v)+'%</b>'; td.className=(v>=50?'pos':v<0?'neg':'');} }
      else td.textContent=v;
      tr.appendChild(td); });
    tb.appendChild(tr); });
  t.appendChild(tb); var w=el('div',{class:'tbl-wrap'}); w.appendChild(t); wrap.appendChild(w);
  return wrap;
}

/* ============================ 차트 ============================ */
function uniqBuckets(rows){ var s={}; rows.forEach(function(r){s[bucketOf(r.date)]=1;}); return Object.keys(s).sort(); }
function uniqYm(rows){ var s={}; rows.forEach(function(r){s[r.ym]=1;}); return Object.keys(s).sort(); }
function legendOf(names){ var l=el('div',{class:'legend'});
  names.forEach(function(n,i){ l.appendChild(el('span',null,'<span class="dot" style="background:'+COLORS[i%COLORS.length]+'"></span>'+n)); }); return l; }
function niceTop(v){ if(v<=0)return 1; var p=Math.pow(10,Math.floor(Math.log10(v))); var n=v/p; var m=n<=1?1:n<=2?2:n<=5?5:10; return m*p; }
function escA(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 차트 요소(data-tip)에 호버 툴팁 연결
function attachTips(container){
  var tip=document.getElementById('chartTip');
  if(!tip){ tip=el('div',{id:'chartTip'}); document.body.appendChild(tip); }
  container.querySelectorAll('[data-tip]').forEach(function(elm){
    elm.addEventListener('mousemove',function(e){ tip.textContent=elm.getAttribute('data-tip'); tip.style.display='block';
      var x=e.clientX+14, y=e.clientY+14; if(x+tip.offsetWidth>window.innerWidth)x=e.clientX-tip.offsetWidth-14;
      tip.style.left=x+'px'; tip.style.top=y+'px'; });
    elm.addEventListener('mouseleave',function(){ tip.style.display='none'; });
  });
}

function lineChart(labels,series){
  var W=1100,H=340,pad={l:56,r:16,t:16,b:46};
  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  var maxV=niceTop(Math.max.apply(null,series.reduce(function(a,s){return a.concat(s.data);},[0])));
  var n=labels.length, dx=n>1?iw/(n-1):0;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  for(var g=0;g<=4;g++){var y=pad.t+ih*g/4;var val=maxV*(1-g/4);
    svg+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'" stroke="var(--line)"/>';
    svg+='<text x="'+(pad.l-8)+'" y="'+(y+4)+'" fill="var(--sub)" font-size="11" text-anchor="end">'+won(val)+'</text>';}
  var step=Math.max(1,Math.ceil(n/12));
  for(var i=0;i<n;i++){ if(i%step!==0&&i!==n-1)continue; var x=pad.l+dx*i;
    var lab=labels[i]; if(STATE.gran==='day')lab=lab.slice(5); else lab=lab.slice(2);
    svg+='<text x="'+x+'" y="'+(H-pad.b+18)+'" fill="var(--sub)" font-size="10" text-anchor="middle">'+lab+'</text>';}
  series.forEach(function(s){
    var pts=s.data.map(function(v,i){return [pad.l+dx*i, pad.t+ih*(1-(v/maxV))];});
    if(n>1){ var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
      svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.2"'+(s.dash?' stroke-dasharray="5 4" opacity="0.8"':'')+'/>'; }
    pts.forEach(function(p,i){
      if(!s.dash) svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(n===1?4:3)+'" fill="'+s.color+'" stroke="var(--panel)" stroke-width="1"/>';
      else svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.2" fill="'+s.color+'" opacity="0.7"/>';
      svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="8" fill="transparent" pointer-events="all" data-tip="'+escA(s.name+' · '+labels[i]+' · '+wonFull(s.data[i]))+'"/>';
    });
  });
  svg+='</svg>'; var d=el('div'); d.innerHTML=svg; attachTips(d); return d;
}
function donut(arr,total){
  var W=260,H=200,cx=100,cy=100,rO=82,rI=48;
  var svg='<svg viewBox="0 0 '+W+' '+H+'">'; var ang=-Math.PI/2;
  arr.forEach(function(x,i){ var frac=x.val/total; var a2=ang+frac*Math.PI*2; var lg=frac>0.5?1:0;
    var x1=cx+rO*Math.cos(ang),y1=cy+rO*Math.sin(ang),x2=cx+rO*Math.cos(a2),y2=cy+rO*Math.sin(a2);
    var xi2=cx+rI*Math.cos(a2),yi2=cy+rI*Math.sin(a2),xi1=cx+rI*Math.cos(ang),yi1=cy+rI*Math.sin(ang);
    svg+='<path d="M'+x1+' '+y1+' A'+rO+' '+rO+' 0 '+lg+' 1 '+x2+' '+y2+' L'+xi2+' '+yi2+' A'+rI+' '+rI+' 0 '+lg+' 0 '+xi1+' '+yi1+' Z" fill="'+COLORS[i%COLORS.length]+'" data-tip="'+escA(x.name+' · '+wonFull(x.val)+' ('+(frac*100).toFixed(1)+'%)')+'"/>'; ang=a2; });
  svg+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">'+won(total)+'</text>';
  svg+='<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" fill="var(--sub)" font-size="10">합계</text>';
  svg+='</svg>'; var d=el('div'); d.innerHTML=svg; attachTips(d); return d;
}

/* ============================ 기간 프리셋 ============================ */
function applyPreset(p){
  STATE.preset=p;
  var max=STATE.maxDate, e=new Date(max), s;
  if(p==='today'){ STATE.start=max; STATE.end=max; }
  else if(p==='7d'){ s=new Date(e); s.setDate(s.getDate()-6); STATE.start=fmt(s); STATE.end=max; }
  else if(p==='thismonth'){ STATE.start=max.slice(0,7)+'-01'; STATE.end=max; }
  else if(p==='30'){ s=new Date(e); s.setDate(s.getDate()-29); STATE.start=fmt(s); STATE.end=max; }
  else if(p==='60'){ s=new Date(e); s.setDate(s.getDate()-59); STATE.start=fmt(s); STATE.end=max; }
  else if(p==='90'){ s=new Date(e); s.setDate(s.getDate()-89); STATE.start=fmt(s); STATE.end=max; }
  else if(p==='ytd'){ STATE.start=max.slice(0,4)+'-01-01'; STATE.end=max; }
  // 기간 길이에 따라 일별/월별 자동 선택
  STATE.gran = daysBetween(STATE.start,STATE.end) <= 92 ? 'day' : 'month';
  document.getElementById('dStart').value=STATE.start;
  document.getElementById('dEnd').value=STATE.end;
  document.querySelectorAll('#presetSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.preset===p);});
  render();
}
function markCustomRange(){ STATE.preset=''; document.querySelectorAll('#presetSeg button').forEach(function(b){b.classList.remove('on');}); }

/* ============================ 비밀번호 잠금 ============================ */
// 주의: 소스를 열람할 수 있는 사람은 우회 가능한 가벼운 잠금입니다(완전 보안 아님).
var PW_HASH='1d88a063de73ba7681894885d98427139c654905f84115d1c94963c1ffd5c340';
var _loaded=false;
function reveal(){ document.getElementById('gate').style.display='none'; if(!_loaded){ _loaded=true; load(); } }
async function sha256hex(s){
  if(window.crypto&&crypto.subtle){ var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  return null;
}
async function tryUnlock(){
  var v=document.getElementById('gatePw').value;
  var h=await sha256hex(v);
  if(h===PW_HASH){ try{sessionStorage.setItem('pcmd_unlocked','1');}catch(e){} reveal(); }
  else { document.getElementById('gateErr').textContent='비밀번호가 올바르지 않습니다.'; document.getElementById('gatePw').select(); }
}
document.getElementById('gateBtn').addEventListener('click',tryUnlock);
document.getElementById('gatePw').addEventListener('keydown',function(e){ if(e.key==='Enter')tryUnlock(); });
if(sessionStorage.getItem('pcmd_unlocked')==='1'){ reveal(); }
else { setTimeout(function(){var f=document.getElementById('gatePw'); if(f)f.focus();},100); }
</script>
