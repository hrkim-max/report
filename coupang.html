<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>쿠팡 광고 리포트</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#fbfcfe; --text:#0f172a; --muted:#64748b;
    --border:#e2e8f0; --grid:#eef2f6;
    --cost:#ef4444; --rev:#f59e0b; --roas:#8b5cf6; --net:#2563eb;
    --rocket:#2563eb; --wing:#f97316;
    --good:#059669; --bad:#dc2626; --warnbg:#fff7ed; --warnbd:#fed7aa; --warntx:#9a3412;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --panel:#111a2b; --panel2:#0f1728; --text:#e5edf7; --muted:#93a4bd;
      --border:#22304a; --grid:#1a2740;
      --cost:#f87171; --rev:#fbbf24; --roas:#a78bfa; --net:#3b82f6;
      --rocket:#60a5fa; --wing:#fb923c;
      --good:#34d399; --bad:#f87171; --warnbg:#2a1c0e; --warnbd:#7c4a1e; --warntx:#fdba74;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between;margin-bottom:18px}
  h1{font-size:22px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel);
    color:var(--text);padding:8px 14px;border-radius:9px;transition:.15s}
  button:hover{border-color:var(--net)}
  button.primary{background:var(--net);border-color:var(--net);color:#fff}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px}
  .seg button{border:none;background:transparent;padding:7px 15px;border-radius:8px;color:var(--muted)}
  .seg button.on{background:var(--net);color:#fff}
  .banner{border:1px solid var(--warnbd);background:var(--warnbg);color:var(--warntx);
    border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:13.5px}
  .banner b{color:inherit}
  .banner ol{margin:8px 0 0;padding-left:20px}
  .banner code{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:5px;font-size:12px}
  @media(prefers-color-scheme:dark){.banner code{background:rgba(255,255,255,.1)}}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
  .card .lab{font-size:12px;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .card .val{font-size:21px;font-weight:700;letter-spacing:-.02em}
  .card .val small{font-size:13px;font-weight:600;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px 18px 8px;box-shadow:var(--shadow);margin-bottom:20px}
  .panel h2{font-size:15px;margin:0 0 4px}
  .panel .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){.charts{grid-template-columns:1fr}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 10px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .chartbox{width:100%;overflow-x:auto}
  svg text{fill:var(--muted)}
  .tblwrap{overflow-x:auto;margin-top:4px}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
  th,td{padding:9px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel);text-align:right}
  th:first-child,td:first-child{text-align:left}
  tbody tr:hover{background:var(--panel2)}
  td.num{font-variant-numeric:tabular-nums}
  .pos{color:var(--good);font-weight:600}
  .neg{color:var(--bad);font-weight:600}
  .muted{color:var(--muted)}
  .bdg{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;vertical-align:middle;cursor:help;white-space:nowrap}
  .bdg.prov{background:#fff1e6;color:#b45309;border:1px solid #fed7aa}
  .bdg.conf{background:#e8f7ef;color:#047857;border:1px solid #a7f3d0}
  .bdg.hi{background:#fdecec;color:#b91c1c;border:1px solid #fecaca}
  .bdg.mid{background:#fff1e6;color:#b45309;border:1px solid #fed7aa}
  .bdg.lo{background:#fefce8;color:#a16207;border:1px solid #fde68a}
  .bdg.good{background:#e8f7ef;color:#047857;border:1px solid #a7f3d0}
  .bdg.ch{cursor:default}
  @media(prefers-color-scheme:dark){
    .bdg.prov{background:#3a2a12;color:#fbbf24;border-color:#7c5a1e}
    .bdg.conf{background:#0f2f22;color:#34d399;border-color:#1e6b4a}
    .bdg.hi{background:#3b1717;color:#fca5a5;border-color:#7f1d1d}
    .bdg.mid{background:#3a2a12;color:#fbbf24;border-color:#7c5a1e}
    .bdg.lo{background:#332b12;color:#fcd34d;border-color:#6b5a1e}
    .bdg.good{background:#0f2f22;color:#34d399;border-color:#1e6b4a}
  }
  tfoot td{font-weight:700;border-top:2px solid var(--border);border-bottom:none;background:var(--panel2)}
  .err{border:1px solid var(--warnbd);background:var(--warnbg);color:var(--warntx);border-radius:12px;padding:16px}
  .foot{color:var(--muted);font-size:12px;margin-top:26px;line-height:1.7}
  /* 기간(달력) 바 */
  .rangebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--muted)}
  .rangebar:empty{display:none}
  .rangebar .rb-label{font-weight:700;color:var(--text)}
  .rangebar input[type=date]{font:inherit;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
  .rangebar button{padding:6px 11px;font-size:12.5px}
  .rangebar button.rb-on{background:var(--net);border-color:var(--net);color:#fff}
  .rangebar .rb-info{margin-left:auto;font-size:12px;color:var(--muted)}
  @media(max-width:640px){.rangebar .rb-info{margin-left:0;width:100%}}
  /* 필터 바 */
  .filterbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 18px;font-size:13px;color:var(--muted)}
  .filterbar:empty{display:none}
  .filterbar select{font:inherit;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);max-width:260px}
  .filterbar .fb-label{font-weight:700;color:var(--text)}
  .filterbar .seg{padding:2px}
  .filterbar .seg button{padding:5px 12px;font-size:12.5px}
  .filterbar .fb-note{margin-left:auto;font-size:12px}
  @media(max-width:720px){.filterbar .fb-note{margin-left:0;width:100%}}
  /* 상품별 표 */
  .prodbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
  .prodbar button{padding:6px 12px;font-size:12.5px}
  .prodbar .pinfo{margin-left:auto;color:var(--muted);font-size:12px}
  .prodbar label.only{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .prodbar input[type=text]{font:inherit;padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);min-width:150px}
  table.prod td.chk,table.prod th.chk{width:36px;text-align:center;padding-left:4px;padding-right:4px}
  table.prod td.pname,table.prod th.pname{text-align:left;white-space:normal;word-break:break-word;min-width:150px}
  table.prod tbody tr.off{opacity:.38}
  table.prod input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--net)}
  table.prod th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  table.prod th.sortable:hover{color:var(--net)}
  .sbar{display:inline-block;width:44px;height:6px;border-radius:3px;background:var(--grid);
    vertical-align:middle;margin-left:7px;position:relative;overflow:hidden}
  .sbar::after{content:"";position:absolute;left:0;top:0;height:100%;width:var(--w);background:var(--cost);border-radius:3px}
  table.prod thead th{position:sticky;top:0;z-index:1}
  /* 채널 비교 */
  .chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
  .chbox{border:1px solid var(--border);border-radius:12px;padding:13px 15px;background:var(--panel2)}
  .chbox .t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .chbox .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--muted)}
  .chbox .kv b{color:var(--text);font-variant-numeric:tabular-nums}
  .share{height:8px;border-radius:5px;background:var(--grid);overflow:hidden;display:flex;margin:10px 0 4px}
  .share i{display:block;height:100%}
  /* 월간보고 뷰 */
  .repbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;font-size:13px}
  .repbar select{font:inherit;padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
  .repbar .seg{padding:2px}
  .repbar .seg button{padding:6px 13px;font-size:12.5px}
  .repdoc{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
  .rep-t{font-weight:700;font-size:15px;margin-bottom:4px}
  .rep-blk{padding:16px 0;border-bottom:1px solid var(--border)}
  .rep-blk:last-child{border-bottom:none}
  .rep-h{font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .rep-h .sup{font-weight:500;color:var(--muted);font-size:12.5px}
  .rep-kv{font-size:13.5px;line-height:1.95}
  .rep-kv b{font-variant-numeric:tabular-nums}
  .rep-kv .k{color:var(--muted);display:inline-block;min-width:132px}
  .rep-sec{margin:14px 0 4px;font-weight:700;font-size:13.5px}
  .rep-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.7}
  .loading{padding:60px 0;text-align:center;color:var(--muted)}
  .spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--net);border-radius:50%;
    display:inline-block;animation:sp 1s linear infinite;vertical-align:middle;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="h1">쿠팡 광고 리포트</h1>
      <div class="sub" id="subtitle">구글 시트 · 로켓광고 / 윙광고 · 광고 데이터 기준</div>
    </div>
    <div class="toolbar">
      <div class="seg" id="chSeg"></div>
      <div class="seg" id="periodSeg">
        <button data-p="day">일별</button>
        <button data-p="week" class="on">주간</button>
        <button data-p="month">월별</button>
        <button data-p="report">월간보고</button>
      </div>
      <button class="primary" id="refreshBtn">↻ 새로고침</button>
    </div>
  </header>

  <div class="rangebar" id="rangeBar"></div>
  <div class="filterbar" id="filterBar"></div>

  <div id="content">
    <div class="loading"><span class="spin"></span>데이터를 불러오는 중…</div>
  </div>

  <div class="foot" id="footnote"></div>
</div>

<script>
/* ============================================================
   ⚙️  설정 — 시트 주소와 탭(gid)만 관리하시면 됩니다
   ============================================================ */
const PUB = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRG4AcZG3_C69j4VAcoZzhE0GOPDmihDHAATx16b7a00AaWUc-4MOQrAcFdu69FGSQ_Q7MnrbXdzOXU/pub?single=true&output=csv&gid=";

const CONFIG = {
  // 쿠팡 광고 채널. 탭을 추가하면 여기 한 줄만 넣으면 됩니다.
  CHANNELS: [
    { id:"rocket", name:"로켓광고", short:"로켓", csv: PUB+"73011125",  color:"var(--rocket)",
      alias:["로켓","로켓광고","로","rocket","로켓배송"] },
    { id:"wing",   name:"윙광고",   short:"윙",   csv: PUB+"684917070", color:"var(--wing)",
      alias:["윙","윙광고","wing","쿠팡윙"] },
  ],

  // '월간보고' 탭 — 어드민 확정 월별 집계 + '매마 매출'(자사 인식 매출).
  // 채널 블록이 가로로 나열되고, 각 행의 '판매 센터' 칸(로켓/윙)으로 채널을 구분합니다.
  MONTHLY_CSV: PUB+"267096483",

  // '매마 일별 매출액' 탭 — 자사 인식 매출의 일별 값(채널 블록 가로 배치: 채널·년/월/일·매출).
  // 이 탭이 있으면 어떤 기간을 골라도 매마 매출/광고비 비중이 계산됩니다.
  MAEMA_CSV: PUB+"688792421",

  // 전환 어트리뷰션 기본 기준 ("14" = 총 전환매출액(14일), "1" = 1일)
  ATTR_DEFAULT: "14",

  CHART_MAX: { day:30, week:12, month:12 },   // 추이 차트 표시 구간 수
  DETAIL_MAX:{ day:14, week:8,  month:12 },   // 상세 표 기본 표시 행 수
  DEFAULT_RANGE_DAYS: 30,                     // 최초 진입 시 기간 기본값 (최근 N일)

  // 브랜드 자동 인식 키워드 (광고집행 상품명 앞부분으로 판별)
  BRAND_KEYS: ["프로젝트슬립","평소생활","라포즈","라쏨"],

  // 상품 점검 리포트 기준값
  ALERT: {
    windowDays: 30,      // 비교 창 길이(최근 N일 vs 직전 N일)
    minCost: 30000,      // 이 금액 미만 소액 집행 상품은 제외(노이즈 컷)
    targetRoas: 200,     // 목표 ROAS(%) 미달 시 경고
    roasDropRatio: 0.5,  // 직전 대비 ROAS가 이 비율 미만이면 '급감'
    cpcRiseRatio: 1.5,   // 직전 대비 CPC가 이 배수 이상이면 '급등'
    ctrDropRatio: 0.6    // 직전 대비 CTR이 이 비율 이하면 '급락'
  }
};

/* ============================================================ */
const $ = s => document.querySelector(s);
const won = n => n==null ? "—" : "₩" + Math.round(n).toLocaleString("ko-KR");
const wonShort = n => {
  if(n==null) return "—";
  const a=Math.abs(n);
  if(a>=1e8) return (n/1e8).toFixed(1).replace(/\.0$/,"")+"억";
  if(a>=1e4) return Math.round(n/1e4).toLocaleString("ko-KR")+"만";
  return Math.round(n).toLocaleString("ko-KR");
};
const pct = (n,d=0) => n==null ? "—" : n.toFixed(d)+"%";
const cnt = n => n==null ? "—" : Math.round(n).toLocaleString("ko-KR");
const num = s => { const v=parseFloat(String(s??"").replace(/[,₩%\s"']/g,"")); return isNaN(v)?0:v; };
const pad = n => String(n).padStart(2,"0");
const escapeHtml = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- CSV 스트리밍 파서 (행 단위 콜백 — 대용량 시트 메모리 절약) ---- */
function parseCSVRows(t, onRow){
  let f="", row=[], q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"){ row.push(f); onRow(row); row=[]; f=""; }
    else if(c!=="\r") f+=c;
  }
  if(f.length||row.length){ row.push(f); onRow(row); }
}

/* ---- 쿠팡 광고 CSV → 행 레코드 배열 ----
   컬럼: 년/월/일, 자사 제품명, 캠페인명, 광고집행 상품명, 광고 노출 지면,
        노출수, 클릭수, 광고비, 총 주문수/판매수량/전환매출액 (1일·14일) */
function parseCoupang(text, chId){
  let ci=null;
  const out=[];
  const brandOf = (s)=>{
    s=String(s||"").trim();
    for(const b of CONFIG.BRAND_KEYS) if(s.indexOf(b)===0) return b;
    for(const b of CONFIG.BRAND_KEYS) if(s.indexOf(b)>=0) return b;
    const first=s.split(/[ ,]/)[0];
    return first || "기타";
  };
  parseCSVRows(text, r=>{
    if(!ci){
      // 헤더 행 탐색
      if(!(r.some(c=>c.indexOf("광고비")>=0) && r.some(c=>c.indexOf("노출수")>=0))) return;
      const hdr=r.map(c=>String(c).trim());
      const find=(...names)=>{
        for(const n of names){ const i=hdr.indexOf(n); if(i>=0) return i; }
        for(const n of names){ const i=hdr.findIndex(c=>c.indexOf(n)>=0); if(i>=0) return i; }
        return -1; };
      ci={ y:find("년"), m:find("월"), d:find("일"), date:find("날짜"),
           name:find("자사 제품명","자사제품명"),
           camp:find("캠페인명"), grp:find("광고그룹"),
           prod:find("광고집행 상품명"), area:find("광고 노출 지면"),
           imp:find("노출수","노출 수"), clk:find("클릭수","클릭 수"), cost:find("광고비"),
           ord1:find("총 주문수(1일)"),   ord14:find("총 주문수(14일)"),
           qty1:find("총 판매수량(1일)"), qty14:find("총 판매수량(14일)"),
           rev1:find("총 전환매출액(1일)"), rev14:find("총 전환매출액(14일)") };
      if(ci.cost<0 || ci.rev14<0 && ci.rev1<0) throw new Error("광고비/전환매출액 컬럼을 찾지 못했습니다.");
      return;
    }
    if(!r || r.length<=ci.cost) return;
    // 날짜
    let key=null;
    const y=parseInt(r[ci.y]), m=parseInt(r[ci.m]), d=parseInt(r[ci.d]);
    if(y&&m&&d) key=`${y}-${pad(m)}-${pad(d)}`;
    else if(ci.date>=0){
      const s=String(r[ci.date]).trim().replace(/[./]/g,"-");
      const mm=s.match(/^(\d{4})-?(\d{1,2})-?(\d{1,2})$/);
      if(mm) key=`${mm[1]}-${pad(+mm[2])}-${pad(+mm[3])}`;
    }
    if(!key) return;
    const imp=num(r[ci.imp]), clk=num(r[ci.clk]), cost=num(r[ci.cost]);
    const rev14=ci.rev14>=0?num(r[ci.rev14]):0, rev1=ci.rev1>=0?num(r[ci.rev1]):0;
    const ord14=ci.ord14>=0?num(r[ci.ord14]):0, ord1=ci.ord1>=0?num(r[ci.ord1]):0;
    const qty14=ci.qty14>=0?num(r[ci.qty14]):0, qty1=ci.qty1>=0?num(r[ci.qty1]):0;
    if(!imp && !clk && !cost && !rev14 && !rev1) return;   // 빈 행 스킵
    const prod = ci.prod>=0 ? String(r[ci.prod]||"") : "";
    let name = ci.name>=0 ? String(r[ci.name]||"").trim() : "";
    if(!name) name = prod ? prod.split(",")[0].trim() : "(미지정)";
    const area = ci.area>=0 ? (String(r[ci.area]||"").trim() || "미분류") : "미분류";
    out.push({ key, ch:chId, name, brand:brandOf(prod),
               camp: ci.camp>=0 ? (String(r[ci.camp]||"").trim()||"(없음)") : "(없음)",
               grp:  ci.grp>=0  ? (String(r[ci.grp]||"").trim()||"(없음)")  : "(없음)",
               area, imp, clk, cost, rev1, rev14, ord1, ord14, qty1, qty14 });
  });
  if(!ci) throw new Error("헤더 행(노출수·광고비)을 찾지 못했습니다.");
  return out;
}

/* ---- '월간보고' 탭 → 월×채널 어드민 확정치 + 매마 매출 ----
   구조: 한 행에 채널 블록이 가로로 나열(년/월, 판매 센터, 매마 매출, 어드민 …).
   '판매 센터' 칸(로켓/윙)으로 채널을 구분합니다. */
const numOrNull = s => { s=String(s??"").trim(); return s===""?null:num(s); };
// 시트의 채널 표기(로켓/윙 등) → 채널 id
function channelOf(s){
  s=String(s||"").trim().toLowerCase();
  if(!s) return null;
  const c=CONFIG.CHANNELS.find(x=>(x.alias||[]).some(a=>a.toLowerCase()===s)
    || x.name.toLowerCase()===s || (x.short||"").toLowerCase()===s);
  return c?c.id:null;
}

/* ---- '매마 일별 매출액' 탭 → 일별 자사 인식 매출 ----
   구조: 채널 블록이 가로로 나열 (채널, 년/월/일, 매출). 값이 빈 날은 0으로 취급. */
let MAEMA=null;   // {byKey:{"YYYY-MM-DD|ch":금액}, byMonth:{"YYYY-MM|ch":금액}, min, max, n}
function parseMaemaDaily(text){
  const rows=[]; parseCSVRows(text, r=>rows.push(r.slice()));
  const h=rows.findIndex(r=>r.some(c=>String(c).trim()==="채널"));
  if(h<0) return {byKey:{},byMonth:{},n:0};
  const hdr=rows[h].map(c=>String(c).trim());
  const starts=[]; hdr.forEach((c,i)=>{ if(c==="채널") starts.push(i); });
  const blocks=starts.map(s=>{
    const end = starts.find(x=>x>s) ?? hdr.length;
    const col=(...names)=>{
      for(const n of names){ for(let j=s;j<end;j++) if(hdr[j]===n) return j; }
      for(const n of names){ for(let j=s;j<end;j++) if(hdr[j].indexOf(n)>=0) return j; }
      return -1; };
    return { ch:s, date:col("년/월/일","날짜","일자"), amt:col("매출","금액","매마") };
  });
  const byKey={}, byMonth={}; let min=null,max=null,n=0;
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    for(const b of blocks){
      const cid=channelOf(r[b.ch]); if(!cid) continue;
      const ds=String(r[b.date]||"").trim().replace(/[./]/g,"-");
      const m=ds.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(!m) continue;
      const v=b.amt>=0?numOrNull(r[b.amt]):null;
      if(v==null) continue;                       // 빈 칸은 스킵(0원 입력과 구분 없음 — 합산엔 영향 없음)
      const key=`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
      byKey[`${key}|${cid}`]=(byKey[`${key}|${cid}`]||0)+v;
      const ym=key.slice(0,7);
      byMonth[`${ym}|${cid}`]=(byMonth[`${ym}|${cid}`]||0)+v;
      if(!min||key<min) min=key;
      if(!max||key>max) max=key;
      n++;
    }
  }
  return {byKey, byMonth, min, max, n};
}
const hasMaema = () => !!(MAEMA && MAEMA.n>0);
/* 매마 매출이 '마감된' 달인가 — 판단 기준은 '매마 일별 매출액' 탭 하나로 통일.
   로켓 매입은 발주일에만 금액이 찍혀 빈 날이 많으므로(빈칸 = 0원, 미입력이 아님)
   일별 탭의 마지막 날짜로 판단할 수 없습니다. 그래서
     ① 그 달에 일별 매마 값이 1건 이상 있고
     ② 그 달이 이미 지난 달(달의 마지막 날이 오늘/최신 데이터일 이전)
   두 조건을 만족하면 마감으로 봅니다. */
function nextYm(ym){ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m,1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function maemaMonthClosed(ym, chSel){
  if(!hasMaema()) return false;
  const ids=(chSel||STATE.ch)==="all" ? CONFIG.CHANNELS.map(c=>c.id) : [chSel||STATE.ch];
  if(!ids.some(id=>MAEMA.byMonth[`${ym}|${id}`]!=null)) return false;   // ① 값 없음
  const b=monthBounds(ym);
  const nowKey = todayKey();
  const ref = (DATA_MAX && DATA_MAX>nowKey) ? DATA_MAX : nowKey;
  return b.last < ref;                                                  // ② 이미 지난 달
}
/* [from,to] 구간의 매마 매출을 광고비와 비교해도 되는가.
   ① 입력이 구간 끝까지 진행됐으면(to <= 마지막 입력일) 진행 중인 달이라도 유효, 또는
   ② 구간이 걸치는 모든 달이 마감된 경우. */
function maemaCovers(from,to){
  if(!hasMaema()) return false;
  if(to<=MAEMA.max) return true;                       // ① 입력이 구간 끝까지 진행됨
  let ym=from.slice(0,7); const last=to.slice(0,7);
  let guard=0;
  while(ym<=last && guard++<600){ if(!maemaMonthClosed(ym)) return false; ym=nextYm(ym); }
  return true;
}
// 기간 키의 실제 날짜 범위
function periodSpan(key, mode){
  if(mode==="month") { const b=monthBounds(key); return {from:b.first, to:b.last}; }
  if(mode==="day")   return {from:key, to:key};
  return {from:key, to:dateShift(key,6)};        // 주간: 시작일 ~ +6일
}
// 기간(포함)·채널 기준 매마 매출 합계
function maemaSum(s, e, chSel){
  if(!hasMaema()) return null;
  const ids = (chSel||STATE.ch)==="all" ? CONFIG.CHANNELS.map(c=>c.id) : [chSel||STATE.ch];
  let sum=0, any=false;
  for(const k of Object.keys(MAEMA.byKey)){
    const i=k.indexOf("|"); const d=k.slice(0,i), c=k.slice(i+1);
    if(!ids.includes(c)) continue;
    if(s && d<s) continue;
    if(e && d>e) continue;
    sum+=MAEMA.byKey[k]; any=true;
  }
  return any?sum:null;
}
let MONTHLY=null;
function parseMonthly(text){
  const rows=[]; parseCSVRows(text, r=>rows.push(r.slice()));
  const h=rows.findIndex(r=>r.some(c=>String(c).trim()==="년/월"));
  if(h<0) return {byKey:{},months:[]};
  const hdr=rows[h].map(c=>String(c).trim());
  const starts=[]; hdr.forEach((c,i)=>{ if(c==="년/월") starts.push(i); });
  const blocks=starts.map(s=>{
    const end = starts.find(x=>x>s) ?? hdr.length;
    const col=(...names)=>{
      for(const n of names){ for(let j=s;j<end;j++) if(hdr[j]===n) return j; }
      for(const n of names){ for(let j=s;j<end;j++) if(hdr[j].indexOf(n)>=0) return j; }
      return -1; };
    return { ym:s,
      ch:col("판매 센터","판매센터","채널"),
      maema:col("매마 매출","매마매출","매마"),
      rev:col("어드민 광고 전환 매출","광고 전환 매출","전환 매출"),
      cost:col("어드민 집행 광고비","집행 광고비","광고비"),
      imp:col("노출수","노출 수"), clk:col("클릭수","클릭 수"),
      qty:col("판매수","판매 수"), ord:col("주문수","주문 수"),
      memo:col("메모","비고") };
  });
  const chOf=channelOf;
  const byKey={}, months=new Set();
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    for(const b of blocks){
      const m=String(r[b.ym]||"").trim().match(/^(\d{4})[-.\/]?(\d{1,2})$/);
      if(!m) continue;
      const cid = b.ch>=0 ? chOf(r[b.ch]) : null;
      if(!cid) continue;                       // 채널 칸이 빈 행(미래 월)은 스킵
      const ym=`${m[1]}-${pad(+m[2])}`;
      const maema=b.maema>=0?numOrNull(r[b.maema]):null;
      const rev=b.rev>=0?numOrNull(r[b.rev]):null;
      const cost=b.cost>=0?numOrNull(r[b.cost]):null;
      if(maema==null && rev==null && cost==null) continue;   // 아직 안 채워진 행
      byKey[`${ym}|${cid}`]={ ym, ch:cid, maema, rev, cost,
        imp:(b.imp>=0?numOrNull(r[b.imp]):null),
        clk:(b.clk>=0?numOrNull(r[b.clk]):null),
        qty:(b.qty>=0?numOrNull(r[b.qty]):null),
        ord:(b.ord>=0?numOrNull(r[b.ord]):null),
        memo:b.memo>=0?String(r[b.memo]||"").trim():"" };
      months.add(ym);
    }
  }
  return { byKey, months:[...months].sort() };
}
function confirmedMonth(ch, ym){ return MONTHLY ? (MONTHLY.byKey[`${ym}|${ch}`]||null) : null; }

/* ---- 월 확정치 보정 계수 ----
   일별 탭은 매일 받아쓰기 때문에 14일 전환 추적이 반영되지 않은 경우가 많습니다.
   '월간보고' 탭의 어드민 확정치를 정답으로 보고, 월×채널별로
   (확정치 ÷ 일별합) 비율을 각 일별 행에 곱해 총합이 확정치와 일치하게 맞춥니다.
   비율만 곱하므로 일자별·상품별·캠페인별 구성비는 그대로 유지됩니다. */
let FACTOR_INFO=[];      // 화면 안내용 요약
function buildFactors(){
  FACTOR_INFO=[];
  for(const c of CONFIG.CHANNELS) for(const r of (RAW[c.id]||[])) r.f=null;
  if(!MONTHLY || !MONTHLY.months.length) return;
  // 1) 일별 원본의 월×채널 합계
  const base={};
  for(const c of CONFIG.CHANNELS) for(const r of (RAW[c.id]||[])){
    const k=r.key.slice(0,7)+"|"+c.id;
    let b=base[k];
    if(!b) b=base[k]={cost:0,imp:0,clk:0,rev14:0,rev1:0,ord14:0,ord1:0,qty14:0,qty1:0};
    b.cost+=r.cost; b.imp+=r.imp; b.clk+=r.clk;
    b.rev14+=r.rev14; b.rev1+=r.rev1; b.ord14+=r.ord14; b.ord1+=r.ord1; b.qty14+=r.qty14; b.qty1+=r.qty1;
  }
  // 2) 계수 산출
  const F={};
  for(const k of Object.keys(MONTHLY.byKey)){
    const cf=MONTHLY.byKey[k], b=base[k];
    if(!b) continue;
    const f=(numv,den)=> (numv!=null && den>0) ? numv/den : 1;
    F[k]={ cost:f(cf.cost,b.cost), imp:f(cf.imp,b.imp), clk:f(cf.clk,b.clk),
           rev14:f(cf.rev,b.rev14), ord14:f(cf.ord,b.ord14), qty14:f(cf.qty,b.qty14) };
    const [ym,ch]=k.split("|");
    FACTOR_INFO.push({ ym, ch, cost:F[k].cost, rev:F[k].rev14, ord:F[k].ord14,
                       rawRev:b.rev14, cfRev:cf.rev, rawCost:b.cost, cfCost:cf.cost });
  }
  FACTOR_INFO.sort((a,b)=> a.ym<b.ym?1:a.ym>b.ym?-1:0);
  // 3) 각 행에 계수 붙이기 (렌더마다 다시 찾지 않도록)
  for(const c of CONFIG.CHANNELS) for(const r of (RAW[c.id]||[])){
    r.f = F[r.key.slice(0,7)+"|"+c.id] || null;
  }
}
// 보정이 실제로 적용되는 상태인가 (1일 기준일 때 전환 지표는 보정하지 않음)
const correcting = () => STATE.correct && MONTHLY && MONTHLY.months.length>0;
// 여러 채널 합계(현재 채널 선택 기준). 하나라도 없으면 null.
function confirmedFor(ym, chSel){
  if(!MONTHLY) return null;
  const ids = chSel==="all" ? CONFIG.CHANNELS.map(c=>c.id) : [chSel];
  const parts = ids.map(id=>confirmedMonth(id,ym));
  if(parts.some(p=>!p)) return null;
  const add=(k)=>{ let s=null; for(const p of parts){ if(p[k]!=null) s=(s||0)+p[k]; } return s; };
  return { ym, ch:chSel, maema:add("maema"), rev:add("rev"), cost:add("cost"),
           imp:add("imp"), clk:add("clk"), qty:add("qty"), ord:add("ord") };
}
// 해당 월(YYYY-MM)이 선택 기간에 통째로 포함되는가 (부분 달엔 월 확정치를 쓰면 안 됨)
function rangeCoversMonth(ym){
  const b=monthBounds(ym);
  return (!STATE.startDate||STATE.startDate<=b.first) && (!STATE.endDate||STATE.endDate>=b.last);
}
// 확정치를 써도 되는 조건: 브랜드·캠페인 필터가 없어야 함(확정치는 채널 단위 값)
function canUseConfirmed(){ return STATE.camp==="all"; }

/* ============================================================
   상태
   ============================================================ */
const RAW = {};                 // {rocket:[rec], wing:[rec]}
let DATA_MIN=null, DATA_MAX=null;
let STATE = {
  ch:"all", brand:"all", camp:"all", attr:CONFIG.ATTR_DEFAULT, correct:true,
  mode:"week", startDate:null, endDate:null, rangeInit:false, rangeNote:"",
  loadedAt:null, detailAll:false, breakdown:"camp",
  prodSort:"cost", prodDir:-1, prodSel:null, prodOnlySel:false, prodSearch:"", prodTrendMetric:"rev",
  alertBasis:"range"
};
const ATTRIB = () => STATE.attr==="14" ? 14 : 1;
const chName = id => (CONFIG.CHANNELS.find(c=>c.id===id)||{}).name || id;
const chColor= id => (CONFIG.CHANNELS.find(c=>c.id===id)||{}).color || "var(--net)";

/* ---- 날짜 유틸 ---- */
function dateShift(key,days){ const d=new Date(key+"T00:00:00"); d.setDate(d.getDate()+days);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function weekStart(d){ const t=new Date(d); const wd=(t.getDay()+6)%7; t.setDate(t.getDate()-wd); t.setHours(0,0,0,0); return t; }
function rangeActive(){ return !!(STATE.startDate||STATE.endDate); }
function applyDefaultRange(){
  if(STATE.rangeInit || !DATA_MAX) return;
  let st=dateShift(DATA_MAX,-(CONFIG.DEFAULT_RANGE_DAYS-1)); if(st<DATA_MIN) st=DATA_MIN;
  STATE.startDate=st; STATE.endDate=DATA_MAX; STATE.rangeInit=true;
}

/* ---- 행 필터 ---- */
function filterRows(o){
  o=o||{};
  const ch    = o.ch!==undefined ? o.ch : STATE.ch;
  const brand = o.brand!==undefined ? o.brand : STATE.brand;
  const camp  = o.camp!==undefined ? o.camp : STATE.camp;
  const s     = o.s!==undefined ? o.s : STATE.startDate;
  const e     = o.e!==undefined ? o.e : STATE.endDate;
  const out=[];
  for(const c of CONFIG.CHANNELS){
    if(ch!=="all" && ch!==c.id) continue;
    const arr=RAW[c.id]; if(!arr) continue;
    for(let i=0;i<arr.length;i++){
      const r=arr[i];
      if(s && r.key<s) continue;
      if(e && r.key>e) continue;
      if(brand!=="all" && r.brand!==brand) continue;
      if(camp!=="all" && r.camp!==camp) continue;
      out.push(r);
    }
  }
  return out;
}

/* ---- 집계 ---- */
function blank(extra){ return Object.assign({cost:0,rev:0,ord:0,qty:0,imp:0,clk:0}, extra||{}); }
function addRow(t,r,a14){
  const f = (STATE.correct && r.f) ? r.f : null;
  if(!f){
    t.cost+=r.cost; t.imp+=r.imp; t.clk+=r.clk;
    t.rev += a14?r.rev14:r.rev1;
    t.ord += a14?r.ord14:r.ord1;
    t.qty += a14?r.qty14:r.qty1;
    return;
  }
  // 월 확정치 보정 적용 (1일 기준 전환 지표는 확정치와 성격이 달라 보정하지 않음)
  t.cost+=r.cost*f.cost; t.imp+=r.imp*f.imp; t.clk+=r.clk*f.clk;
  t.rev += a14 ? r.rev14*f.rev14 : r.rev1;
  t.ord += a14 ? r.ord14*f.ord14 : r.ord1;
  t.qty += a14 ? r.qty14*f.qty14 : r.qty1;
}
function derive(t){
  t.roas = t.cost>0 ? t.rev/t.cost*100 : null;   // ROAS = 광고전환매출 ÷ 광고비
  t.ctr  = t.imp>0  ? t.clk/t.imp*100 : null;    // 클릭률
  t.cpc  = t.clk>0  ? t.cost/t.clk : null;       // 클릭당 광고비
  t.cvr  = t.clk>0  ? t.ord/t.clk*100 : null;    // 전환율 = 주문수 ÷ 클릭수
  t.cpa  = t.ord>0  ? t.cost/t.ord : null;       // 전환당 광고비
  t.aov  = t.ord>0  ? t.rev/t.ord : null;        // 객단가
  return t;
}
function total(rows){ const a14=STATE.attr==="14"; const t=blank(); for(const r of rows) addRow(t,r,a14); return derive(t); }
function groupSum(rows, keyFn, extraFn){
  const a14=STATE.attr==="14", m=new Map();
  for(const r of rows){
    const k=keyFn(r); if(k==null) continue;
    let g=m.get(k);
    if(!g){ g=blank({key:k}); if(extraFn) extraFn(g,r); m.set(k,g); }
    addRow(g,r,a14);
    if(STATE.correct && r.f) g.corr=true;      // 월 확정치 보정이 반영된 그룹
    if(!g.lastKey || r.key>g.lastKey) g.lastKey=r.key;
    if(!g.firstKey|| r.key<g.firstKey) g.firstKey=r.key;
  }
  return [...m.values()].map(derive);
}
function periodOf(dk, mode){
  const d=new Date(dk+"T00:00:00");
  if(mode==="month") return {k:`${d.getFullYear()}-${pad(d.getMonth()+1)}`, lab:`${d.getFullYear()}년 ${d.getMonth()+1}월`};
  if(mode==="day")   return {k:dk, lab:`${pad(d.getMonth()+1)}/${pad(d.getDate())}(${"일월화수목금토"[d.getDay()]})`};
  const ws=weekStart(d), we=new Date(ws); we.setDate(we.getDate()+6);
  return {k:`${ws.getFullYear()}-${pad(ws.getMonth()+1)}-${pad(ws.getDate())}`,
          lab:`${pad(ws.getMonth()+1)}/${pad(ws.getDate())}~${pad(we.getMonth()+1)}/${pad(we.getDate())}`};
}
function groupPeriod(rows, mode){
  const arr=groupSum(rows, r=>periodOf(r.key,mode).k, (g,r)=>{ g.label=periodOf(r.key,mode).lab; });
  arr.sort((a,b)=> a.key<b.key?-1:1);
  return arr;
}

/* ============================================================
   차트 (SVG 자체 구현 — 외부 라이브러리 없음)
   ============================================================ */
function niceTop(max){ if(max<=0)return 1; const p=Math.pow(10,Math.floor(Math.log10(max))); const f=max/p;
  const s=f<=1?1:f<=1.5?1.5:f<=2?2:f<=3?3:f<=5?5:f<=7?7:10; return s*p; }
const valLabel=(v,unit)=> unit==="%" ? Math.round(v)+"%" : wonShort(v);

function barChart(el, labels, series, o){
  o=o||{}; const fmt=o.fmt||wonShort, unit=o.unit||"", values=o.values!==false;
  if(!el) return;
  if(!labels.length){ el.innerHTML='<div class="muted" style="padding:30px 0;text-align:center">표시할 데이터가 없습니다</div>'; return; }
  const W=Math.max(labels.length*Math.max(46, series.length*22+26)+70, 320), H=248;
  const P={t:22,r:12,b:46,l:56};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  let max=0; series.forEach(s=>s.values.forEach(v=>{ if(v!=null&&v>max)max=v; }));
  const top=niceTop(max), ticks=4;
  const x=i=> P.l + i*(iw/labels.length);
  const bw=iw/labels.length, gap=6, groupW=bw-gap*2, each=groupW/series.length;
  const labFont = each>=20?8 : each>=13?7 : 0;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMinYMin meet" role="img">`;
  for(let t=0;t<=ticks;t++){
    const val=top*t/ticks, yy=P.t+ih-(val/top)*ih;
    svg+=`<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="var(--grid)"/>`;
    svg+=`<text x="${P.l-8}" y="${yy+3.5}" font-size="10" text-anchor="end">${fmt(val)}</text>`;
  }
  labels.forEach((lab,i)=>{
    series.forEach((s,si)=>{
      const v=s.values[i]; if(v==null) return;
      const bh=(v/top)*ih, bx=x(i)+gap+si*each, by=P.t+ih-bh;
      const cx=bx+Math.max(each-2,1)/2;
      svg+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${Math.max(each-2,1).toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" rx="2" fill="${s.color}">`
         +`<title>${lab} · ${s.name}: ${unit==="%"?(v.toFixed(0)+"%"):won(v)}</title></rect>`;
      if(values && labFont && v>0)
        svg+=`<text x="${cx.toFixed(1)}" y="${(by-3).toFixed(1)}" font-size="${labFont}" fill="${s.color}" text-anchor="start" transform="rotate(-55 ${cx.toFixed(1)} ${(by-3).toFixed(1)})">${valLabel(v,unit)}</text>`;
    });
    const cx=x(i)+bw/2;
    svg+=`<text x="${cx}" y="${H-P.b+16}" font-size="10" text-anchor="middle" transform="rotate(18 ${cx} ${H-P.b+16})">${lab}</text>`;
  });
  el.innerHTML=svg+`</svg>`;
}

const LINE_COLORS=["#2563eb","#ef4444","#10b981","#f59e0b","#8b5cf6","#ec4899","#14b8a6","#f97316","#64748b","#0ea5e9"];
function lineChart(el, labels, series, o){
  o=o||{}; const fmt=o.fmt||wonShort, unit=o.unit||"", values=o.values!==false,
            labelMax=o.labelMax||3, labelAll=!!o.labelAll;
  // 점 위 라벨·툴팁 표기 (CTR처럼 소수 % 는 반올림하면 0%가 되므로 따로 지정)
  const lf = o.labelFmt || (v=>valLabel(v,unit));
  if(!el) return;
  if(!labels.length || !series.length){ el.innerHTML='<div class="muted" style="padding:30px 0;text-align:center">표시할 데이터가 없습니다</div>'; return; }
  const n=labels.length;
  const perPt = n>36?20 : n>18?32 : n>10?48 : 60;
  const W=Math.max(n*perPt+80, 340), H=248;
  const P={t:22,r:14,b:46,l:56};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  let max=0; series.forEach(s=>s.values.forEach(v=>{ if(v!=null&&v>max)max=v; }));
  const top=niceTop(max), ticks=4;
  const x=i=> P.l + (n===1? iw/2 : i*(iw/(n-1)));
  const y=v=> P.t+ih-(v/top)*ih;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMinYMin meet" role="img">`;
  for(let t=0;t<=ticks;t++){
    const val=top*t/ticks, yy=P.t+ih-(val/top)*ih;
    svg+=`<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="var(--grid)"/>`;
    svg+=`<text x="${P.l-8}" y="${yy+3.5}" font-size="10" text-anchor="end">${fmt(val)}</text>`;
  }
  const step=Math.ceil(n/12);
  labels.forEach((lab,i)=>{
    if(step>1 && i%step!==0 && i!==n-1) return;
    const cx=x(i);
    svg+=`<text x="${cx}" y="${H-P.b+16}" font-size="10" text-anchor="middle" transform="rotate(18 ${cx} ${H-P.b+16})">${lab}</text>`;
  });
  const dyOf=si=> si%2===0 ? -7 : 15;
  series.forEach((s,si)=>{
    let dpath="", started=false;
    s.values.forEach((v,i)=>{
      if(v==null){ started=false; return; }
      dpath += (started?" L":" M")+x(i).toFixed(1)+" "+y(v).toFixed(1); started=true;
    });
    if(dpath) svg+=`<path d="${dpath}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{
      if(v==null) return; const px=x(i), py=y(v);
      svg+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.6" fill="${s.color}"><title>${escapeHtml(labels[i])} · ${escapeHtml(s.name)}: ${lf(v)}</title></circle>`;
      if(values && series.length<=labelMax && v>0 && (labelAll || step<=1 || i%step===0 || i===n-1))
        svg+=`<text x="${px.toFixed(1)}" y="${(py+dyOf(si)).toFixed(1)}" font-size="8.5" fill="${s.color}" text-anchor="middle" paint-order="stroke" stroke="var(--panel)" stroke-width="2.6">${lf(v)}</text>`;
    });
  });
  el.innerHTML=svg+`</svg>`;
}

/* ---- 선택 기간의 매마 매출 ----
   '매마 일별 매출액' 탭이 있으면 일별로 정확히 합산(기간 제약 없음).
   없으면 '월간보고' 탭의 월 값으로 대체(기간에 온전히 포함된 달만). */
function maemaForRange(){
  const s=STATE.startDate||DATA_MIN, e=STATE.endDate||DATA_MAX;
  // 비율의 분모·분자를 같은 범위로 맞추기 위해 광고비·전환매출은 항상 '채널 전체'(브랜드·캠페인 필터 제외) 기준
  const chLevel = total(filterRows({brand:"all", camp:"all"}));
  if(hasMaema()){
    const maema=maemaSum(s,e,STATE.ch);
    if(maema==null) return {daily:true, maema:null, adShare:null, adDep:null, s, e, noData:true};
    // 매마 탭에 값이 들어있는 실제 구간(기간이 그보다 넓으면 안내)
    // 기간 안에서 매마가 아직 마감되지 않은 달 목록
    const open=[]; let ym=s.slice(0,7); const last=e.slice(0,7); let guard=0;
    while(ym<=last && guard++<600){ if(!maemaMonthClosed(ym)) open.push(ym); ym=nextYm(ym); }
    // 입력이 구간을 못 덮으면 비율을 내지 않습니다
    // (예: 광고비는 30일치인데 매마는 1일치 → 4700% 같은 무의미한 값이 나옴)
    const ok = maemaCovers(s,e) && maema>0;
    return { daily:true, maema, cost:chLevel.cost, rev:chLevel.rev,
             adShare: ok ? chLevel.cost/maema*100 : null,
             adDep:   ok ? chLevel.rev/maema*100  : null,
             s, e, open, mismatch:!ok && maema>0 };
  }
  if(!MONTHLY || !MONTHLY.months.length) return null;
  let maema=0, cost=0, rev=0;
  const used=[], noInput=[], partial=[];
  for(const ym of MONTHLY.months){
    const b=monthBounds(ym);
    if(e<b.first || s>b.last) continue;
    if(!(s<=b.first && e>=b.last)){ partial.push(ym); continue; }
    const cf=confirmedFor(ym, STATE.ch);
    if(!cf || cf.maema==null){ noInput.push(ym); continue; }
    maema+=cf.maema; cost+=cf.cost||0; rev+=cf.rev||0; used.push(ym);
  }
  return {daily:false, maema, cost, rev,
          adShare: maema>0 ? cost/maema*100 : null,
          adDep:   maema>0 ? rev/maema*100 : null, used, noInput, partial};
}
function maemaBasisNote(m){
  if(!m) return "";
  if(m.daily){
    if(m.noData) return `<span class="muted" style="font-size:11px">(미입력)</span>`
      + ` <span class="bdg hi" title="'매마 일별 매출액' 탭에서 ${m.s} ~ ${m.e} 구간이 모두 비어 있습니다. 최종 입력일은 ${MAEMA.max} 입니다.">시트 미입력 · 최종 ${MAEMA.max}</span>`;
    return `<span class="muted" style="font-size:11px">(일별 · ${m.s} ~ ${m.e})</span>`
      + (m.mismatch
         ? ` <span class="bdg lo" title="'매마 일별 매출액' 탭 최종 입력일이 ${MAEMA.max} 라서 선택 기간(~${m.e})을 다 덮지 못합니다${m.open&&m.open.length?` · 미마감: ${m.open.join(", ")}`:""}">일부만 입력 · 최종 ${MAEMA.max}</span>` : "");
  }
  if(m.used.length){
    const span = m.used.length===1 ? m.used[0] : `${m.used[0]}~${m.used[m.used.length-1]} ${m.used.length}개월`;
    const extra = (m.partial.length||m.noInput.length)
      ? ` <span class="bdg lo" title="${[m.partial.length?`${m.partial.join(", ")}: 기간에 일부만 포함돼 제외`:"",
          m.noInput.length?`${m.noInput.join(", ")}: 매마 매출 미입력`:""].filter(Boolean).join(" / ")}">일부 제외</span>` : "";
    return `<span class="muted" style="font-size:11px">(월 단위 · ${span})</span>${extra}`;
  }
  if(m.partial.length) return `<span class="muted" style="font-size:11px">(월 단위 값 — 기간에 온전히 포함된 달 없음)</span>`;
  if(m.noInput.length) return `<span class="muted" style="font-size:11px">(${m.noInput.join(", ")} 미입력)</span>`;
  return `<span class="muted" style="font-size:11px">(해당 기간 데이터 없음)</span>`;
}
/* 기간별(일/주/월) 매마 매출 — 상세 표·차트용 */
function maemaByPeriod(mode){
  const out={};
  if(!hasMaema()) return out;
  const s=STATE.startDate, e=STATE.endDate;
  const ids = STATE.ch==="all" ? CONFIG.CHANNELS.map(c=>c.id) : [STATE.ch];
  for(const k of Object.keys(MAEMA.byKey)){
    const i=k.indexOf("|"); const d=k.slice(0,i), c=k.slice(i+1);
    if(!ids.includes(c)) continue;
    if(s && d<s) continue;
    if(e && d>e) continue;
    const pk=periodOf(d,mode).k;
    out[pk]=(out[pk]||0)+MAEMA.byKey[k];
  }
  return out;
}

/* ============================================================
   메인 렌더
   ============================================================ */
function render(){
  const c=$("#content");
  const rows=filterRows();
  const groups=groupPeriod(rows, STATE.mode);
  const t=total(rows);

  // 전환 추적(잠정) 구간
  const provStart = DATA_MAX ? dateShift(DATA_MAX, -(ATTRIB()-1)) : null;

  // 월별 뷰: '월간보고' 탭의 어드민 확정치로 교체 + 매마 매출 붙이기
  //  (온전한 달 + 브랜드·캠페인 필터 없음 일 때만 — 확정치는 채널 단위 값이라서)
  const useConfirmed = (STATE.mode==="month" && MONTHLY && canUseConfirmed());
  if(useConfirmed){
    for(const g of groups){
      if(!rangeCoversMonth(g.key)) continue;
      const cf=confirmedFor(g.key, STATE.ch); if(!cf) continue;
      if(cf.cost!=null) g.cost=cf.cost;
      if(cf.rev!=null)  g.rev=cf.rev;
      if(cf.imp!=null)  g.imp=cf.imp;
      if(cf.clk!=null)  g.clk=cf.clk;
      if(cf.ord!=null)  g.ord=cf.ord;
      if(cf.qty!=null)  g.qty=cf.qty;
      g.maema=cf.maema;
      g.confirmed=true;
      derive(g);
    }
  }
  // 매마 매출(일별 탭)을 기간별로 붙임 — 일별/주간/월별 모두 적용
  const mByP=maemaByPeriod(STATE.mode);
  if(hasMaema()) for(const g of groups){
    const sp=periodSpan(g.key, STATE.mode);
    g.maemaFull = maemaCovers(sp.from, sp.to);   // 이 기간의 달이 모두 마감됐는가
    if(mByP[g.key]!=null) g.maema=mByP[g.key];
    else if(g.maemaFull) g.maema=0;              // 마감된 기간인데 발주 없음 = 0원
  }

  for(const g of groups){
    // 보정된 구간은 확정치에 맞춰졌으므로 '잠정' 경고를 띄우지 않습니다
    g.provisional = !g.confirmed && !g.corr && provStart && g.lastKey && g.lastKey>=provStart;
    g.partialMonth = (STATE.mode==="month" && !g.confirmed && !rangeCoversMonth(g.key));
    // 광고비 비중 = 광고비 ÷ 매마 매출 (매마가 온전히 입력된 기간에서만)
    g.adShare = (g.maema && g.maemaFull!==false && g.cost!=null) ? g.cost/g.maema*100 : null;
  }

  const chartMax=CONFIG.CHART_MAX[STATE.mode]||8;
  const recent=groups.slice(-chartMax);
  const view=[...groups].reverse();

  let html="";

  /* --- 전환 추적 안내 --- */
  if(provStart){
    html+=`<div class="banner">
      ⚠️ <b>최근 ${ATTRIB()}일(${provStart} ~ ${DATA_MAX})은 전환 추적 중(잠정)입니다.</b>
      쿠팡 광고는 클릭 후 <b>${ATTRIB()}일</b>까지 발생한 전환을 그 클릭 날짜에 소급 반영합니다.
      광고비·노출수·클릭수·CPC는 집행 즉시 확정되지만,
      <b>전환매출·ROAS·주문수·판매수는 이후 최대 ${ATTRIB()}일간 계속 올라갑니다.</b>
      표에서 <span class="bdg prov">⚠ 잠정</span> 표시된 기간은 실제보다 낮게 보이니 성과 하락으로 해석하지 마세요.
      ${correcting()
        ? `<br>· <b>${MONTHLY.months.join(", ")}</b> 은 <span class="bdg conf">보정</span> — '월간보고' 탭의 어드민 확정치에 맞춰 집계하므로 추적 누락이 보정된 값입니다.
           그 외 기간은 일별 데이터 그대로입니다.`
        : `<br>· '월간보고' 탭 확정치 보정이 <b>꺼져 있습니다</b>(원본 보기). 상단 필터바에서 <b>월 확정치 보정 → 적용</b>으로 켤 수 있습니다.`}
    </div>`;
  }

  /* --- KPI --- */
  const periodLbl = rangeActive()?"선택 기간":"전체 기간";
  const chLbl = STATE.ch==="all" ? "로켓+윙" : chName(STATE.ch);
  const mm=maemaForRange();

  /* --- 매마 매출 미입력 안내 --- */
  if(mm && mm.daily && (mm.noData || mm.mismatch)){
    html+=`<div class="banner">
      📥 <b>선택 기간의 매마 매출이 시트에 ${mm.noData?"입력되지 않았습니다":"일부만 입력돼 있습니다"}.</b>
      ('매마 일별 매출액' 탭 최종 입력일 <b>${MAEMA.max}</b> · 선택 기간 ${mm.s} ~ ${mm.e})
      <br>· 매마 매출 ${mm.noData?"금액과 ":""}<b>광고비 비중·광고 의존도</b>는 표시되지 않습니다.
      광고비는 전 기간인데 매마는 일부만 잡혀 비율이 왜곡되기 때문입니다.
      <br>· 시트에 해당 기간 매마 매출을 입력하고 <b>↻ 새로고침</b> 하면 자동으로 반영됩니다.
      ${MAEMA.max?`(입력된 구간을 보려면 기간을 <b>${MAEMA.max}</b> 이전으로 맞추거나 <b>지난 달</b> 프리셋을 눌러보세요.)`:""}
    </div>`;
  }
  const cards=[];
  if(mm){
    cards.push({lab:`<span class="dot" style="background:var(--good)"></span>매마 매출 <span class="muted" style="font-size:11px">(자사 인식)</span> ${maemaBasisNote(mm)}`,
                val: mm.maema!=null?won(mm.maema):"—"});
    cards.push({lab:`광고비 비중 <span class="muted" style="font-size:11px">(광고비/매마 매출)</span>${
                  canUseConfirmed()?"":` <span class="bdg lo" title="매마 매출·광고비 모두 채널 전체 값입니다(브랜드·캠페인 필터 미적용)">채널 전체</span>`}${
                  (mm.mismatch||mm.noData)?` <span class="bdg hi" title="'매마 일별 매출액' 탭의 입력이 선택 기간(${mm.s} ~ ${mm.e})을 덮지 못합니다(최종 입력 ${hasMaema()?MAEMA.max:"-"}). 광고비는 전 기간, 매마는 일부만 잡혀 비율이 왜곡되므로 표시하지 않습니다. 해당 기간 매마 매출을 시트에 입력하면 자동으로 계산됩니다.">기간 불일치</span>`:""}`,
                val: mm.adShare==null?"—":pct(mm.adShare,1)});
  }
  cards.push(...[
    {lab:`<span class="dot" style="background:var(--cost)"></span>총 광고비 <span class="muted" style="font-size:11px">(${periodLbl}·${chLbl})</span>`, val:won(t.cost)},
    {lab:`<span class="dot" style="background:var(--rev)"></span>광고전환매출 <span class="muted" style="font-size:11px">(${ATTRIB()}일)</span>`, val:won(t.rev)},
    {lab:`<span class="dot" style="background:var(--roas)"></span>ROAS <span class="muted" style="font-size:11px">(전환매출/광고비)</span>`, val:t.roas==null?"—":pct(t.roas)},
    {lab:`노출수`, val:cnt(t.imp)},
    {lab:`클릭수`, val:cnt(t.clk)},
    {lab:`CTR <span class="muted" style="font-size:11px">(클릭/노출)</span>`, val:t.ctr==null?"—":pct(t.ctr,2)},
    {lab:`CPC <span class="muted" style="font-size:11px">(광고비/클릭)</span>`, val:t.cpc==null?"—":won(t.cpc)},
    {lab:`주문수 <span class="muted" style="font-size:11px">(전환수)</span>`, val:cnt(t.ord)},
    {lab:`전환율 <span class="muted" style="font-size:11px">(주문/클릭)</span>`, val:t.cvr==null?"—":pct(t.cvr,2)},
    {lab:`CPA <span class="muted" style="font-size:11px">(광고비/주문)</span>`, val:t.cpa==null?"—":won(t.cpa)},
    {lab:`객단가 <span class="muted" style="font-size:11px">(전환매출/주문)</span>`, val:t.aov==null?"—":won(t.aov)},
    {lab:`판매수량`, val:cnt(t.qty)},
  ]);
  if(mm && mm.adDep!=null)
    cards.push({lab:`광고 의존도 <span class="muted" style="font-size:11px">(광고전환매출/매마 매출)</span>`, val:pct(mm.adDep,1)});
  html+=`<div class="cards">`+cards.map(x=>`<div class="card"><div class="lab">${x.lab}</div><div class="val">${x.val}</div></div>`).join("")+`</div>`;

  /* --- 채널 비교 --- */
  html+=`<div id="chPanel"></div>`;

  /* --- 자사 매출 기준 (매마 매출) --- */
  html+=`<div id="maemaPanel"></div>`;

  /* --- 상품 점검 --- */
  html+=`<div id="alertPanel"></div>`;

  /* --- 추이 차트 --- */
  const labels=recent.map(g=>g.label);
  const unitTxt = STATE.mode==="day"?"일":STATE.mode==="week"?"주":"개월";
  html+=`<div class="panel">
    <h2>추이 <span class="muted" style="font-size:12px">· 최근 ${recent.length}${unitTxt} · ${chLbl}</span></h2>
    <div class="charts">
      <div>
        <div class="legend">
          <span><span class="dot" style="background:var(--cost)"></span>광고비</span>
          <span><span class="dot" style="background:var(--rev)"></span>광고전환매출</span>
          ${hasMaema()?`<span><span class="dot" style="background:var(--good)"></span>매마 매출</span>`:""}
        </div>
        <div class="chartbox" id="chartRev"></div>
      </div>
      <div>
        <div class="legend">
          <span><span class="dot" style="background:var(--roas)"></span>ROAS <span class="muted">(전환매출÷광고비)</span></span>
        </div>
        <div class="chartbox" id="chartRoas"></div>
      </div>
    </div>
    <div class="charts" style="margin-top:6px">
      <div>
        <div class="legend">
          <span><span class="dot" style="background:var(--net)"></span>CPC <span class="muted">(광고비÷클릭)</span></span>
        </div>
        <div class="chartbox" id="chartCpc"></div>
      </div>
      <div>
        <div class="legend">
          <span><span class="dot" style="background:var(--good)"></span>CTR <span class="muted">(클릭÷노출)</span></span>
        </div>
        <div class="chartbox" id="chartCtr"></div>
      </div>
    </div>
  </div>`;

  /* --- 구성 분석 (캠페인 / 노출지면 / 브랜드 / 광고그룹) --- */
  html+=`<div id="bdPanel"></div>`;

  /* --- 상품별 --- */
  html+=`<div id="prodPanel"></div>`;

  /* --- 기간 상세 표 --- */
  const detailMax=CONFIG.DETAIL_MAX[STATE.mode]||8;
  // 매마 매출 컬럼: 일별 탭이 있으면 모든 뷰에서, 없으면 월별 뷰에서만
  const showMaema = hasMaema() || (STATE.mode==="month" && MONTHLY && MONTHLY.months.length>0);
  // 광고비 비중은 모든 뷰에서 표시(일별 매마 탭이 있으므로 일/주 단위도 합산 가능).
  // 단 매마가 마감되지 않은 달이 걸친 기간은 행 단위로 '—' 처리됩니다(g.adShare).
  const showShare = showMaema;
  const rowsShown = STATE.detailAll ? view : view.slice(0, detailMax);
  const moreBtn = view.length>detailMax
    ? `<button id="detailToggle" style="font-size:12.5px;padding:6px 12px">${STATE.detailAll?`최근 ${detailMax}${unitTxt}만 보기`:`전체 ${view.length}${unitTxt} 보기`}</button>` : "";
  html+=`<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">
      <h2 style="margin:0">${STATE.mode==="day"?"일별":STATE.mode==="week"?"주간":"월별"} 상세
        <span class="muted" style="font-size:12px">· ${STATE.detailAll?`전체 ${view.length}${unitTxt}`:`최근 ${Math.min(detailMax,view.length)}${unitTxt}`}${rangeActive()?" · 기간 적용":""}</span></h2>
      ${moreBtn}
    </div>
    <p class="hint">ROAS = <b>광고전환매출</b>÷광고비 · CTR = 클릭÷노출 · CPC = 광고비÷클릭 · 전환율 = 주문÷클릭 · CPA = 광고비÷주문${showMaema?` · <b>광고비 비중</b> = 광고비÷매마 매출`:""}<br>
      <span class="muted">※ 광고전환매출은 쿠팡 광고 어드민의 전환매출(취소·반품 반영 전)이며, 자사 인식 매출(매마)과는 다릅니다.
      ${showMaema?`<span class="bdg conf">✔확정</span> 달은 '월간보고' 탭의 어드민 확정치로 집계합니다.`:""}
      ${(showShare && STATE.mode!=="month")?`<br>※ <b>매마 매출은 매입 발주 시점에 몰려 잡힙니다</b>(로켓은 발주일에만 금액 발생). 그래서 ${STATE.mode==="day"?"일":"주"} 단위 광고비 비중은 크게 출렁일 수 있으니, 추세는 <b>월별 뷰</b>로 함께 확인하세요.`:""}</span></p>
    <div class="tblwrap"><table>
      <thead><tr>
        <th>기간</th>${showMaema?`<th title="자사에서 매출로 인식하는 금액 ('매마 일별 매출액' 탭)">매마 매출</th>`:""}<th>광고비</th>
        ${showShare?`<th title="광고비 ÷ 매마 매출">광고비 비중</th>`:""}<th>광고전환매출</th><th>ROAS</th>
        <th>노출수</th><th>클릭수</th><th title="클릭수 ÷ 노출수">CTR</th><th title="광고비 ÷ 클릭수">CPC</th>
        <th>주문수</th><th title="주문수 ÷ 클릭수">전환율</th><th title="광고비 ÷ 주문수">CPA</th><th>판매수량</th>
      </tr></thead><tbody>`;
  for(const g of rowsShown){
    const lbl=g.label + (g.confirmed
        ? ` <span class="bdg conf" title="'월간보고' 탭의 어드민 확정치로 집계">✔확정</span>`
        : (g.corr ? ` <span class="bdg conf" title="월간보고 확정치에 맞춰 일별 데이터를 보정한 값">보정</span>`
        : (g.provisional ? ` <span class="bdg prov" title="전환 추적 중 — 전환매출·ROAS가 더 올라갈 수 있음">⚠잠정</span>`
        : (g.partialMonth ? ` <span class="bdg lo" title="선택 기간에 이 달의 일부만 포함됨">부분</span>` : ""))));
    html+=`<tr>
      <td>${lbl}</td>
      ${showMaema?`<td class="num">${g.maema==null?'<span class="muted">—</span>'
         :(won(g.maema)+(g.maemaFull===false?` <span class="bdg lo" title="매마 매출이 아직 마감되지 않은 달이 포함된 기간입니다(부분 합계)">부분</span>`:""))}</td>`:""}
      <td class="num">${won(g.cost)}</td>
      ${showShare?`<td class="num">${g.adShare==null?'<span class="muted">—</span>':`<span class="${g.adShare<=25?'pos':'neg'}">${pct(g.adShare,1)}</span>`}</td>`:""}
      <td class="num">${won(g.rev)}</td>
      <td class="num">${g.roas==null?'<span class="muted">—</span>':`<span class="${g.roas>=CONFIG.ALERT.targetRoas?'pos':'neg'}">${pct(g.roas)}</span>`}</td>
      <td class="num muted">${cnt(g.imp)}</td>
      <td class="num muted">${cnt(g.clk)}</td>
      <td class="num muted">${g.ctr==null?'—':pct(g.ctr,2)}</td>
      <td class="num muted">${g.cpc==null?'—':won(g.cpc)}</td>
      <td class="num">${cnt(g.ord)}</td>
      <td class="num muted">${g.cvr==null?'—':pct(g.cvr,2)}</td>
      <td class="num muted">${g.cpa==null?'—':won(g.cpa)}</td>
      <td class="num muted">${cnt(g.qty)}</td>
    </tr>`;
  }
  const s=derive(rowsShown.reduce((a,g)=>{a.cost+=g.cost;a.rev+=g.rev;a.ord+=g.ord;a.qty+=g.qty;a.imp+=g.imp;a.clk+=g.clk;
    if(g.maema!=null) a.maema=(a.maema||0)+g.maema;
    // 합계 비율은 '매마가 마감된 기간'의 매마·광고비를 같은 범위로 더해 계산
    // (발주가 없어 매마 0원인 날도 광고비는 포함해야 기간 전체 비율이 맞습니다)
    if(g.maemaFull){ a.maemaF=(a.maemaF||0)+(g.maema||0); a.mCost=(a.mCost||0)+g.cost; }
    return a;},blank()));
  const sShare = (showShare && s.maemaF) ? s.mCost/s.maemaF*100 : null;   // 매마가 온전한 기간만으로 계산
  html+=`</tbody><tfoot><tr>
      <td>합계</td>
      ${showMaema?`<td class="num">${s.maema==null?"—":won(s.maema)}</td>`:""}
      <td class="num">${won(s.cost)}</td>
      ${showShare?`<td class="num">${sShare==null?"—":pct(sShare,1)}</td>`:""}
      <td class="num">${won(s.rev)}</td><td class="num">${s.roas==null?"—":pct(s.roas)}</td>
      <td class="num">${cnt(s.imp)}</td><td class="num">${cnt(s.clk)}</td>
      <td class="num">${s.ctr==null?"—":pct(s.ctr,2)}</td><td class="num">${s.cpc==null?"—":won(s.cpc)}</td>
      <td class="num">${cnt(s.ord)}</td><td class="num">${s.cvr==null?"—":pct(s.cvr,2)}</td>
      <td class="num">${s.cpa==null?"—":won(s.cpa)}</td><td class="num">${cnt(s.qty)}</td>
    </tr></tfoot></table></div>
  </div>`;

  c.innerHTML=html;

  barChart($("#chartRev"), labels, [
    {name:"광고비", color:"var(--cost)", values:recent.map(g=>g.cost)},
    {name:"광고전환매출", color:"var(--rev)", values:recent.map(g=>g.rev)},
  ].concat(hasMaema()?[{name:"매마 매출", color:"var(--good)",
      // 부분 입력 구간은 낮게 찍혀 오해를 부르므로 막대를 그리지 않습니다
      values:recent.map(g=>(g.maema==null||g.maemaFull===false)?null:g.maema)}]:[]),
  {fmt:wonShort});
  lineChart($("#chartRoas"), labels, [
    {name:"ROAS", color:"var(--roas)", values:recent.map(g=>g.roas)},
  ], {fmt:v=>Math.round(v)+"%", unit:"%"});
  lineChart($("#chartCpc"), labels, [
    {name:"CPC", color:"var(--net)", values:recent.map(g=>g.cpc)},
  ], {fmt:wonShort, labelFmt:v=>"₩"+Math.round(v).toLocaleString("ko-KR")});
  lineChart($("#chartCtr"), labels, [
    {name:"CTR", color:"var(--good)", values:recent.map(g=>g.ctr)},
  ], {fmt:v=>v.toFixed(2)+"%", labelFmt:v=>v.toFixed(2)+"%"});

  $("#detailToggle")?.addEventListener("click",()=>{ STATE.detailAll=!STATE.detailAll; render(); });
  renderChannelPanel();
  renderMaemaPanel();
  renderAlertPanel();
  renderBreakdown();
  renderProductPanel();
  setFoot();
}

/* ============================================================
   채널 비교 (로켓 vs 윙)
   ============================================================ */
function renderChannelPanel(){
  const el=$("#chPanel"); if(!el) return;
  // 채널·캠페인 필터는 무시하고 브랜드·기간만 적용해서 두 채널을 나란히 비교
  const per=CONFIG.CHANNELS.map(c=>({ c, t: total(filterRows({ch:c.id, camp:"all"})) }));
  const sum=per.reduce((a,x)=>a+x.t.cost,0);
  const sumRev=per.reduce((a,x)=>a+x.t.rev,0);
  const boxes=per.map(({c,t})=>{
    const share = sum>0 ? t.cost/sum*100 : 0;
    return `<div class="chbox">
      <div class="t"><span class="dot" style="background:${c.color}"></span>${c.name}
        <span class="muted" style="font-weight:400;font-size:11.5px" title="전체 광고비 중 이 채널이 차지하는 비율">· 광고비 점유율 ${pct(share,1)}</span></div>
      <div class="kv"><span>광고비</span><b>${won(t.cost)}</b></div>
      <div class="kv"><span>광고전환매출</span><b>${won(t.rev)}</b></div>
      <div class="kv"><span>ROAS</span><b class="${t.roas!=null&&t.roas>=CONFIG.ALERT.targetRoas?'pos':'neg'}">${t.roas==null?"—":pct(t.roas)}</b></div>
      <div class="kv"><span>노출 / 클릭</span><b>${cnt(t.imp)} / ${cnt(t.clk)}</b></div>
      <div class="kv"><span>CTR / CPC</span><b>${t.ctr==null?"—":pct(t.ctr,2)} / ${t.cpc==null?"—":won(t.cpc)}</b></div>
      <div class="kv"><span>주문수 / 전환율</span><b>${cnt(t.ord)} / ${t.cvr==null?"—":pct(t.cvr,2)}</b></div>
      <div class="kv"><span>CPA / 객단가</span><b>${t.cpa==null?"—":won(t.cpa)} / ${t.aov==null?"—":won(t.aov)}</b></div>
    </div>`;
  }).join("");
  const shareBar = sum>0 ? `<div class="share">${per.map(({c,t})=>`<i style="width:${(t.cost/sum*100).toFixed(2)}%;background:${c.color}" title="${c.name} 광고비 ${won(t.cost)}"></i>`).join("")}</div>
    <div class="legend" style="margin-top:0">${per.map(({c,t})=>`<span><span class="dot" style="background:${c.color}"></span>${c.name} ${pct(sum>0?t.cost/sum*100:0,1)}</span>`).join("")}
      <span class="muted">· 합계 광고비 ${won(sum)} · 합계 전환매출 ${won(sumRev)} · 합계 ROAS ${sum>0?pct(sumRev/sum*100):"—"}</span></div>` : "";

  el.innerHTML=`<div class="panel">

    ${shareBar}
    <div class="chgrid">${boxes}</div>
    <div class="charts">
      <div>
        <div class="legend">${CONFIG.CHANNELS.map(c=>`<span><span class="dot" style="background:${c.color}"></span>${c.name} 광고비</span>`).join("")}</div>

      </div>
      <div>
        <div class="legend">${CONFIG.CHANNELS.map(c=>`<span><span class="dot" style="background:${c.color}"></span>${c.name} ROAS</span>`).join("")}</div>
        <div class="chartbox" id="chChartRoas"></div>
      </div>
    </div>
  </div>`;

  // 채널별 기간 추이
  const chartMax=CONFIG.CHART_MAX[STATE.mode]||8;
  const perCh=CONFIG.CHANNELS.map(c=>{
    const g=groupPeriod(filterRows({ch:c.id, camp:"all"}), STATE.mode);

  });
  const keySet=new Set(); perCh.forEach(p=>p.g.forEach(x=>keySet.add(x.key)));
  const keys=[...keySet].sort().slice(-chartMax);
  const labels=keys.map(k=>{
    const anyg=perCh.map(p=>p.m[k]).find(Boolean);
    return anyg?anyg.label:k;
  });
  barChart($("#chChartCost"), labels, perCh.map(p=>({
    name:p.c.name, color:p.c.color, values:keys.map(k=>p.m[k]?p.m[k].cost:0) })), {fmt:wonShort});
  lineChart($("#chChartRoas"), labels, perCh.map(p=>({
    name:p.c.name, color:p.c.color, values:keys.map(k=>p.m[k]?p.m[k].roas:null) })), {fmt:v=>Math.round(v)+"%", unit:"%"});
}

/* ============================================================
   자사 매출 기준 (매마 매출) — '월간보고' 탭 값
   ============================================================ */
function renderMaemaPanel(){
  const el=$("#maemaPanel"); if(!el) return;
  if(!MONTHLY || !MONTHLY.months.length){
    el.innerHTML = (MONTHLY&&MONTHLY.failed)
      ? `<div class="banner"><b>⚠️ '월간보고' 탭을 불러오지 못했습니다.</b> 매마 매출 기준 지표는 표시되지 않습니다. 시트 게시 범위가 <b>전체 문서</b>인지 확인해 주세요.</div>`
      : "";
    return;
  }
  // '월간보고' 월 ∪ '매마 일별' 월
  const mset=new Set(MONTHLY.months);
  if(hasMaema()) for(const k of Object.keys(MAEMA.byMonth)) mset.add(k.slice(0,k.indexOf("|")));
  const months=[...mset].sort().reverse();
  const rowsHtml=[];
  // T.costM/revM = 매마 매출이 입력된 달만의 합 (비율 계산용 — 기간이 어긋나면 비율이 왜곡되므로 분리)
  const T={maema:0,cost:0,rev:0,costM:0,revM:0,anyMaema:false,nM:0,n:0};
  for(const ym of months){
    const per=CONFIG.CHANNELS.map(c=>{
      const src=confirmedMonth(c.id,ym);
      const md=hasMaema() ? MAEMA.byMonth[`${ym}|${c.id}`] : null;
      if(!src && md==null) return null;
      const d=Object.assign({maema:null,cost:null,rev:null,imp:null,clk:null,qty:null,ord:null}, src||{});
      // 매마 매출은 '매마 일별 매출액' 탭으로 통일 (일별 탭이 있으면 월간보고 매마 값은 쓰지 않음)
      d.maema = hasMaema() ? md : (src?src.maema:null);
      return {c,d};
    }).filter(Boolean);
    if(!per.length) continue;
    const sum={maema:null,cost:null,rev:null,imp:null,clk:null,qty:null};
    for(const {d} of per) for(const k of Object.keys(sum)) if(d[k]!=null) sum[k]=(sum[k]||0)+d[k];
    const line=(label,d,isSum)=>{
      const adShare = (d.maema && d.cost!=null) ? d.cost/d.maema*100 : null;   // 광고비 비중
      const adDep   = (d.maema && d.rev!=null)  ? d.rev/d.maema*100  : null;   // 광고 의존도
      const roas    = (d.cost) ? d.rev/d.cost*100 : null;
      return `<tr${isSum?' style="font-weight:700;background:var(--panel2)"':''}>
        <td>${isSum?ym:""}</td>
        <td>${label}</td>
        <td class="num">${d.maema==null?'<span class="muted">미입력</span>':won(d.maema)}</td>
        <td class="num">${won(d.cost)}</td>
        <td class="num">${adShare==null?'<span class="muted">—</span>':`<span class="${adShare<=25?'pos':'neg'}">${pct(adShare,1)}</span>`}</td>
        <td class="num">${won(d.rev)}</td>
        <td class="num">${adDep==null?'<span class="muted">—</span>':pct(adDep,1)}</td>
        <td class="num">${roas==null?'<span class="muted">—</span>':pct(roas)}</td>
        <td class="num muted">${cnt(d.imp)}</td>
        <td class="num muted">${cnt(d.clk)}</td>
        <td class="num muted">${cnt(d.qty)}</td>
      </tr>`;
    };
    rowsHtml.push(line(`<b>합계</b>`, sum, true));
    for(const {c,d} of per) rowsHtml.push(line(`<span class="dot" style="background:${c.color}"></span> ${c.name}`, d, false));
    T.n++;
    if(sum.cost!=null) T.cost+=sum.cost;
    if(sum.rev!=null)  T.rev+=sum.rev;
    if(sum.maema!=null){
      T.maema+=sum.maema; T.anyMaema=true; T.nM++;
      if(sum.cost!=null) T.costM+=sum.cost;
      if(sum.rev!=null)  T.revM+=sum.rev;
    }
  }
  const tShare = T.anyMaema&&T.maema>0 ? T.costM/T.maema*100 : null;
  const tDep   = T.anyMaema&&T.maema>0 ? T.revM/T.maema*100 : null;
  const partialNote = (T.nM>0 && T.nM<T.n)
    ? ` <span class="bdg lo" title="매마 매출이 입력된 ${T.nM}개월만으로 계산 (광고비·전환매출 칸은 ${T.n}개월 전체 합계)">${T.nM}/${T.n}개월</span>` : "";

    <h2>자사 매출 기준 <span class="muted" style="font-size:12px">· 매마 매출 = 자사에서 매출로 인식하는 금액</span></h2>

      광고 전환 매출은 쿠팡 소비자 판매가 기준이라 매마 매출과 성격이 달라, 두 값을 나눈 <b>비율</b>로만 해석하세요.</span></p>
    <div class="tblwrap"><table>
      <thead><tr><th>년/월</th><th>채널</th><th>매마 매출</th><th>광고비</th>
        <th title="광고비 ÷ 매마 매출">광고비 비중</th><th>광고 전환 매출</th>
        <th title="광고 전환 매출 ÷ 매마 매출">광고 의존도</th><th>ROAS</th>
        <th>노출수</th><th>클릭수</th><th>판매수</th></tr></thead>
      <tbody>${rowsHtml.join("")}</tbody>
      <tfoot><tr><td>전체</td><td>로켓+윙</td><!-- 합계 -->
        <td class="num">${T.anyMaema?won(T.maema):"—"}</td>
        <td class="num">${won(T.cost)}</td>

        <td class="num">${won(T.rev)}</td>
        <td class="num">${tDep==null?"—":pct(tDep,1)+partialNote}</td>
        <td class="num">${T.cost>0?pct(T.rev/T.cost*100):"—"}</td>
        <td class="num"></td><td class="num"></td><td class="num"></td></tr></tfoot>
    </table></div>
    ${maemaCrossCheckHTML()}
    ${factorSummaryHTML()}
  </div>`;
}

/* ============================================================
   상품 점검 리포트
   ============================================================ */
function productAggIn(s,e,over){
  const rows=filterRows(Object.assign({s,e}, over||{}));
  const arr=groupSum(rows, r=>r.name);
  const m={}; for(const g of arr){ g.name=g.key; m[g.key]=g; }
  return m;
}
/* 상품별 진단 플래그 (점검 리포트·월간보고 공용) */
function computeFlags(cur, prev, minCost){
  const A=CONFIG.ALERT, items=[];
  for(const n of Object.keys(cur)){
    const c=cur[n]; if(c.cost < minCost) continue;
    const p=prev[n]||null;
    const flags=[]; let sev=0;
    if(c.rev===0){ flags.push({t:"전환 0",lv:"hi"}); sev=Math.max(sev,3); }
    else if(p && p.roas!=null && p.roas>=100 && c.roas!=null && c.roas < p.roas*A.roasDropRatio){
      flags.push({t:"ROAS 급감",lv:"hi"}); sev=Math.max(sev,3); }
    if(c.rev>0 && c.roas!=null && c.roas < A.targetRoas){ flags.push({t:"목표 미달",lv:"mid"}); sev=Math.max(sev,2); }
    if(p && p.cpc && c.cpc && c.clk>=20 && c.cpc >= p.cpc*A.cpcRiseRatio){ flags.push({t:"CPC 급등",lv:"mid"}); sev=Math.max(sev,2); }
    if(p && p.ctr && c.ctr && c.imp>=1000 && c.ctr <= p.ctr*A.ctrDropRatio){ flags.push({t:"CTR 급락",lv:"lo"}); sev=Math.max(sev,1); }
    if(!flags.length && c.roas!=null && c.roas >= A.targetRoas*1.5 && (!p || p.roas==null || c.roas>=p.roas)){
      flags.push({t:"증액 검토",lv:"good"}); sev=-1; }
    if(flags.length) items.push({name:n,c,p,flags,sev});
  }
  items.sort((a,b)=> b.sev-a.sev || b.c.cost-a.c.cost);
  return items;
}
function productAlerts(){
  const A=CONFIG.ALERT;
  if(!DATA_MAX) return null;
  const confirmEnd=dateShift(DATA_MAX, -ATTRIB());
  let curStart,curEnd,W;
  if(STATE.alertBasis==="range"){
    curEnd = STATE.endDate || DATA_MAX;
    curStart = STATE.startDate || DATA_MIN;
    W = Math.max(1, daysBetween(curStart,curEnd)+1);
  }else{
    W = A.windowDays; curEnd = confirmEnd; curStart = dateShift(curEnd,-(W-1));
  }
  const prevEnd=dateShift(curStart,-1), prevStart=dateShift(prevEnd,-(W-1));
  if(curEnd<DATA_MIN) return {tooEarly:true};
  const minCost=Math.max(5000, Math.round(A.minCost * W / A.windowDays));
  const unsettled = curEnd > confirmEnd;
  const cur=productAggIn(curStart,curEnd), prev=productAggIn(prevStart,prevEnd);
  const hasPrev = prevEnd>=DATA_MIN;
  const items=computeFlags(cur, prev, minCost);
  return {curStart,curEnd,prevStart,prevEnd,hasPrev,items,W,minCost,unsettled};
}

function productTrend(nameSet, topProds){
  const a14=STATE.attr==="14";
  const useCost = STATE.prodTrendMetric==="cost";
  const map={}, dayset=new Set();
  for(const r of filterRows()){
    if(!nameSet.has(r.name)) continue;
    dayset.add(r.key);
    (map[r.name] ||= {});
    map[r.name][r.key]=(map[r.name][r.key]||0)+(useCost ? r.cost : (a14?r.rev14:r.rev1));
  }
  let keys=[...dayset].sort();
  if(keys.length>62) keys=keys.slice(-62);
  const labels=keys.map(k=>k.slice(5).replace("-","/"));
  const names=topProds.filter(p=>nameSet.has(p.name)).slice(0,8).map(p=>p.name);
  const series=names.map((nm,i)=>({ name:nm, color:LINE_COLORS[i%LINE_COLORS.length],
    values:keys.map(k=> (map[nm]&&map[nm][k]!=null)?map[nm][k]:0) }));
  return {labels, series, count:names.length};
}

/* ============================================================
   월간보고 (광고 데이터만으로 자동 생성 · 텍스트 복사)
   ============================================================ */
function monthBounds(ym){
  const [y,m]=ym.split("-").map(Number);
  return { first:`${ym}-01`, last:`${ym}-${pad(new Date(y,m,0).getDate())}` };
}
function prevYm(ym){
  const [y,m]=ym.split("-").map(Number);
  const d=new Date(y, m-2, 1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
}
function monthsAvailable(){
  const s=new Set();
  for(const c of CONFIG.CHANNELS) for(const r of (RAW[c.id]||[])) s.add(r.key.slice(0,7));
  return [...s].sort();
}
// ym 월의 채널별/전체 집계 (+ 전월 비교)
//  '월간보고' 탭에 입력된 달은 어드민 확정치로 교체하고 매마 매출을 붙입니다.
function monthStats(ym){
  const b=monthBounds(ym), pb=monthBounds(prevYm(ym));
  const one=(chId, bb, yy)=>{
    const t=total(filterRows({ch:chId, brand:"all", camp:"all", s:bb.first, e:bb.last}));
    const cf=confirmedFor(yy, chId);
    if(cf){
      if(cf.cost!=null) t.cost=cf.cost;
      if(cf.rev!=null)  t.rev=cf.rev;
      if(cf.imp!=null)  t.imp=cf.imp;
      if(cf.clk!=null)  t.clk=cf.clk;
      if(cf.ord!=null)  t.ord=cf.ord;
      if(cf.qty!=null)  t.qty=cf.qty;
      t.confirmed=true;
      derive(t);
    }
    // 매마 매출은 '매마 일별 매출액' 탭으로 통일 (없을 때만 월간보고 값으로 대체)
    t.maema = hasMaema() ? maemaSum(bb.first, bb.last, chId) : (cf?cf.maema:null);
    t.adShare = (t.maema && t.cost!=null) ? t.cost/t.maema*100 : null;  // 광고비 비중
    t.adDep   = (t.maema && t.rev!=null)  ? t.rev/t.maema*100  : null;  // 광고 의존도
    return t;
  };
  const py=prevYm(ym);
  const per=CONFIG.CHANNELS.map(c=>({ c, t:one(c.id,b,ym), p:one(c.id,pb,py) }));
  return { ym, b, pb, per, all:one("all",b,ym), allPrev:one("all",pb,py) };
}
const dRate=(now,before)=> (now==null||before==null||!before) ? null : (now-before)/before*100;
function dTag(now,before,better){
  const r=dRate(now,before);
  if(r==null) return "";
  const up=r>=0, good=(better==="up")?up:!up;
  return ` <span class="${good?'pos':'neg'}" style="font-size:11.5px">${up?"▲":"▼"}${Math.abs(r).toFixed(0)}%</span>`;
}
function dTagTxt(now,before,better){
  const r=dRate(now,before);
  if(r==null) return "";
  return ` (전월 대비 ${r>=0?"▲":"▼"}${Math.abs(r).toFixed(0)}%)`;
}
function metricLines(t,p,html){
  const L=[];
  // 자사 인식 매출(매마) 기준 지표 — '월간보고' 탭에 값이 있는 달만
  if(t.maema!=null){
    L.push(["매마 매출 (자사 인식)", won(t.maema), t.maema, p&&p.maema, "up"]);
    L.push(["광고비 비중", t.adShare==null?"—":pct(t.adShare,1), t.adShare, p&&p.adShare, "down"]);
    L.push(["광고 의존도", t.adDep==null?"—":pct(t.adDep,1), t.adDep, p&&p.adDep, "up"]);
  }
  L.push(...[
    ["광고비", won(t.cost), t.cost, p&&p.cost, "down"],
    ["광고전환매출", won(t.rev), t.rev, p&&p.rev, "up"],
    ["ROAS", t.roas==null?"—":pct(t.roas), t.roas, p&&p.roas, "up"],
    ["노출수", cnt(t.imp), t.imp, p&&p.imp, "up"],
    ["클릭수", cnt(t.clk), t.clk, p&&p.clk, "up"],
    ["CTR", t.ctr==null?"—":pct(t.ctr,2), t.ctr, p&&p.ctr, "up"],
    ["CPC", t.cpc==null?"—":won(t.cpc), t.cpc, p&&p.cpc, "down"],
    ["주문수", cnt(t.ord), t.ord, p&&p.ord, "up"],
    ["전환율", t.cvr==null?"—":pct(t.cvr,2), t.cvr, p&&p.cvr, "up"],
    ["CPA", t.cpa==null?"—":won(t.cpa), t.cpa, p&&p.cpa, "down"],
    ["객단가", t.aov==null?"—":won(t.aov), t.aov, p&&p.aov, "up"],
    ["판매수량", cnt(t.qty), t.qty, p&&p.qty, "up"],
  ]);
  if(html) return `<div class="rep-kv">`+L.map(x=>
    `<div><span class="k">${x[0]}</span> <b>${x[1]}</b>${dTag(x[2],x[3],x[4])}</div>`).join("")+`</div>`;
  return L.map(x=>`- ${x[0]}: ${x[1]}${dTagTxt(x[2],x[3],x[4]).replace(/[▲▼]/g,m=>m==="▲"?"+":"-")}`).join("\n");
}
function monthTopProducts(ym, n){
  const b=monthBounds(ym);
  const m=productAggIn(b.first,b.last,{ch:"all",brand:"all",camp:"all"});
  return Object.values(m).sort((a,b2)=>b2.cost-a.cost).slice(0,n||10);
}
function monthFlags(ym){
  const b=monthBounds(ym), pb=monthBounds(prevYm(ym));
  const cur=productAggIn(b.first,b.last,{ch:"all",brand:"all",camp:"all"});
  const prev=productAggIn(pb.first,pb.last,{ch:"all",brand:"all",camp:"all"});
  return computeFlags(cur, prev, CONFIG.ALERT.minCost);
}
function monthProvisional(ym){
  const b=monthBounds(ym);
  const provStart = DATA_MAX ? dateShift(DATA_MAX, -(ATTRIB()-1)) : null;
  const endKey = b.last>DATA_MAX ? DATA_MAX : b.last;
  return !!(provStart && endKey>=provStart);
}

function reportText(ym){
  const s=monthStats(ym);
  const L=[];
  L.push(`쿠팡 광고 데이터 ${ym} 공유드립니다.`);
  L.push("");
  L.push(`■ 전체 (로켓광고 + 윙광고)`);
  L.push(metricLines(s.all, s.allPrev, false));
  for(const {c,t,p} of s.per){
    if(!t.cost && !t.rev) continue;
    const share = s.all.cost>0 ? t.cost/s.all.cost*100 : 0;
    L.push("");
    L.push(`■ ${c.name} (광고비 점유율 ${pct(share,1)})`);
    L.push(metricLines(t,p,false));
  }
  const tops=monthTopProducts(ym,10);
  if(tops.length){
    L.push("");
    L.push(`■ 광고비 상위 상품 (Top ${tops.length})`);
    tops.forEach((p,i)=>L.push(`${i+1}. ${p.name} — 광고비 ${won(p.cost)} / 전환매출 ${won(p.rev)} / ROAS ${p.roas==null?"—":pct(p.roas)}`));
  }
  const fl=monthFlags(ym).filter(x=>x.sev>=2).slice(0,8);
  const gd=monthFlags(ym).filter(x=>x.sev<0).slice(0,5);
  if(fl.length){
    L.push("");
    L.push(`■ 조치 검토 상품`);
    fl.forEach(x=>L.push(`- ${x.name} [${x.flags.map(f=>f.t).join(", ")}] 광고비 ${won(x.c.cost)} / ROAS ${x.c.roas==null?"—":pct(x.c.roas)} → ${ACTION[x.flags[0].t]||""}`));
  }
  if(gd.length){
    L.push("");
    L.push(`■ 증액 검토 상품`);
    gd.forEach(x=>L.push(`- ${x.name} 광고비 ${won(x.c.cost)} / ROAS ${pct(x.c.roas)}`));
  }
  L.push("");
  if(s.all.maema!=null){
    L.push(`※ 매마 매출은 '매마 일별 매출액' 탭의 일별 합계(자사 인식 매출)이며, 광고비·광고전환매출·노출·클릭·주문수는 어드민 확정치입니다.`);
    L.push(`※ 광고비 비중 = 광고비 ÷ 매마 매출 · 광고 의존도 = 광고전환매출 ÷ 매마 매출`);
  }
  L.push(`※ 광고전환매출은 쿠팡 광고 어드민 기준(클릭 후 ${ATTRIB()}일)이며 취소·반품 반영 전입니다.`);
  if(monthProvisional(ym)) L.push(`※ 이 달은 전환 추적 ${ATTRIB()}일 구간이 포함돼 전환매출·ROAS가 더 올라갈 수 있습니다(잠정).`);
  return L.join("\n");
}

function showReport(){
  $("#chSeg").style.display="none";
  $("#rangeBar").style.display="none";
  $("#filterBar").style.display="none";
  const months=monthsAvailable();
  if(!months.length){ $("#content").innerHTML=`<div class="err">집계할 월 데이터가 없습니다.</div>`; return; }
  if(!STATE.reportYm || !months.includes(STATE.reportYm)){
    // 기본값: 전환 추적이 끝난 가장 최근 달(없으면 최신 달)
    const confirmEnd=dateShift(DATA_MAX, -ATTRIB());
    const done=months.filter(m=>monthBounds(m).last<=confirmEnd);
    STATE.reportYm = done.length? done[done.length-1] : months[months.length-1];
  }
  renderReportDoc([...months].reverse());
}

async function fetchCSV(url){
  let res;
  try{ res=await fetch(url,{cache:"no-store"}); }
  catch(e){ const err=new Error("접근 실패 (미게시 또는 네트워크)"); err.kind="blocked"; throw err; }
  if(!res.ok){ const err=new Error("HTTP "+res.status); err.kind=(res.status===401||res.status===403)?"blocked":"http"; throw err; }
  return await res.text();
}

async function load(){
  $("#content").innerHTML=`<div class="loading"><span class="spin"></span>쿠팡 광고 데이터를 불러오는 중…
    <span class="muted">(로켓·윙 두 탭 약 18MB, 10~60초 걸릴 수 있습니다)</span></div>
    ${isFile()?`<div class="banner" style="margin-top:16px">ℹ️ 지금 <code>file://</code> 로 열려 있습니다.
      크롬이 외부 요청을 차단하면 잠시 뒤 오류가 표시됩니다 — 그 경우 <b>쿠팡광고리포트_열기.bat</b> 으로 열어주세요.</div>`:""}`;
  try{
    const texts=await Promise.all(CONFIG.CHANNELS.map(c=>fetchCSV(c.csv)));
    CONFIG.CHANNELS.forEach((c,i)=>{ RAW[c.id]=parseCoupang(texts[i], c.id); });
  }catch(e){
    // file:// 로 열었으면 십중팔구 브라우저의 origin 차단 — 게시 문제와 구분해서 안내

      : (e.kind==="blocked" ? publishHelp("쿠팡 광고", e.message)
      : `<div class="err"><b>쿠팡 광고 데이터를 불러오지 못했습니다.</b><br>${escapeHtml(e.message)}
         <br><br>· 인터넷 연결 확인<br>· 크롬/엣지에서 열었는지 확인<br>· 시트 게시 상태(전체 문서) 확인</div>`);
    $("#footnote").innerHTML=""; return;
  }
  // '월간보고' 탭 (어드민 확정치 + 매마 매출) — 실패해도 리포트는 계속 표시
  if(CONFIG.MONTHLY_CSV){
    try{ MONTHLY=parseMonthly(await fetchCSV(CONFIG.MONTHLY_CSV)); }
    catch(e){ console.warn("월간보고 탭 로드 실패",e); MONTHLY={byKey:{},months:[],failed:true}; }
  }
  // '매마 일별 매출액' 탭 — 실패해도 리포트는 계속 표시
  if(CONFIG.MAEMA_CSV){
    try{ MAEMA=parseMaemaDaily(await fetchCSV(CONFIG.MAEMA_CSV)); }
    catch(e){ console.warn("매마 일별 탭 로드 실패",e); MAEMA={byKey:{},byMonth:{},n:0,failed:true}; }
  }
  buildFactors();   // 월 확정치 보정 계수 (일별 행에 부착)
  let min=null,max=null,n=0;
  for(const c of CONFIG.CHANNELS){
    for(const r of (RAW[c.id]||[])){ n++; if(!min||r.key<min)min=r.key; if(!max||r.key>max)max=r.key; }
  }
  if(!n){ $("#content").innerHTML=`<div class="err"><b>읽어온 데이터가 비어 있습니다.</b> 시트 탭(gid)과 컬럼명을 확인하세요.</div>`; return; }
  DATA_MIN=min; DATA_MAX=max; STATE.loadedAt=new Date();
  applyDefaultRange();
  refresh();
}

/* ---- 이벤트 ---- */
$("#chSeg").innerHTML =
  `<button data-c="all" class="on">전체</button>`+
  CONFIG.CHANNELS.map(c=>`<button data-c="${c.id}">${c.name}</button>`).join("");
$("#chSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  setChannel(b.dataset.c);
});
$("#periodSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  STATE.mode=b.dataset.p; STATE.detailAll=false;
  [...$("#periodSeg").children].forEach(x=>x.classList.toggle("on",x===b));
  refresh();
});
$("#refreshBtn").addEventListener("click",()=>load());
load();
</script>
</body>
</html>
