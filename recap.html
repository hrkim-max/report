<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트컴퍼니 여름 시즌 리캡</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --text:#e6e9ef; --sub:#9aa3b2; --accent:#5b9dff; --accent2:#7ee0c0;
  --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --c1:#5b9dff; --c2:#7ee0c0; --c3:#f0a868; --c4:#c88bff; --c5:#f87171;
  --c6:#5fd0d8; --c7:#ffd166; --c8:#a3e635; --c9:#fb7185; --c10:#93c5fd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Roboto,sans-serif;
  font-size:14px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 60px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.4px}
.badge{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.badge.time{color:var(--accent2);border-color:#2c4a44}
.muted{color:var(--sub)} .small{font-size:12px}
a{color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#08101f;border-color:var(--accent);font-weight:700}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:transparent;border:0;color:var(--sub);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:#08101f}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.rangebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin:10px 0}
.rangebar input[type=date]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 8px;font-size:13px}
input,select{font-family:inherit}
.tinput{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 9px;font-size:13px}
select.tinput{min-width:150px}

.hero{background:linear-gradient(160deg,#1b2233 0%,#171a21 60%);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;margin:12px 0}
.hero .eyebrow{font-size:12px;color:var(--accent2);font-weight:700;letter-spacing:.5px}
.hero .big{font-size:46px;font-weight:800;letter-spacing:-1.6px;margin:6px 0 2px;line-height:1.05}
.hero .sub{font-size:13px;color:var(--sub)}
.hero .yoy{display:inline-block;font-size:15px;font-weight:800;padding:3px 12px;border-radius:20px;margin-left:10px;vertical-align:10px}
.yoy.up{background:rgba(74,222,128,.15);color:var(--good)}
.yoy.down{background:rgba(248,113,113,.15);color:var(--bad)}
.yearbars{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap}
.yearbar{flex:1;min-width:180px}
.yearbar .lab{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.yearbar .lab b{color:var(--text)}
.yearbar .track{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:5px}
.yearbar .track>i{display:block;height:100%;border-radius:6px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .lab{font-size:12px;color:var(--sub)}
.kpi .val{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.kpi .delta{font-size:12px;margin-top:3px}
.kpi .sub2{font-size:11px;color:var(--sub);margin-top:1px}
.up{color:var(--good)} .down{color:var(--bad)}
.pos{color:var(--good)} .neg{color:var(--bad)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .h-sub{font-size:12px;color:var(--sub);font-weight:500}
.card .lead{font-size:13px;color:var(--sub);margin:0 0 12px}
.secnum{display:inline-block;width:22px;height:22px;line-height:21px;text-align:center;border-radius:7px;
  background:var(--panel2);border:1px solid var(--line);color:var(--accent);font-size:11px;font-weight:800;margin-right:7px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th.act{color:var(--text)}
tbody tr:hover{background:var(--panel2)}
tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--panel2)}
.tbl-wrap{overflow-x:auto;max-height:520px;overflow-y:auto}
.mini{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;display:inline-block;width:64px;vertical-align:middle}
.mini>i{display:block;height:100%;background:var(--accent)}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.notice{background:#20242e;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--sub);font-size:13px}
.err{border-color:var(--bad);color:#f7b4b4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--sub);flex:1;min-width:170px}
.chip b{color:var(--text);font-size:14px;display:block;margin-top:2px;font-weight:700}
.newp{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:10px;padding:10px 12px}
.newp .n{font-weight:700;font-size:14px}
.gauge{height:14px;background:var(--panel2);border-radius:8px;overflow:hidden;margin:6px 0 2px}
.gauge>i{display:block;height:100%;border-radius:8px}
.bullets{margin:0;padding-left:0;list-style:none}
.bullets li{padding:9px 0 9px 26px;border-bottom:1px dashed var(--line);position:relative;font-size:13.5px}
.bullets li:last-child{border-bottom:0}
.bullets li:before{content:"";position:absolute;left:8px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.bullets b{color:#fff}
.notewrap{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.notebtn{color:var(--sub)}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:10px;padding:11px 13px}
.notetext{font-size:13.5px;white-space:normal;word-break:break-word}
.notearea{width:100%;min-height:96px;resize:vertical;background:var(--panel2);border:1px solid var(--accent);
  color:var(--text);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;font-family:inherit}
.notearea:focus{outline:none;border-color:var(--accent2)}
#chartTip{position:fixed;display:none;z-index:9999;background:#0b0e14;border:1px solid var(--line);border-radius:8px;
  padding:6px 9px;font-size:12px;color:var(--text);pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5);white-space:pre-line}
@media print{ body{background:#fff} .card,.hero{break-inside:avoid} #gate{display:none!important} }
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center">
  <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 26px;width:320px;max-width:90vw;text-align:center">
    <div style="font-size:30px">🔒</div>
    <div style="font-size:16px;font-weight:700;margin:8px 0 2px">여름 시즌 리캡</div>
    <div class="muted small" style="margin-bottom:16px">비밀번호를 입력하세요</div>
    <input id="gatePw" type="password" class="tinput" style="width:100%;text-align:center;font-size:15px;padding:9px" placeholder="비밀번호" autocomplete="current-password">
    <div id="gateErr" class="small" style="color:var(--bad);height:18px;margin:6px 0"></div>
    <button id="gateBtn" class="btn pri" style="width:100%;padding:9px">열기</button>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <h1>☀️ 프로젝트컴퍼니 여름 시즌 리캡</h1>
    <span class="badge" id="srcBadge">데이터 불러오는 중…</span>
    <span class="badge time" id="metaBadge" style="display:none"></span>
    <a class="badge" href="sales.html" style="text-decoration:none">📊 전체 대시보드</a>
  </header>
  <div class="muted small">매출마스터 집계 기준 · 개인정보 제외 · 모든 비교는 <b>전년 동일 월/일 구간</b> 기준</div>

  <div class="rangebar" id="rangeBar">
    <span class="small muted">시즌 기간</span>
    <input type="date" id="dStart"><span class="muted">~</span><input type="date" id="dEnd">
    <span class="seg" id="presetSeg">
      <button data-p="summer" class="on">여름(5~8월)</button>
      <button data-p="core">성수기(6~7월)</button>
      <button data-p="full">시즌 전체(4~9월)</button>
    </span>
    <span class="seg" id="metricSeg" title="집계 기준 금액">
      <button data-m="sales" class="on">매출</button>
      <button data-m="pay">실결제가</button>
    </span>
    <span class="small muted" id="cmpNote" style="margin-left:auto"></span>
  </div>

  <div id="chBar"></div>
  <div id="app"></div>
  <div class="muted small" style="margin-top:26px;text-align:center">
    프로젝트컴퍼니 · 여름 시즌 리캡 · 데이터 출처: 매출마스터 집계시트(개인정보 제외 집계)
  </div>
</div>

<script>
/* ============================ 설정 ============================ */
var CONFIG = {
  PUB: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRLKqTy44gxZL0dxBUovL8DDlgjqGimGHHawj601MabHD29d06lmsRFS6WC5yZT8wkFuMT_Q2Kjr8Pe/pub?single=true&output=csv&gid=",
  GID_DAILY: "440158491",
  GID_PRODDAILY: "1159266012",
  GID_CHPROD: "2069552888",
  GID_META: "1069750530",
  CH_MERGE: { "29cm":"29CM" },

  // 담당 채널(프로모션 효과 분석 대상). 매출마스터 채널명(표시명) 기준.
  MY_CHANNELS: ["PS스토어팜","PSL스토어팜","29CM","쿠팡(로)","쿠팡(윙)"],

  // 프로모션 기본 일정. 페이지에서 편집하면 localStorage에 저장되고,
  // '📤 JSON 내보내기'로 받은 배열을 여기 붙여 넣으면 기본값으로 영구 반영됩니다.
  // 형식: {ch:"PS스토어팜"|"담당 전체", name:"프로모션명", start:"2026-06-01", end:"2026-06-07", memo:""}
  PROMOS: [
    {"ch":"PS스토어팜","name":"가정의 달+세일","start":"2026-04-20","end":"2026-05-08","memo":""},
    {"ch":"PS스토어팜","name":"(자체) 프로모션","start":"2026-05-11","end":"2026-05-17","memo":"5% 최대 3만 원"},
    {"ch":"PS스토어팜","name":"릴렉스데이","start":"2026-05-11","end":"2026-05-24","memo":"스파인핏 1/2, 넥핏"},
    {"ch":"PS스토어팜","name":"라이프 위크","start":"2026-05-18","end":"2026-05-24","memo":""},
    {"ch":"PS스토어팜","name":"5월 라이브","start":"2026-05-20","end":"2026-05-20","memo":"여름 침구 첫 라이브"},
    {"ch":"PS스토어팜","name":"(자체) 얼리썸머","start":"2026-05-25","end":"2026-06-07","memo":"10% 최대 5만 원"},
    {"ch":"PS스토어팜","name":"(자체) COOL SUMMER WEEK","start":"2026-06-10","end":"2026-06-17","memo":"대품 5% 3만 원 / 여름 10% 3만 원"},
    {"ch":"PS스토어팜","name":"장마 대처 기획전","start":"2026-06-15","end":"2026-06-27","memo":""},
    {"ch":"PS스토어팜","name":"넾다세일","start":"2026-06-22","end":"2026-07-05","memo":""},
    {"ch":"PS스토어팜","name":"6월 라이브","start":"2026-06-24","end":"2026-06-24","memo":"여름 침구"},
    {"ch":"PS스토어팜","name":"(자체) 여름 블프","start":"2026-07-08","end":"2026-07-28","memo":""},
    {"ch":"PS스토어팜","name":"7월 라이브","start":"2026-07-15","end":"2026-07-15","memo":""},
    {"ch":"29CM","name":"가정의달 선물","start":"2026-05-01","end":"2026-05-14","memo":""},
    {"ch":"29CM","name":"PS 여름 쇼케이스","start":"2026-05-06","end":"2026-05-19","memo":"여름 침구 단독 선공개"},
    {"ch":"29CM","name":"5월 월간이구홈","start":"2026-05-18","end":"2026-05-27","memo":""},
    {"ch":"29CM","name":"이구위크","start":"2026-06-01","end":"2026-06-11","memo":""},
    {"ch":"29CM","name":"여름 침구","start":"2026-06-15","end":"2026-06-24","memo":""},
    {"ch":"29CM","name":"상반기 결산 29DAY","start":"2026-06-28","end":"2026-06-30","memo":""},
    {"ch":"29CM","name":"7월 월간이구홈","start":"2026-07-06","end":"2026-07-15","memo":""},
    {"ch":"29CM","name":"7월 홈베딩 주간특가","start":"2026-07-16","end":"2026-07-22","memo":""},
    {"ch":"29CM","name":"7월 29DAY","start":"2026-07-29","end":"2026-07-31","memo":""},
    {"ch":"29CM","name":"7월 홈베딩 주간특가(2)","start":"2026-07-30","end":"2026-08-05","memo":""}
  ],

  // 섹션 코멘트 기본값. '📤 코멘트 내보내기'로 받은 객체를 여기 붙여 넣으면 기본값으로 영구 반영됩니다.
  NOTES: {}
};

var STATE = {
  metric:'sales', start:null, end:null, preset:'summer',
  daily:[], pd:[], chprod:[], firstSeen:{},
  minDate:null, maxDate:null,
  sorts:{}, filters:{}, filterFocus:null,
  crossCh:null,
  promos:[], myChSel:null, promoDraft:null, promoEditIdx:null, promoCands:null, promoPick:null,
  notes:{}, noteEdit:null, noteDraft:'',
  chFilter:null, chPanel:false, chSearch:'',
  loaded:false, err:null
};
var NOTE_KEY='summerNotes_v1';
function loadNotes(){
  var raw=null; try{ raw=localStorage.getItem(NOTE_KEY); }catch(e){}
  if(raw){ try{ var o=JSON.parse(raw); if(o&&typeof o==='object'){ STATE.notes=o; return; } }catch(e){} }
  STATE.notes=JSON.parse(JSON.stringify(CONFIG.NOTES||{}));
}
function saveNotes(){ try{ localStorage.setItem(NOTE_KEY,JSON.stringify(STATE.notes)); }catch(e){} }
var PROMO_KEY='summerPromos_v1';
function loadPromos(){
  var raw=null; try{ raw=localStorage.getItem(PROMO_KEY); }catch(e){}
  if(raw){ try{ var a=JSON.parse(raw); if(a&&a.length!==undefined){ STATE.promos=a; return; } }catch(e){} }
  STATE.promos=(CONFIG.PROMOS||[]).slice();
}
function savePromos(){ try{ localStorage.setItem(PROMO_KEY,JSON.stringify(STATE.promos)); }catch(e){} }
var COLORS=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8','--c9','--c10']
  .map(function(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();});

/* ============================ 유틸 ============================ */
function won(n){ n=Math.round(n||0);
  if(Math.abs(n)>=100000000) return (n/100000000).toFixed(Math.abs(n)%100000000?1:0).replace(/\.0$/,'')+'억';
  if(Math.abs(n)>=10000)     return Math.round(n/10000).toLocaleString()+'만';
  return n.toLocaleString(); }
// 문장/헤드라인용 정밀 표기(억 단위 소수 2자리) — 비슷한 금액이 같은 값으로 뭉뚱그려지지 않게
function wonP(n){ n=Math.round(n||0);
  if(Math.abs(n)>=100000000) return (n/100000000).toFixed(2).replace(/0$/,'').replace(/\.$/,'')+'억';
  if(Math.abs(n)>=10000)     return Math.round(n/10000).toLocaleString()+'만';
  return n.toLocaleString()+'원'; }
function wonFull(n){ return Math.round(n||0).toLocaleString()+'원'; }
function pctS(n){ if(!isFinite(n)) return '신규'; return (n>=0?'+':'')+n.toFixed(1)+'%'; }
function el(tag,attrs,html){ var e=document.createElement(tag);
  if(attrs)for(var k in attrs)e.setAttribute(k,attrs[k]); if(html!=null)e.innerHTML=html; return e; }
function pz(s){ s=String(s).trim(); return s.length<2?'0'+s:s; }
function normDate(s){ if(!s)return s; var p=String(s).trim().split('-'); return p.length<3?s:(p[0]+'-'+pz(p[1])+'-'+pz(p[2])); }
function normYm(s){ if(!s)return s; var p=String(s).trim().split('-'); return p.length<2?s:(p[0]+'-'+pz(p[1])); }
function toNum(v){ if(v==null)return 0; var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ var d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return fmt(d); }
function shiftYear(d,n){ var p=d.split('-'); return (parseInt(p[0],10)+n)+'-'+p[1]+'-'+p[2]; }
function daysBetween(s,e){ return Math.round((new Date(e+'T00:00:00')-new Date(s+'T00:00:00'))/864e5)+1; }
function monthsIn(s,e){ var out=[],y=+s.slice(0,4),m=+s.slice(5,7),ey=+e.slice(0,4),em=+e.slice(5,7);
  while(y<ey||(y===ey&&m<=em)){ out.push(y+'-'+pz(m)); m++; if(m>12){m=1;y++;} } return out; }
function daysInMonth(ym){ return new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate(); }
function escA(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function chDisp(ch){ return CONFIG.CH_MERGE[ch]||ch; }
function mkey(){ return STATE.metric==='pay'?'pay':'sales'; }
function mlabel(){ return STATE.metric==='pay'?'실결제가':'매출'; }
function dow(dateStr){ var p=dateStr.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return ['일','월','화','수','목','금','토'][d.getDay()]; }
function rate(cur,prev){ if(!prev) return cur>0?Infinity:0; return (cur/prev-1)*100; }

function parseCSV(text){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){ var ch=text[i];
    if(q){ if(ch=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch=='"')q=true; else if(ch==','){row.push(cur);cur='';}
      else if(ch=='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch=='\r'){} else cur+=ch; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function csvToObjects(text){
  var rows=parseCSV(text).filter(function(r){return r.length>1||(r[0]&&r[0].trim());});
  if(!rows.length) return [];
  var head=rows[0].map(function(h){return h.trim();});
  return rows.slice(1).map(function(r){ var o={}; head.forEach(function(h,i){o[h]=(r[i]||'').trim();}); return o; });
}
function fetchCSV(gid){

  return fetch(url).then(function(r){ if(!r.ok)throw r.status; return r.text(); });
}

/* ---- 채널 필터 (null = 전체) ---- */
function chIn(ch){ var f=STATE.chFilter; return !f || f.indexOf(chDisp(ch))>=0; }
function filterOn(){ return !!STATE.chFilter; }
function filterLabel(){ var f=STATE.chFilter; return !f?'전체 채널':(f.length<=3?f.join(' · '):f.length+'개 채널 선택'); }
// 선택 기간 기준 채널별 합계(필터 무시) — 채널 선택 UI용
function allChannels(){
  var s=STATE.start||STATE.minDate, e=STATE.end||STATE.maxDate, m={};
  STATE.daily.forEach(function(r){ if(r.date>=s&&r.date<=e){ var c=chDisp(r.ch); m[c]=(m[c]||0)+r[mkey()]; } });
  return m;
}
function totalsDaily(s,e,ignoreFilter){
  var t={sales:0,pay:0,qty:0,cnt:0,days:{}};
  STATE.daily.forEach(function(r){ if(r.date>=s&&r.date<=e&&(ignoreFilter||chIn(r.ch))){
    t.sales+=r.sales;t.pay+=r.pay;t.qty+=r.qty;t.cnt+=r.cnt;t.days[r.date]=1; } });
  t.dayCount=Object.keys(t.days).length; t.val=t[mkey()];
  return t;
}
function groupSum(rows,s,e,keyFn){
  var m={};
  rows.forEach(function(r){ var d=r.date||r.ym; if(d>=s&&d<=e){
    if(r.ch!==undefined && !chIn(r.ch)) return;
    var k=keyFn(r); var x=m[k]||(m[k]={sales:0,pay:0,qty:0,cnt:0});
    x.sales+=r.sales; x.pay+=r.pay; x.qty+=r.qty; x.cnt+=r.cnt; } });
  return m;
}
/* 채널 필터가 걸렸을 때 제품·카테고리용 대체 집계:
   agg_chprod(월×채널×제품)를 월 커버리지 비율(agg_daily 기준)로 안분해 일 단위에 근사 */
function monthFactor(chList,ym,s,e){
  var mS=ym+'-01', mE=ym+'-'+daysInMonth(ym);
  var ws=mS>s?mS:s, we=mE<e?mE:e;
  if(we<ws) return 0;
  var map=dailyMapFor(chList);
  var whole=sumWin(map,mS,mE); if(!whole) return 0;
  if(ws===mS&&we===mE) return 1;
  return sumWin(map,ws,we)/whole;
}
function chprodAgg(chList,s,e,keyFn){
  var f={}; monthsIn(s,e).forEach(function(ym){ f[ym]=monthFactor(chList,ym,s,e); });
  var set={}; chList.forEach(function(c){ set[c]=1; });
  var m={};
  STATE.chprod.forEach(function(r){
    if(!set[chDisp(r.ch)]) return;
    var fac=f[r.ym]; if(!fac) return;
    var k=keyFn(r); var x=m[k]||(m[k]={sales:0,pay:0,qty:0,cnt:0,cat:r.cat});
    x.sales+=r.sales*fac; x.pay+=r.pay*fac; x.qty+=r.qty*fac; x.cnt+=r.cnt*fac; });
  return m;
}
// 제품/카테고리 비교행 — 필터 없으면 일별(정확), 있으면 월단위 안분
function mixCompare(S,E,PS,PE,keyFn,chKeyFn){
  if(!filterOn()) return compareRows(STATE.pd,S,E,PS,PE,keyFn);
  var c=chprodAgg(STATE.chFilter,S,E,chKeyFn), p=chprodAgg(STATE.chFilter,PS,PE,chKeyFn);
  var tot=0; Object.keys(c).forEach(function(k){ tot+=v(c[k]); });
  return { total:tot, rows:keysUnion(c,p).map(function(k){
      var cur=v(c[k]), prev=v(p[k]);
      return {name:k, cur:cur, prev:prev, delta:cur-prev, rate:rate(cur,prev), share:tot?cur/tot:0,
              qty:(c[k]||{}).qty||0, cnt:(c[k]||{}).cnt||0, cat:(c[k]||{}).cat||''};
    }).filter(function(r){ return r.cur>0.5||r.prev>0.5; }) };
}
function v(o){ return o?o[mkey()]:0; }
function keysUnion(a,b){ var s={}; Object.keys(a).forEach(function(k){s[k]=1;}); Object.keys(b).forEach(function(k){s[k]=1;}); return Object.keys(s); }
// 비교표 행: [{name, cur, prev, delta, rate, share}]
function compareRows(rows,S,E,PS,PE,keyFn){
  var c=groupSum(rows,S,E,keyFn), p=groupSum(rows,PS,PE,keyFn);
  var tot=0; Object.keys(c).forEach(function(k){ tot+=v(c[k]); });
  return { total:tot, rows:keysUnion(c,p).map(function(k){
      var cur=v(c[k]), prev=v(p[k]);
      return {name:k, cur:cur, prev:prev, delta:cur-prev, rate:rate(cur,prev), share:tot?cur/tot:0, qty:(c[k]||{}).qty||0, cnt:(c[k]||{}).cnt||0};
    }).filter(function(r){ return r.cur!==0||r.prev!==0; }) };
}

function niceTop(v){ if(v<=0)return 1; var p=Math.pow(10,Math.floor(Math.log10(v))); var n=v/p; var m=n<=1?1:n<=2?2:n<=5?5:10; return m*p; }

function lineChart(labels,series){

  var maxV=niceTop(Math.max.apply(null,series.reduce(function(a,s){return a.concat(s.data);},[0])));
  var n=labels.length, dx=n>1?iw/(n-1):0;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';

  series.forEach(function(s){

      svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.4"'+(s.dash?' stroke-dasharray="5 4" opacity="0.75"':'')+'/>'; }

function dailyChart(dates,series,bands){

  var step=Math.max(1,Math.ceil(n/14));
  for(var i=0;i<n;i++){ if(i%step!==0&&i!==n-1)continue;
    svg+='<text x="'+(pad.l+dx*i)+'" y="'+(H-pad.b+18)+'" fill="var(--sub)" font-size="10" text-anchor="middle">'+dates[i].slice(5)+'</text>'; }

    if(n>1){ var d=pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
      svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2"'+(s.dash?' stroke-dasharray="5 4" opacity="0.7"':'')+'/>'; }

}
// 프로모션 캘린더(간트) — 일별 차트와 같은 x축
function promoGantt(dates,items){
  var W=1100,rowH=19,pad={l:210,r:16,t:22,b:26};
  var H=pad.t+pad.b+items.length*rowH;
  var iw=W-pad.l-pad.r, n=dates.length, dx=n>1?iw/(n-1):0;
  var idx={}; dates.forEach(function(d,i){ idx[d]=i; });
  function xOf(d,def){ if(idx[d]!=null) return pad.l+dx*idx[d];
    return d<dates[0]?pad.l:(d>dates[n-1]?pad.l+iw:def); }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  // 월 구분선 + 라벨
  dates.forEach(function(d,i){ if(d.slice(8)!=='01'&&i!==0)return; var x=pad.l+dx*i;
    svg+='<line x1="'+x+'" y1="'+(pad.t-8)+'" x2="'+x+'" y2="'+(H-pad.b+4)+'" stroke="var(--line)"/>';
    svg+='<text x="'+(x+4)+'" y="'+(pad.t-11)+'" fill="var(--sub)" font-size="10">'+(+d.slice(5,7))+'월</text>'; });
  items.forEach(function(p,i){
    var y=pad.t+i*rowH;
    var s=p.start<dates[0]?dates[0]:p.start, e=p.end>dates[n-1]?dates[n-1]:p.end;
    var x1=xOf(s,pad.l), x2=xOf(e,pad.l+iw)+Math.min(dx,9), w=Math.max(x2-x1,4);
    var nm=p.name.length>22?p.name.slice(0,21)+'…':p.name;
    svg+='<text x="'+(pad.l-10)+'" y="'+(y+rowH/2+4)+'" fill="var(--text)" font-size="11.5" text-anchor="end">'+escA(nm)+'</text>';
    svg+='<text x="'+(pad.l-10)+'" y="'+(y+rowH/2+4)+'" fill="transparent" text-anchor="end" font-size="11.5" data-tip="'+escA(p.name+(p.memo?'\n'+p.memo:''))+'">'+escA(nm)+'</text>';
    svg+='<rect x="'+x1.toFixed(1)+'" y="'+(y+3)+'" width="'+w.toFixed(1)+'" height="'+(rowH-8)+'" rx="3" fill="'+p.color+'" opacity="0.9" data-tip="'+escA(p.name+' · '+p.ch+'\n'+p.start+' ~ '+p.end+(p.memo?'\n'+p.memo:'')+(p.tip?'\n'+p.tip:''))+'"/>';
    if(p.days<=1) svg+='<circle cx="'+(x1+w/2).toFixed(1)+'" cy="'+(y+rowH/2-1)+'" r="4" fill="'+p.color+'"/>';
  });
  svg+='</svg>'; var d=el('div'); d.innerHTML=svg; attachTips(d); return d;
}
function donut(arr,total){
  var W=260,H=200,cx=100,cy=100,rO=82,rI=48;
  var svg='<svg viewBox="0 0 '+W+' '+H+'">', ang=-Math.PI/2;
  arr.forEach(function(x,i){ var frac=total?x.val/total:0, a2=ang+frac*Math.PI*2, lg=frac>0.5?1:0;
    var x1=cx+rO*Math.cos(ang),y1=cy+rO*Math.sin(ang),x2=cx+rO*Math.cos(a2),y2=cy+rO*Math.sin(a2);
    var xi2=cx+rI*Math.cos(a2),yi2=cy+rI*Math.sin(a2),xi1=cx+rI*Math.cos(ang),yi1=cy+rI*Math.sin(ang);
    svg+='<path d="M'+x1+' '+y1+' A'+rO+' '+rO+' 0 '+lg+' 1 '+x2+' '+y2+' L'+xi2+' '+yi2+' A'+rI+' '+rI+' 0 '+lg+' 0 '+xi1+' '+yi1+' Z" fill="'+COLORS[i%COLORS.length]+'" data-tip="'+escA(x.name+' · '+wonFull(x.val)+' ('+(frac*100).toFixed(1)+'%)')+'"/>';
    ang=a2; });
  svg+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">'+won(total)+'</text>';
  svg+='<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" fill="var(--sub)" font-size="10">합계</text>';
  svg+='</svg>'; var d=el('div'); d.innerHTML=svg; attachTips(d); return d;
}
// 전년 대비 증감액 다이버징 바
function deltaBars(items){
  var W=1100,rowH=30,pad={l:170,r:120,t:8,b:8};
  var H=pad.t+pad.b+items.length*rowH;
  var iw=W-pad.l-pad.r, cx=pad.l+iw/2, half=iw/2;
  var maxAbs=Math.max.apply(null,items.map(function(x){return Math.abs(x.delta);}).concat([1]));
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  svg+='<line x1="'+cx+'" y1="'+pad.t+'" x2="'+cx+'" y2="'+(H-pad.b)+'" stroke="var(--line)"/>';
  items.forEach(function(x,i){
    var y=pad.t+i*rowH, w=Math.abs(x.delta)/maxAbs*half*0.95;
    var pos=x.delta>=0, bx=pos?cx:cx-w, col=pos?'var(--good)':'var(--bad)';
    svg+='<text x="'+(pad.l-10)+'" y="'+(y+rowH/2+4)+'" fill="var(--text)" font-size="13" text-anchor="end">'+escA(x.name)+'</text>';
    svg+='<rect x="'+bx+'" y="'+(y+6)+'" width="'+Math.max(w,1)+'" height="'+(rowH-14)+'" rx="3" fill="'+col+'" opacity="0.85" data-tip="'+escA(x.name+' · 전년 대비 '+(pos?'+':'-')+wonFull(Math.abs(x.delta))+' ('+pctS(x.rate)+')')+'"/>';
    var tx=pos?(cx+w+8):(cx-w-8);
    svg+='<text x="'+tx+'" y="'+(y+rowH/2+4)+'" fill="'+col+'" font-size="12" font-weight="700" text-anchor="'+(pos?'start':'end')+'">'+(pos?'+':'-')+won(Math.abs(x.delta))+'</text>';
  });
  svg+='</svg>'; var d=el('div'); d.innerHTML=svg; attachTips(d); return d;
}

/* --- 3. 시즌 아크 --- */
function weekSeries(S,E,offsetYears){
  var s=offsetYears?shiftYear(S,offsetYears):S, e=offsetYears?shiftYear(E,offsetYears):E;
  var nWeeks=Math.ceil(daysBetween(s,e)/7), arr=[]; for(var i=0;i<nWeeks;i++)arr.push(0);
  STATE.daily.forEach(function(r){ if(r.date>=s&&r.date<=e&&chIn(r.ch)){
    var idx=Math.floor((daysBetween(s,r.date)-1)/7); if(idx>=0&&idx<nWeeks) arr[idx]+=r[mkey()]; } });
  return arr;
}

/* --- 담당 채널 & 프로모션 효과 --- */
// 이 섹션이 다룰 채널 = 상단 채널 필터(걸려 있으면) 아니면 담당 채널
function promoChList(){ return filterOn()? STATE.chFilter : CONFIG.MY_CHANNELS; }
function chSelList(){
  var src=promoChList(), sig=src.join('|');
  if(STATE._chSelSrc!==sig){ STATE.myChSel=src.slice(); STATE._chSelSrc=sig; }
  if(!STATE.myChSel||!STATE.myChSel.length) STATE.myChSel=src.slice();
  return STATE.myChSel;
}
function dateRangeList(s,e){ var out=[],d=s; while(d<=e){ out.push(d); d=addDays(d,1); } return out; }
function dailyMapFor(chList){
  var set={}; chList.forEach(function(c){ set[c]=1; });
  var m={}; STATE.daily.forEach(function(r){ if(set[chDisp(r.ch)]) m[r.date]=(m[r.date]||0)+r[mkey()]; });
  return m;
}
function sumWin(map,s,e){ var t=0,d=s; while(d<=e){ t+=map[d]||0; d=addDays(d,1); } return t; }
function median(arr){ if(!arr.length)return 0; var a=arr.slice().sort(function(x,y){return x-y;}); var h=Math.floor(a.length/2);
  return a.length%2?a[h]:(a[h-1]+a[h])/2; }
function promoChannels(p){ return p.ch==='담당 전체'? chSelList() : [p.ch]; }
function promoStats(p,S,E){
  var map=dailyMapFor(promoChannels(p));
  // 프로모션 실제 기간 기준(선택 기간보다 앞서 시작해도 그대로) · 데이터 없는 미래 구간만 잘라냄
  var ps=p.start, pe=p.end>STATE.maxDate?STATE.maxDate:p.end;
  if(pe<ps) pe=ps;
  var len=daysBetween(ps,pe);
  var cur=sumWin(map,ps,pe), curAvg=len?cur/len:0;
  var bs=addDays(ps,-len), be=addDays(ps,-1);
  var prev=sumWin(map,bs,be), prevAvg=len?prev/len:0;
  var yoy=sumWin(map,shiftYear(ps,-1),shiftYear(pe,-1)), yoyAvg=len?yoy/len:0;
  var seasonDays=daysBetween(S,E), season=sumWin(map,S,E), seasonAvg=seasonDays?season/seasonDays:0;
  var as=addDays(pe,1), ae=addDays(pe,len);
  var aeC=ae>STATE.maxDate?STATE.maxDate:ae;
  var afterDays=as<=aeC?daysBetween(as,aeC):0;
  var after=afterDays?sumWin(map,as,aeC):0, afterAvg=afterDays?after/afterDays:NaN;
  return { ps:ps, pe:pe, len:len, cur:cur, curAvg:curAvg,
    prevAvg:prevAvg, prevRate:rate(curAvg,prevAvg),
    yoyAvg:yoyAvg, yoyRate:rate(curAvg,yoyAvg),
    seasonAvg:seasonAvg, seasonX:seasonAvg?curAvg/seasonAvg:0,
    afterAvg:afterAvg, afterDays:afterDays, afterRate:afterDays?rate(afterAvg,curAvg):NaN,
    ongoing:(p.end>STATE.maxDate) };
}
function detectSpikes(ch,S,E){
  var map=dailyMapFor([ch]);
  var days=dateRangeList(S,E), out=[], flags=[];
  days.forEach(function(d){
    var hist=[]; for(var k=1;k<=14;k++){ var pd=addDays(d,-k); hist.push(map[pd]||0); }
    var base=median(hist), val=map[d]||0;
    flags.push(val>=Math.max(base*2, 2000000) && val>0 && base>0 ? true : (base===0&&val>=3000000));
  });
  var i=0;
  while(i<days.length){
    if(!flags[i]){ i++; continue; }
    var j=i; while(j+1<days.length && (flags[j+1]||flags[j+2])) j++;
    var s=days[i], e=days[j];
    var tot=sumWin(map,s,e);
    if(tot>=3000000) out.push({ch:ch, start:s, end:e, total:tot});
    i=j+1;
  }
  return out.sort(function(a,b){return b.total-a.total;}).slice(0,6);
}

function renderProduct(app,S,E,PS,PE){
  var rp=mixCompare(S,E,PS,PE,function(x){ return x.prod||'(미상)'; },function(x){ return x.prod||'(미상)'; });
  var catOf={}; STATE.pd.forEach(function(r){ if(r.date>=S&&r.date<=E&&r.prod&&!catOf[r.prod]) catOf[r.prod]=r.cat; });
  rp.rows.forEach(function(r){ if(r.cat&&!catOf[r.name]) catOf[r.name]=r.cat; });
  var c=section('히어로 제품 & 신제품','기간 '+mlabel()+' 상위 제품과 전년 대비 증감 · '+filterLabel(),
    '이번 여름 매출을 끌고 간 제품, 새로 들어온 제품, 작년보다 빠진 제품을 한 화면에서 봅니다.');
  if(filterOn()) c.appendChild(el('div',{class:'notice small',style:'margin:0 0 12px'},
    '채널 필터 적용 중 — 제품 수치는 <b>월 단위 채널×제품 집계</b>를 일수 비율로 안분한 근사치입니다. 첫 판매일(신규 제품 판정)은 전 채널 기준입니다.'));

  var top=rp.rows.slice().sort(function(a,b){return b.cur-a.cur;});
  var top3=top.slice(0,3).reduce(function(s,x){return s+x.cur;},0);
  var top10=top.slice(0,10).reduce(function(s,x){return s+x.cur;},0);
  var chips=el('div',{class:'chips',style:'margin-bottom:12px'});
  chips.appendChild(el('div',{class:'chip'},'집계 제품 수<b>'+top.filter(function(x){return x.cur>0;}).length+'개</b>'));
  chips.appendChild(el('div',{class:'chip'},'TOP3 집중도<b>'+(rp.total?(top3/rp.total*100).toFixed(1):0)+'% ('+won(top3)+')</b>'));
  chips.appendChild(el('div',{class:'chip'},'TOP10 집중도<b>'+(rp.total?(top10/rp.total*100).toFixed(1):0)+'% ('+won(top10)+')</b>'));
  c.appendChild(chips);

  c.appendChild(tableOf(['제품','카테고리',mlabel(),'비중','전년','YoY','증감액','수량'],
    top.map(function(x){ return [x.name,catOf[x.name]||'',x.cur,x.share,x.prev,x.rate,x.delta,x.qty]; }),
    ['text','text','won','share','won','pct','delta','num'],'prod',mlabel(),false));

  // 신제품 / 급감
  var news=top.filter(function(x){ return x.prev===0 && x.cur>0 && STATE.firstSeen[x.name] && STATE.firstSeen[x.name]>=shiftYear(S,-1); })
              .sort(function(a,b){return b.cur-a.cur;}).slice(0,6);
  var drops=rp.rows.slice().sort(function(a,b){return a.delta-b.delta;}).slice(0,6);
  var g=el('div',{class:'grid2',style:'margin-top:14px'});
  var l=el('div');
  l.appendChild(el('div',{style:'font-weight:700;margin-bottom:8px'},'🆕 지난 시즌 이후 신규 제품 <span class="small muted" style="font-weight:400">(전년 동기 매출 0 · 첫 판매일이 전년 시즌 시작 이후)</span>'));
  if(!news.length) l.appendChild(el('div',{class:'notice small'},'해당 기간에 신규 제품이 없습니다.'));
  news.forEach(function(x){
    var d=el('div',{class:'newp',style:'margin-bottom:8px'});
    d.appendChild(el('div',{class:'n'},x.name+' <span class="small muted">'+(catOf[x.name]||'')+'</span>'));
    d.appendChild(el('div',{class:'small muted'},'첫 판매 '+(STATE.firstSeen[x.name]||'-')+' · '+wonFull(x.cur)+' · 시즌 매출의 '+(rp.total?(x.cur/rp.total*100).toFixed(1):0)+'%'));
    l.appendChild(d);
  });
  var newSum=news.reduce(function(s,x){return s+x.cur;},0);
  if(news.length) l.appendChild(el('div',{class:'small muted'},'신제품 합계 '+wonFull(newSum)+' · 시즌 '+mlabel()+'의 '+(rp.total?(newSum/rp.total*100).toFixed(1):0)+'%'));
  g.appendChild(l);
  var rr=el('div');
  rr.appendChild(el('div',{style:'font-weight:700;margin-bottom:8px'},'📉 전년 대비 가장 많이 빠진 제품'));
  rr.appendChild(tableOf(['제품','올해','전년','증감액'],
    drops.map(function(x){return [x.name,x.cur,x.prev,x.delta];}),['text','won','won','delta'],'drop','증감액',true));
  g.appendChild(rr);
  c.appendChild(g);
  endSection(app,c,'product','예: 히어로 제품·신제품 성과와 재고·소싱 메모');
}

/* --- 8. 채널 x 제품 --- */
function renderCross(app,S,E){
  if(!STATE.chprod.length) return;
  var ymS=S.slice(0,7), ymE=E.slice(0,7);
  var rows=STATE.chprod.filter(function(r){ return r.ym>=ymS&&r.ym<=ymE&&chIn(r.ch); });
  if(!rows.length) return;
  var chSum={}; rows.forEach(function(r){ var k=chDisp(r.ch); chSum[k]=(chSum[k]||0)+r[mkey()]; });
  var chs=Object.keys(chSum).sort(function(a,b){return chSum[b]-chSum[a];});
  if(!STATE.crossCh||chs.indexOf(STATE.crossCh)<0) STATE.crossCh=chs[0];
  var c=section('채널 × 제품 — 채널마다 무엇이 팔렸나','월 단위 집계('+ymS+' ~ '+ymE+')',
    '채널별 주력 제품을 확인합니다. 이 표만 월 단위 집계라 기간 경계에서 위 수치와 소폭 다를 수 있습니다.');
  var bar=el('div',{class:'bar',style:'margin-top:0'});
  bar.appendChild(el('span',{class:'small muted'},'채널 선택'));
  var sel=el('select',{class:'tinput'});
  chs.forEach(function(ch){ var o=el('option',{value:ch},ch+' · '+won(chSum[ch])); if(ch===STATE.crossCh)o.setAttribute('selected','selected'); sel.appendChild(o); });
  sel.onchange=function(){ STATE.crossCh=sel.value; render(); };
  bar.appendChild(sel);
  c.appendChild(bar);
  var pm={}; rows.forEach(function(r){ if(chDisp(r.ch)!==STATE.crossCh)return;
    var k=r.prod||'(미상)'; var x=pm[k]||(pm[k]={val:0,cat:r.cat,qty:0}); x.val+=r[mkey()]; x.qty+=r.qty; });
  var tot=0; Object.keys(pm).forEach(function(k){tot+=pm[k].val;});
  var prows=Object.keys(pm).map(function(k){ return [k,pm[k].cat||'',pm[k].val,tot?pm[k].val/tot:0,pm[k].qty]; });
  c.appendChild(tableOf(['제품','카테고리',mlabel(),'채널 내 비중','수량'],prows,['text','text','won','share','num'],'cross',mlabel(),true));
  endSection(app,c,'cross','예: 채널별 주력 제품 배치 메모');
}

/* --- 9. 인사이트 --- */
function renderInsights(app,S,E,PS,PE){
  var cur=totalsDaily(S,E), prev=totalsDaily(PS,PE);
  var ch=compareRows(STATE.daily,S,E,PS,PE,function(x){return chDisp(x.ch);});
  var pr=mixCompare(S,E,PS,PE,function(x){return x.prod||"(미상)";},function(x){return x.prod||"(미상)";});
  var ct=mixCompare(S,E,PS,PE,function(x){return x.cat||"(미분류)";},function(x){return x.cat||"(미분류)";});
  var chUp=ch.rows.slice().sort(function(a,b){return b.delta-a.delta;});
  var chDn=ch.rows.slice().sort(function(a,b){return a.delta-b.delta;});
  var prTop=pr.rows.slice().sort(function(a,b){return b.cur-a.cur;});
  var prUp=pr.rows.slice().sort(function(a,b){return b.delta-a.delta;});
  var prDn=pr.rows.slice().sort(function(a,b){return a.delta-b.delta;});
  var ctTop=ct.rows.slice().sort(function(a,b){return b.cur-a.cur;});
  var weeks=weekSeries(S,E,0);
  var maxW=0,maxI=0; weeks.forEach(function(v,i){ if(v>maxW){maxW=v;maxI=i;} });
  var lastFull=weeks.length>1?weeks[weeks.length-2]:weeks[0];
  var news=prTop.filter(function(x){ return x.prev===0&&x.cur>0&&STATE.firstSeen[x.name]&&STATE.firstSeen[x.name]>=shiftYear(S,-1); });
  var newSum=news.reduce(function(s,x){return s+x.cur;},0);
  var top3=prTop.slice(0,3);

  var L=[];
  L.push('<b>시즌 '+mlabel()+' '+wonP(cur.val)+'</b>, 전년 동기간 '+wonP(prev.val)+' 대비 <b class="'+(cur.val>=prev.val?'pos':'neg')+'">'+pctS(rate(cur.val,prev.val))+'</b> ('+(cur.val-prev.val>=0?'+':'')+wonP(cur.val-prev.val)+'). 주문 '+Math.round(cur.cnt).toLocaleString()+'건, 건단가 '+wonP(cur.cnt?cur.val/cur.cnt:0)+' ('+pctS(rate(cur.cnt?cur.val/cur.cnt:0, prev.cnt?prev[mkey()]/prev.cnt:0))+').');
  if(chUp.length) L.push('성장을 끌고 간 채널: '+chUp.slice(0,3).map(function(x){ return '<b>'+x.name+'</b> +'+wonP(x.delta)+' ('+pctS(x.rate)+')'; }).join(' · ')+'.');
  if(chDn.length&&chDn[0].delta<0) L.push('반대로 빠진 채널: '+chDn.slice(0,3).filter(function(x){return x.delta<0;}).map(function(x){ return '<b>'+x.name+'</b> '+wonP(x.delta)+' ('+pctS(x.rate)+')'; }).join(' · ')+'.');
  if(ctTop.length) L.push('카테고리 1위는 <b>'+ctTop[0].name+'</b> '+wonP(ctTop[0].cur)+' (비중 '+(ct.total?(ctTop[0].cur/ct.total*100).toFixed(1):0)+'%, 전년비 '+pctS(ctTop[0].rate)+'), 2위 '+(ctTop[1]?ctTop[1].name+' '+wonP(ctTop[1].cur)+' ('+pctS(ctTop[1].rate)+')':'-')+'.');
  if(top3.length) L.push('히어로 제품 TOP3: '+top3.map(function(x){return '<b>'+x.name+'</b> '+wonP(x.cur);}).join(' · ')+' — 셋이 시즌 '+mlabel()+'의 '+(pr.total?(top3.reduce(function(s,x){return s+x.cur;},0)/pr.total*100).toFixed(1):0)+'%.');
  if(news.length) L.push('지난 시즌 이후 들어온 신규 제품 '+news.length+'종이 <b>'+wonP(newSum)+'</b> (시즌의 '+(pr.total?(newSum/pr.total*100).toFixed(1):0)+'%) 기여 — 대표: '+news.slice(0,3).map(function(x){return x.name+' '+wonP(x.cur);}).join(', ')+'.');
  if(prUp.length) L.push('전년 대비 가장 크게 성장한 제품: '+prUp.slice(0,3).map(function(x){return '<b>'+x.name+'</b> +'+wonP(x.delta);}).join(' · ')+'. 가장 크게 빠진 제품: '+prDn.slice(0,2).map(function(x){return '<b>'+x.name+'</b> '+wonP(x.delta);}).join(' · ')+'.');
  var myMap=dailyMapFor(chSelList()), myCur=sumWin(myMap,S,E), myPrev=sumWin(myMap,shiftYear(S,-1),shiftYear(E,-1));
  L.push('담당 채널('+chSelList().join('·')+') 합계 <b>'+wonP(myCur)+'</b> — 전사의 '+(cur.val?(myCur/cur.val*100).toFixed(1):0)+'%, 전년 동기 대비 '+pctS(rate(myCur,myPrev))+'.');
  var pl=STATE.promos.filter(function(p){ return p.start<=E&&p.end>=S; }).map(function(p){ var st=promoStats(p,S,E); return {p:p,st:st}; })
    .filter(function(x){ return isFinite(x.st.prevRate); }).sort(function(a,b){ return b.st.prevRate-a.st.prevRate; });
  if(pl.length){
    var best=pl[0];
    L.push('프로모션 '+pl.length+'건 중 리프트 1위는 <b>'+best.p.name+'</b> ('+best.p.ch+', '+best.st.ps.slice(5)+'~'+best.st.pe.slice(5)+') — 일평균 '+wonP(best.st.curAvg)+' · 직전 동일 일수 대비 '+pctS(best.st.prevRate)+' · 시즌 일평균의 '+best.st.seasonX.toFixed(1)+'배'+(isFinite(best.st.afterRate)?', 종료 후 '+pctS(best.st.afterRate):'')+'.');
  }
  L.push('시즌 곡선: 피크는 <b>'+addDays(S,maxI*7).slice(5)+' 주</b> ('+wonP(maxW)+'), 최근 완료 주 '+wonP(lastFull)+' — 피크 대비 '+(maxW?((lastFull/maxW-1)*100).toFixed(0):0)+'%. '+(lastFull<maxW*0.6?'시즌 수요가 꺾이는 구간에 들어섰습니다.':'아직 시즌 수요가 유지되고 있습니다.'));

  var c=section('한 장 요약','자동 생성 · 숫자는 위 표와 동일 기준','아래 문장은 현재 선택한 기간·지표 기준으로 자동 계산됩니다.');
  var ul=el('ul',{class:'bullets'});
  L.forEach(function(t){ ul.appendChild(el('li',null,t)); });
  c.appendChild(ul);
  var bar=el('div',{class:'bar',style:'margin-top:12px'});
  var b=el('button',{class:'btn'},'📋 요약 + 코멘트 복사');
  b.onclick=function(){
    var txt='['+(+S.slice(0,4))+' 여름 시즌 리캡] '+S+' ~ '+E+' ('+mlabel()+' 기준)\n\n'
      + L.map(function(t){ return '- '+t.replace(/<[^>]+>/g,''); }).join('\n')
      + notesAsText();
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ b.textContent='✅ 복사됨'; setTimeout(function(){b.textContent='📋 요약 + 코멘트 복사';},1500); }); }
    else { var ta=el('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); b.textContent='✅ 복사됨'; }
  };
  var bx=el('button',{class:'btn'},'📤 코멘트 내보내기');
  bx.onclick=function(){ var txt=JSON.stringify(STATE.notes,null,2);
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt);
    window.prompt('아래 JSON을 HTML의 CONFIG.NOTES 에 붙여 넣으면 모든 사람에게 같은 코멘트가 보입니다. (클립보드에도 복사됨)',txt); };
  var bi=el('button',{class:'btn'},'📥 코멘트 가져오기');
  bi.onclick=function(){ var t=window.prompt('코멘트 JSON을 붙여 넣으세요','');
    if(!t)return; try{ var o=JSON.parse(t); if(o&&typeof o==='object'){ STATE.notes=o; saveNotes(); render(); } else alert('객체 형식이 아닙니다.'); }
    catch(e){ alert('JSON 형식 오류: '+e); } };
  bar.appendChild(b); bar.appendChild(bx); bar.appendChild(bi);
  c.appendChild(bar);
  endSection(app,c,'summary','예: 이번 시즌 총평과 다음 시즌 액션 아이템');
}
// 저장된 코멘트를 텍스트로 (복사·공유용)
var NOTE_LABELS={overall:'시즌 총평',arc:'시즌 아크',channel:'채널별 성적표',promo:'담당 채널 & 프로모션',mix:'카테고리 믹스',product:'제품',cross:'채널 × 제품',summary:'한 장 요약'};
function notesAsText(){
  var keys=Object.keys(NOTE_LABELS).filter(function(k){ return noteObj(k); });
  if(!keys.length) return '';
  return '\n\n[코멘트]\n'+keys.map(function(k){ var n=noteObj(k);
    return '■ '+NOTE_LABELS[k]+(n.at?' ('+n.at+')':'')+'\n'+n.text; }).join('\n\n');
}

/* ============================ 잠금 ============================ */
var PW_HASH='1d88a063de73ba7681894885d98427139c654905f84115d1c94963c1ffd5c340';
var _loaded=false;
function reveal(){ document.getElementById('gate').style.display='none'; if(!_loaded){ _loaded=true; load(); } }
async function sha256hex(s){
  if(window.crypto&&crypto.subtle){ var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  return null;
}
async function tryUnlock(){
  var v=document.getElementById('gatePw').value;
  var h=await sha256hex(v);
  if(h===PW_HASH){ try{sessionStorage.setItem('pcmd_unlocked','1');}catch(e){} reveal(); }
  else { document.getElementById('gateErr').textContent='비밀번호가 올바르지 않습니다.'; document.getElementById('gatePw').select(); }
}
document.getElementById('gateBtn').addEventListener('click',tryUnlock);
document.getElementById('gatePw').addEventListener('keydown',function(e){ if(e.key==='Enter')tryUnlock(); });
if(sessionStorage.getItem('pcmd_unlocked')==='1'){ reveal(); }
else { setTimeout(function(){ var f=document.getElementById('gatePw'); if(f)f.focus(); },100); }
</script>
